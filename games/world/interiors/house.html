function makeTextTexture(text, bgHex, textColor, w, h, fontPx) {
    w = w || 512;
    h = h || 128;
    fontPx = fontPx || 60;
    const canvas = document.createElement('canvas');
    canvas.width = w;
    canvas.height = h;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#' + bgHex.toString(16).padStart(6, '0');
    ctx.fillRect(0, 0, w, h);
    ctx.fillStyle = textColor;
    ctx.font = 'bold ' + fontPx + 'px Arial';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(text, w / 2, h / 2);
    const tex = new THREE.CanvasTexture(canvas);
    tex.anisotropy = 8;
    return tex;
}

function makeBookSpineTexture(title, colorHex) {
    const canvas = document.createElement('canvas');
    canvas.width = 128;
    canvas.height = 512;
    const ctx = canvas.getContext('2d');
    const color = '#' + colorHex.toString(16).padStart(6, '0');
    ctx.fillStyle = color;
    ctx.fillRect(0, 0, 128, 512);

    const darker = shade(color, -0.25);
    ctx.fillStyle = darker;
    ctx.fillRect(0, 0, 128, 16);
    ctx.fillRect(0, 496, 128, 16);
    ctx.fillRect(0, 0, 10, 512);
    ctx.fillRect(118, 0, 10, 512);

    ctx.save();
    ctx.translate(64, 256);
    ctx.rotate(-Math.PI / 2);
    ctx.fillStyle = '#f7e7c8';
    ctx.font = 'bold 32px Georgia, serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    let text = title;
    const maxWidth = 440;
    while (ctx.measureText(text).width > maxWidth && text.length > 3) {
        text = text.slice(0, -1);
    }
    if (text !== title) text = text.slice(0, -1) + '…';
    ctx.fillText(text, 0, 0);
    ctx.restore();

    const tex = new THREE.CanvasTexture(canvas);
    tex.anisotropy = 8;
    tex.minFilter = THREE.LinearFilter;
    tex.generateMipmaps = false;
    return tex;
}

function shade(hex, pct) {
    const n = parseInt(hex.slice(1), 16);
    let r = (n >> 16) & 0xff;
    let g = (n >> 8) & 0xff;
    let b = n & 0xff;
    r = Math.max(0, Math.min(255, Math.round(r + 255 * pct)));
    g = Math.max(0, Math.min(255, Math.round(g + 255 * pct)));
    b = Math.max(0, Math.min(255, Math.round(b + 255 * pct)));
    return '#' + ((r << 16) | (g << 8) | b).toString(16).padStart(6, '0');
}

function addBoxCollider(cx, cz, w, d, r) {
    r = r || 0.9;
    const spanX = Math.max(w - r * 2, 0);
    const count = Math.max(Math.ceil(spanX / (r * 1.4)), 1);
    if (count === 1) {
        Engine.addCollider(cx, cz, r);
        return;
    }
    const step = spanX / (count - 1);
    for (let i = 0; i < count; i++) {
        Engine.addCollider(cx - spanX / 2 + i * step, cz, r);
    }
    const depthPad = d / 2;
    if (depthPad > r) {
        for (let i = 0; i < count; i++) {
            const x = cx - spanX / 2 + i * step;
            Engine.addCollider(x, cz + (depthPad - r) * 1.2, r * 0.9);
            Engine.addCollider(x, cz - (depthPad - r) * 1.2, r * 0.9);
        }
    }
}

function flashPrompt(text) {
    const p = document.getElementById('prompt');
    if (!p) return;
    const orig = p.textContent;
    p.textContent = text;
    p.style.display = 'block';
    setTimeout(() => { p.textContent = orig; }, 1600);
}

function setChannelHud(num, name) {
    const hud = document.getElementById('channel-hud');
    const n = document.getElementById('ch-num');
    const nm = document.getElementById('ch-name');
    if (!hud || !n || !nm) return;
    hud.style.display = 'block';
    n.textContent = String(num).padStart(2, '0');
    nm.textContent = name;
}

function fisherYates(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        const t = arr[i]; arr[i] = arr[j]; arr[j] = t;
    }
}

async function loadArticles() {
    try {
        const res = await fetch(ARTICLES_JSON);
        const data = await res.json();
        data.sort((a, b) => b.id - a.id);
        libraryArticles = data;
    } catch (e) {
        console.warn('Could not load articles:', e);
        libraryArticles = [];
    }
}

async function loadTVData() {
    try {
        const res = await fetch(VIDEOS_JSON);
        videoData = await res.json();
    } catch (e) {
        console.warn('videos load failed', e);
    }
    try {
        const res = await fetch(COMMERCIALS_JSON);
        adList = await res.json();
    } catch (e) {
        console.warn('commercials load failed', e);
    }
}

function buildRoom() {
    const S = Engine.scene;

    S.add(new THREE.HemisphereLight(0xffe8c8, 0x2a1810, 0.55));
    S.add(new THREE.AmbientLight(0xffffff, 0.5));

    buildFloor(S);
    buildCeiling(S);
    buildWalls(S);
    buildCeilingLights(S);
    buildTVWall(S);
    buildSeating(S);
    buildSideDecor(S);
    buildLibraryWall(S);
    buildExit(S);
}

function buildFloor(S) {
    const floorMat = new THREE.MeshLambertMaterial({ color: 0x4a2c14 });
    const floor = new THREE.Mesh(
        new THREE.BoxGeometry(ROOM.maxX - ROOM.minX + WALL_T * 2, 0.2, ROOM.maxZ - ROOM.minZ + WALL_T * 2),
        floorMat
    );
    floor.position.set(0, -0.1, (ROOM.minZ + ROOM.maxZ) / 2);
    floor.receiveShadow = true;
    S.add(floor);

    const rugBorder = new THREE.Mesh(
        new THREE.PlaneGeometry(22, 17),
        new THREE.MeshLambertMaterial({ color: 0x2a1a0c })
    );
    rugBorder.rotation.x = -Math.PI / 2;
    rugBorder.position.set(0, 0.003, 2);
    S.add(rugBorder);

    const rug = new THREE.Mesh(
        new THREE.PlaneGeometry(21, 16),
        new THREE.MeshLambertMaterial({ color: 0x6b2020 })
    );
    rug.rotation.x = -Math.PI / 2;
    rug.position.set(0, 0.005, 2);
    rug.receiveShadow = true;
    S.add(rug);
}

function buildCeiling(S) {
    const ceilMat = new THREE.MeshLambertMaterial({ color: 0x2a1a0c });
    const ceiling = new THREE.Mesh(
        new THREE.PlaneGeometry(ROOM.maxX - ROOM.minX + WALL_T * 2, ROOM.maxZ - ROOM.minZ + WALL_T * 2),
        ceilMat
    );
    ceiling.rotation.x = Math.PI / 2;
    ceiling.position.set(0, WALL_H, (ROOM.minZ + ROOM.maxZ) / 2);
    S.add(ceiling);
}

function buildWalls(S) {
    const wallMat = new THREE.MeshLambertMaterial({ color: 0x8a6a4a });
    const trimMat = new THREE.MeshLambertMaterial({ color: 0xba1a1a });

    const HX = ROOM.maxX + WALL_T / 2;
    const HZ = ROOM.maxZ + WALL_T / 2;
    const LX = ROOM.minX - WALL_T / 2;
    const LZ = ROOM.minZ - WALL_T / 2;

    const mk = (cx, cz, w, d) => {
        const wall = new THREE.Mesh(new THREE.BoxGeometry(w, WALL_H, d), wallMat);
        wall.position.set(cx, WALL_H / 2, cz);
        wall.castShadow = true;
        wall.receiveShadow = true;
        S.add(wall);
        addBoxCollider(cx, cz, w, d, 0.4);
    };

    mk(0, LZ, ROOM.maxX - ROOM.minX + WALL_T * 2, WALL_T);
    mk(0, HZ, ROOM.maxX - ROOM.minX + WALL_T * 2, WALL_T);
    mk(LX, (ROOM.minZ + ROOM.maxZ) / 2, WALL_T, ROOM.maxZ - ROOM.minZ);
    mk(HX, (ROOM.minZ + ROOM.maxZ) / 2, WALL_T, ROOM.maxZ - ROOM.minZ);

    const mkTrimH = (cx, cz, w) => {
        const t = new THREE.Mesh(new THREE.BoxGeometry(w, 0.15, 0.08), trimMat);
        t.position.set(cx, WALL_H - 0.25, cz);
        S.add(t);
        const t2 = new THREE.Mesh(new THREE.BoxGeometry(w, 0.1, 0.08), trimMat);
        t2.position.set(cx, 1.0, cz);
        S.add(t2);
    };

    mkTrimH(0, ROOM.minZ + 0.2, ROOM.maxX - ROOM.minX);
    mkTrimH(0, ROOM.maxZ - 0.2, ROOM.maxX - ROOM.minX);
}

function buildCeilingLights(S) {
    const bulbMat = new THREE.MeshBasicMaterial({ color: 0xffe4a0 });
    const fixtureMat = new THREE.MeshLambertMaterial({ color: 0x1a0e04, side: THREE.DoubleSide });
    const cordMat = new THREE.MeshLambertMaterial({ color: 0x0a0604 });

    const positions = [
        [-9, -6], [9, -6],
        [-9, 2],  [9, 2],
        [-9, 10], [9, 10],
        [-5, 10], [0, 10], [5, 10]
    ];

    positions.forEach(p => {
        const cordLen = 1.6;
        const cord = new THREE.Mesh(
            new THREE.CylinderGeometry(0.025, 0.025, cordLen, 6),
            cordMat
        );
        cord.position.set(p[0], WALL_H - cordLen / 2, p[1]);
        S.add(cord);

        const shade = new THREE.Mesh(
            new THREE.ConeGeometry(0.7, 0.65, 18, 1, true),
            fixtureMat
        );
        shade.position.set(p[0], WALL_H - cordLen - 0.32, p[1]);
        shade.rotation.x = Math.PI;
        S.add(shade);

        const bulb = new THREE.Mesh(
            new THREE.SphereGeometry(0.22, 12, 10),
            bulbMat
        );
        bulb.position.set(p[0], WALL_H - cordLen - 0.55, p[1]);
        S.add(bulb);

        const light = new THREE.PointLight(0xffe4a0, 0.6, 18);
        light.position.set(p[0], WALL_H - cordLen - 0.7, p[1]);
        S.add(light);
    });

    const spotMat = new THREE.MeshBasicMaterial({ color: 0xfff0c0 });
    const spots = [
        [-6, -8.5], [6, -8.5]
    ];
    spots.forEach(p => {
        const housing = new THREE.Mesh(
            new THREE.CylinderGeometry(0.25, 0.25, 0.2, 12),
            fixtureMat
        );
        housing.position.set(p[0], WALL_H - 0.1, p[1]);
        S.add(housing);

        const lens = new THREE.Mesh(
            new THREE.CylinderGeometry(0.2, 0.2, 0.04, 12),
            spotMat
        );
        lens.position.set(p[0], WALL_H - 0.21, p[1]);
        S.add(lens);

        const sl = new THREE.SpotLight(0xffe4a0, 0.7, 14, Math.PI / 6, 0.5);
        sl.position.set(p[0], WALL_H - 0.25, p[1]);
        sl.target.position.set(p[0], 1.8, p[1] + 4);
        S.add(sl);
        S.add(sl.target);
    });

    const entryLight = new THREE.PointLight(0xffe4a0, 0.7, 12);
    entryLight.position.set(0, WALL_H - 1.2, 8);
    S.add(entryLight);

    const floorLampMat = new THREE.MeshLambertMaterial({ color: 0x1a1a1a });
    [-12.5, 12.5].forEach(x => {
        const pole = new THREE.Mesh(
            new THREE.CylinderGeometry(0.06, 0.06, 3.2, 10),
            floorLampMat
        );
        pole.position.set(x, 1.6, -7);
        S.add(pole);

        const base = new THREE.Mesh(
            new THREE.CylinderGeometry(0.35, 0.4, 0.1, 16),
            floorLampMat
        );
        base.position.set(x, 0.05, -7);
        S.add(base);

        const shade = new THREE.Mesh(
            new THREE.CylinderGeometry(0.35, 0.45, 0.55, 16, 1, true),
            new THREE.MeshLambertMaterial({ color: 0xba1a1a, emissive: 0x3a0a0a, side: THREE.DoubleSide })
        );
        shade.position.set(x, 3.45, -7);
        S.add(shade);

        const bulb = new THREE.Mesh(
            new THREE.SphereGeometry(0.14, 10, 8),
            new THREE.MeshBasicMaterial({ color: 0xffe4a0 })
        );
        bulb.position.set(x, 3.4, -7);
        S.add(bulb);

        const ll = new THREE.PointLight(0xffd0a0, 0.55, 10);
        ll.position.set(x, 3.3, -7);
        S.add(ll);

        addBoxCollider(x, -7, 0.9, 0.9, 0.55);
    });
}

function populateBookshelf(group, boardYs, boardT, SW, SD, SH, articles) {
    const bookColors = [
        0x8b2020, 0x20408b, 0x208b40, 0x8b8b20, 0x8b208b,
        0x8b4a20, 0x20208b, 0x3a6b3a, 0x6b3a6b, 0x8b6b20,
        0x4a2c14, 0x6b2020, 0x2a3a48, 0x3a2010, 0x2e6b3c
    ];

    const colorMats = bookColors.map(c => new THREE.MeshLambertMaterial({ color: c }));

    let idx = Math.floor(Math.random() * Math.max(articles.length, 1));

    boardYs.forEach((by, rowIdx) => {
        const surfaceY = by + boardT / 2;
        const usableW = SW - 0.8;
        const bookCount = 9;
        const bookW = 0.32;
        const gap = (usableW - bookCount * bookW) / (bookCount + 1);

        const nextBoardY = boardYs[rowIdx + 1] !== undefined ? boardYs[rowIdx + 1] : SH;
        const maxBookH = nextBoardY - by - 0.25;

        for (let i = 0; i < bookCount; i++) {
            const article = articles.length ? articles[idx % articles.length] : null;
            idx++;

            const colorIdx = (rowIdx * 4 + i * 3) % bookColors.length;
            const color = bookColors[colorIdx];
            const colorMat = colorMats[colorIdx];

            let h = 0.82 + ((i + rowIdx) % 4) * 0.03;
            if (h > maxBookH) h = maxBookH;
            const w = bookW + ((i + rowIdx) % 3) * 0.015;
            const d = Math.min(0.48 + ((i * 2 + rowIdx) % 4) * 0.025, SD - 0.2);

            const title = article ? article.title : 'Untitled';
            const spineTex = makeBookSpineTexture(title, color);
            const spineMat = new THREE.MeshBasicMaterial({ map: spineTex });

            const book = new THREE.Mesh(
                new THREE.BoxGeometry(w, h, d),
                [colorMat, colorMat, colorMat, colorMat, spineMat, colorMat]
            );

            const localX = -usableW / 2 + gap + i * (bookW + gap) + w / 2;
            const localZ = -SD / 2 + 0.14 + d / 2;
            book.position.set(localX, surfaceY + h / 2 + 0.005, localZ);
            book.castShadow = true;
            book.receiveShadow = true;

            if (article && article.file) {
                const filePath = ARTICLES_CONTENT + article.file;
                book.userData = {
                    isLibraryBook: true,
                    onInteract: function() {
                        Engine.openOverlay(filePath);
                    },
                    label: title
                };
            } else {
                book.userData = { isLibraryBook: true, label: title };
            }

            libraryBooks.push(book);
            group.add(book);
        }
    });
}

function nextChannel(dir) {
    const keys = Object.keys(videoData.channels || {});
    if (keys.length === 0) {
        flashPrompt('No channels available');
        return;
    }
    keys.sort((a, b) => videoData.channels[a].number - videoData.channels[b].number);

    let idx = keys.indexOf(tvChannelKey);
    if (idx < 0) {
        idx = dir > 0 ? -1 : 0;
    }
    idx = (idx + dir + keys.length) % keys.length;
    tvChannelKey = keys[idx];

    const ch = videoData.channels[tvChannelKey];
    setChannelHud(ch.number, ch.name);

    startChannel(tvChannelKey);
}

function startChannel(chKey) {
    const ch = videoData.channels[chKey];
    if (!ch) return;

    const vids = (videoData.videos || []).filter(v => (v.channels || []).includes(chKey));
    if (vids.length === 0) {
        flashPrompt('No videos on this channel');
        return;
    }

    fisherYates(vids);

    tvQueue = [];
    const adsToPlay = Math.floor(Math.random() * 2);
    for (let i = 0; i < adsToPlay && adList.length; i++) {
        const ad = adList[Math.floor(Math.random() * adList.length)];
        tvQueue.push({ src: AD_SRC + ad, kind: 'ad', title: 'Advertisement' });
    }
    vids.forEach(v => {
        tvQueue.push({
            src: VIDEO_SRC + v.src,
            kind: 'video',
            title: v.src.replace(/\.mp4$/i, ''),
            channels: v.channels
        });
    });

    tvQueueIdx = 0;
    tvActive = true;
    playNextTV();
}

function playNextTV() {
    if (tvQueueIdx >= tvQueue.length) {
        tvQueueIdx = 0;
        fisherYates(tvQueue);
    }

    const item = tvQueue[tvQueueIdx];

    if (!activeVideoEl) {
        activeVideoEl = document.createElement('video');
        activeVideoEl.crossOrigin = 'anonymous';
        activeVideoEl.playsInline = true;
        activeVideoEl.volume = 0.5;
        activeVideoEl.style.display = 'none';
        document.body.appendChild(activeVideoEl);
    }

    playToken++;
    const myToken = playToken;

    activeVideoEl.onended = null;
    activeVideoEl.onerror = null;
    activeVideoEl.pause();
    activeVideoEl.removeAttribute('src');
    activeVideoEl.load();

    activeVideoEl.onended = () => {
        if (myToken !== playToken) return;
        tvQueueIdx++;
        playNextTV();
    };

    activeVideoEl.onerror = () => {
        if (myToken !== playToken) return;
        tvQueueIdx++;
        playNextTV();
    };

    activeVideoEl.src = item.src;

    activeVideoEl.play().catch(() => {
        activeVideoEl.muted = true;
        activeVideoEl.play().catch(() => {
            if (myToken !== playToken) return;
            tvQueueIdx++;
            playNextTV();
        });
    });

    if (!activeCanvasTex) {
        const canvas = document.createElement('canvas');
        canvas.width = 1280;
        canvas.height = 720;
        activeCanvasTex = new THREE.CanvasTexture(canvas);
        tvScreenMat.map = activeCanvasTex;
        tvScreenMat.needsUpdate = true;
        tvScreenMat.color.setHex(0xffffff);
        activeCanvasTex.userData = {
            canvas: canvas,
            ctx: canvas.getContext('2d')
        };
    }

    if (!drawLoopRunning) {
        drawLoopRunning = true;
        requestAnimationFrame(drawTVFrame);
    }
}

function drawTVFrame() {
    if (!tvActive || !activeCanvasTex) {
        drawLoopRunning = false;
        return;
    }
    const ctx = activeCanvasTex.userData.ctx;
    const canvas = activeCanvasTex.userData.canvas;

    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    if (activeVideoEl && activeVideoEl.readyState >= 2) {
        const vw = activeVideoEl.videoWidth || 1280;
        const vh = activeVideoEl.videoHeight || 720;
        const aspect = vw / vh;
        const canvasAspect = canvas.width / canvas.height;

        let dw, dh, dx, dy;
        if (aspect > canvasAspect) {
            dw = canvas.width;
            dh = canvas.width / aspect;
            dx = 0;
            dy = (canvas.height - dh) / 2;
        } else {
            dh = canvas.height;
            dw = canvas.height * aspect;
            dx = (canvas.width - dw) / 2;
            dy = 0;
        }
        try { ctx.drawImage(activeVideoEl, dx, dy, dw, dh); } catch (e) {}
    }

    activeCanvasTex.needsUpdate = true;
    requestAnimationFrame(drawTVFrame);
}

function sitOnSeat(info) {
    if (sitting) { flashPrompt('Already sitting.'); return; }
    sitting = true;
    sitSeat = info;

    const p = Engine.controls.getObject();
    sitReturnPos = { x: p.position.x, y: p.position.y, z: p.position.z };
    p.position.set(info.x, info.y, info.z);

    if (info.lookX !== undefined && info.lookZ !== undefined) {
        const dx = info.lookX - info.x;
        const dz = info.lookZ - info.z;
        const targetYaw = Math.atan2(-dx, -dz);
        p.rotation.y = targetYaw;
    }

    const hint = document.getElementById('sit-hint');
    if (hint) hint.style.display = 'block';
}

function standUp() {
    if (!sitting) return;
    sitting = false;
    const hint = document.getElementById('sit-hint');
    if (hint) hint.style.display = 'none';

    const p = Engine.controls.getObject();
    if (sitReturnPos) p.position.set(sitReturnPos.x, 1.7, sitReturnPos.z);
    sitReturnPos = null;
    sitSeat = null;
}

document.addEventListener('keydown', function(e) {
    if (sitting && (e.code === 'KeyE' || e.code === 'Escape' || e.code === 'KeyX')) {
        standUp();
        e.preventDefault();
        e.stopPropagation();
    }
    if ((e.code === 'KeyQ' || e.code === 'ArrowLeft') && tvActive) {
        e.preventDefault();
        nextChannel(-1);
    }
    if ((e.code === 'KeyR' || e.code === 'ArrowRight') && tvActive) {
        e.preventDefault();
        nextChannel(1);
    }
}, true);

    await loadTVData();

    buildRoom();

    const realInteractables = Engine.interactables.filter(o => !o.userData.isLibraryBook);
    Engine.interactables = realInteractables;

    const _origIntersect = Engine.raycaster.intersectObjects.bind(Engine.raycaster);

    Engine.raycaster.intersectObjects = function(objs, recursive) {
        const results = _origIntersect(objs, recursive);
        if (!objs || objs.length === 0) return results;

        const camPos = Engine.camera.position;
        const dir = _tmpVec2;
        Engine.camera.getWorldDirection(dir);

        let bestBook = null;
        let bestT = 3.5;
        for (let i = 0; i < libraryBooks.length; i++) {
            const b = libraryBooks[i];
            b.getWorldPosition(_tmpVec);
            const dx = _tmpVec.x - camPos.x;
            const dy = _tmpVec.y - camPos.y;
            const dz = _tmpVec.z - camPos.z;
            const t = dx * dir.x + dy * dir.y + dz * dir.z;
            if (t < 0.2 || t > bestT) continue;
            const cx = camPos.x + dir.x * t;
            const cy = camPos.y + dir.y * t;
            const cz = camPos.z + dir.z * t;
            const ox = cx - _tmpVec.x;
            const oy = cy - _tmpVec.y;
            const oz = cz - _tmpVec.z;
            const off = Math.sqrt(ox * ox + oy * oy + oz * oz);
            if (off < 0.6 && t < bestT) {
                bestT = t;
                bestBook = b;
            }
        }
        if (bestBook) {
            results.push({ object: bestBook, distance: bestT });
            results.sort((a, b) => a.distance - b.distance);
        }
        return results;
    };

    Engine.start();
})();
</script>
