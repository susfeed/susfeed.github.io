<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your House - Interior</title>
    <link rel="icon" href="../../../img/amogus.webp">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { overflow: hidden; font-family: 'Segoe UI', sans-serif; background: #1a1208; color: white; }
        #crosshair { position: absolute; top: 50%; left: 50%; width: 8px; height: 8px; background: rgba(255,255,255,0.6); border-radius: 50%; transform: translate(-50%,-50%); pointer-events: none; z-index: 100; transition: all 0.15s ease; box-shadow: 0 0 4px rgba(0,0,0,0.5); }
        #crosshair.active { background: rgba(186,26,26,0.95); transform: translate(-50%,-50%) scale(1.6); box-shadow: 0 0 10px rgba(186,26,26,0.9); }
        #hud { position: absolute; top: 16px; left: 16px; z-index: 100; pointer-events: none; display: flex; flex-direction: column; gap: 8px; }
        #location { font-size: 16px; font-weight: 600; letter-spacing: 1.5px; text-transform: uppercase; color: rgba(255,255,255,0.9); text-shadow: 1px 1px 3px rgba(0,0,0,0.8); background: rgba(0,0,0,0.55); padding: 6px 14px; border-radius: 4px; border-left: 3px solid #ba1a1a; align-self: flex-start; backdrop-filter: blur(4px); }
        #controls-hint { display: flex; flex-direction: column; gap: 3px; font-size: 11px; color: rgba(255,255,255,0.65); text-shadow: 1px 1px 2px rgba(0,0,0,0.8); letter-spacing: 0.5px; background: rgba(0,0,0,0.35); padding: 8px 12px; border-radius: 4px; backdrop-filter: blur(4px); align-self: flex-start; }
        #controls-hint b { color: #ba1a1a; font-weight: 700; }
        #prompt { position: absolute; bottom: 60px; left: 50%; transform: translateX(-50%); color: #ba1a1a; text-shadow: 2px 2px 4px black; pointer-events: none; z-index: 100; font-size: 15px; font-weight: 600; letter-spacing: 1.5px; display: none; background: rgba(0,0,0,0.65); padding: 8px 20px; border-radius: 4px; border: 1px solid rgba(186,26,26,0.5); backdrop-filter: blur(4px); animation: pulse 1.8s infinite; }
        @keyframes pulse { 0%,100% { opacity: 0.85; } 50% { opacity: 1; } }
        #overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); display: flex; justify-content: center; align-items: center; z-index: 200; color: white; cursor: pointer; flex-direction: column; gap: 10px; transition: opacity 0.3s; }
        #overlay h1 { color: #ba1a1a; text-shadow: 0 0 24px rgba(186,26,26,0.7); font-size: 52px; letter-spacing: 6px; font-weight: 700; }
        #overlay p { font-size: 16px; color: #888; letter-spacing: 2px; text-transform: uppercase; }
        #sit-hint { position: absolute; bottom: 100px; left: 50%; transform: translateX(-50%); color: #ba1a1a; background: rgba(0,0,0,0.75); padding: 8px 18px; border-radius: 4px; font-size: 14px; font-weight: 600; letter-spacing: 1px; display: none; pointer-events: none; z-index: 101; border: 1px solid rgba(186,26,26,0.5); }
        #channel-hud { position: absolute; top: 16px; right: 16px; z-index: 100; background: rgba(0,0,0,0.75); padding: 10px 16px; border-radius: 4px; border-left: 3px solid #ba1a1a; font-size: 13px; display: none; min-width: 200px; }
        #channel-hud .ch-num { color: #ba1a1a; font-weight: 700; font-size: 22px; letter-spacing: 2px; }
        #channel-hud .ch-name { color: #fff; font-weight: 600; font-size: 14px; margin-top: 2px; letter-spacing: 1px; }
        #channel-hud .ch-label { color: #888; font-size: 10px; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 4px; }
        #viewer-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.88); z-index: 500; justify-content: center; align-items: center; flex-direction: column; }
    </style>

<body>
    <div id="crosshair"></div>
    <div id="hud">

        <div id="controls-hint">

    <div id="overlay"><h1>YOUR HOUSE</h1><p>Click to Enter</p></div>

    <div id="viewer-modal">
        <button onclick="Engine.closeOverlay()" style="position:absolute; top:20px; right:20px; background:#ba1a1a; color:white; border:none; padding:12px 24px; border-radius:6px; cursor:pointer; font-weight:bold; font-size:16px; z-index:501;">Close (Esc)</button>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/PointerLockControls.js"></script>
    <script src="../engine.js"></script>

    <script>
        const ROOT = '../../../';
        const TV_ROOT = ROOT + 'TV/';
        const VIDEOS_JSON = TV_ROOT + 'videos/index.json';
        const VIDEO_SRC = TV_ROOT + 'videos/';
        const COMMERCIALS_JSON = TV_ROOT + 'commercials/index.json';
        const AD_SRC = TV_ROOT + 'commercials/';
        const SUSIPEDIA_ROOT = ROOT + 'susipedia/';
        const ARTICLES_JSON = SUSIPEDIA_ROOT + 'articles/articles.json';
        const ARTICLES_CONTENT = SUSIPEDIA_ROOT + 'articles/content/';

        const HOUSE = {
            minX: -20, maxX: 20,
            minZ: -20, maxZ: 20,
            wallH: 3.2,
            wallT: 0.3
        };

        const ROOMS = {
            living:    { minX: -10, maxX: 10, minZ: 2,   maxZ: 20  },
            hallway:   { minX: -4,  maxX: 4,  minZ: -12, maxZ: 2   },
            bedroom:   { minX: -20, maxX: -4, minZ: -20, maxZ: -2  },
            kitchen:   { minX: 4,   maxX: 20, minZ: -12, maxZ: -2  },
            library:   { minX: -20, maxX: -4, minZ: -2,  maxZ: 12  },
            gameRoom:  { minX: 4,   maxX: 20, minZ: -20, maxZ: -12 },
            bathroom:  { minX: 4,   maxX: 14, minZ: 12,  maxZ: 20  }
        };

        const WALL_T = 0.3;
        const WALL_H = 3.2;

        let videoData = { channels: {}, videos: [] };
        let adList = [];

        let tvActive = false;
        let tvChannelKey = null;
        let tvQueue = [];
        let tvQueueIdx = 0;
        let activeVideoEl = null;
        let activeCanvasTex = null;
        let drawLoopRunning = false;
        let playToken = 0;
        let tvScreenMat = null;

        let libraryArticles = [];
        const libraryBooks = [];

        let sitting = false;
        let sitSeat = null;
        let sitReturnPos = null;

        const _tmpVec = new THREE.Vector3();
        const _tmpVec2 = new THREE.Vector3();

        function makeTextTexture(text, bgHex, textColor, w, h, fontPx) {
            w = w || 512;
            h = h || 128;
            fontPx = fontPx || 60;
            const canvas = document.createElement('canvas');
            canvas.width = w;
            canvas.height = h;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#' + bgHex.toString(16).padStart(6, '0');
            ctx.fillRect(0, 0, w, h);
            ctx.fillStyle = textColor;
            ctx.font = `bold ${fontPx}px Arial`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(text, w / 2, h / 2);
            const tex = new THREE.CanvasTexture(canvas);
            tex.anisotropy = 8;
            return tex;
        }

        function makeBookSpineTexture(title, colorHex) {
            const canvas = document.createElement('canvas');
            canvas.width = 128;
            canvas.height = 512;
            const ctx = canvas.getContext('2d');
            const color = '#' + colorHex.toString(16).padStart(6, '0');
            ctx.fillStyle = color;
            ctx.fillRect(0, 0, 128, 512);

            const darker = shade(color, -0.25);
            ctx.fillStyle = darker;
            ctx.fillRect(0, 0, 128, 16);
            ctx.fillRect(0, 496, 128, 16);
            ctx.fillRect(0, 0, 10, 512);
            ctx.fillRect(118, 0, 10, 512);

            ctx.save();
            ctx.translate(64, 256);
            ctx.rotate(-Math.PI / 2);
            ctx.fillStyle = '#f7e7c8';
            ctx.font = 'bold 34px Georgia, serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            let text = title;
            const maxWidth = 440;
            while (ctx.measureText(text).width > maxWidth && text.length > 3) {
                text = text.slice(0, -1);
            }
            if (text !== title) text = text.slice(0, -1) + '…';
            ctx.fillText(text, 0, 0);
            ctx.restore();

            const tex = new THREE.CanvasTexture(canvas);
            tex.anisotropy = 8;
            tex.minFilter = THREE.LinearFilter;
            tex.generateMipmaps = false;
            return tex;
        }

        function shade(hex, pct) {
            const n = parseInt(hex.slice(1), 16);
            let r = (n >> 16) & 0xff;
            let g = (n >> 8) & 0xff;
            let b = n & 0xff;
            r = Math.max(0, Math.min(255, Math.round(r + 255 * pct)));
            g = Math.max(0, Math.min(255, Math.round(g + 255 * pct)));
            b = Math.max(0, Math.min(255, Math.round(b + 255 * pct)));
            return '#' + ((r << 16) | (g << 8) | b).toString(16).padStart(6, '0');
        }

        function addBoxCollider(cx, cz, w, d, r) {
            r = r || 0.9;
            const spanX = Math.max(w - r * 2, 0);
            const count = Math.max(Math.ceil(spanX / (r * 1.4)), 1);
            if (count === 1) {
                Engine.addCollider(cx, cz, r);
                return;
            }
            const step = spanX / (count - 1);
            for (let i = 0; i < count; i++) {
                Engine.addCollider(cx - spanX / 2 + i * step, cz, r);
            }
            const depthPad = d / 2;
            if (depthPad > r) {
                for (let i = 0; i < count; i++) {
                    const x = cx - spanX / 2 + i * step;
                    Engine.addCollider(x, cz + (depthPad - r) * 1.2, r * 0.9);
                    Engine.addCollider(x, cz - (depthPad - r) * 1.2, r * 0.9);
                }
            }
        }

        function flashPrompt(text) {
            const p = document.getElementById('prompt');
            if (!p) return;
            const orig = p.textContent;
            p.textContent = text;
            p.style.display = 'block';
            setTimeout(() => { p.textContent = orig; }, 1600);
        }

        function setChannelHud(num, name) {
            const hud = document.getElementById('channel-hud');
            const n = document.getElementById('ch-num');
            const nm = document.getElementById('ch-name');
            if (!hud || !n || !nm) return;
            hud.style.display = 'block';
            n.textContent = String(num).padStart(2, '0');
            nm.textContent = name;
        }

        function fisherYates(arr) {
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                const t = arr[i]; arr[i] = arr[j]; arr[j] = t;
            }
        }

        async function loadArticles() {
            try {
                const res = await fetch(ARTICLES_JSON);
                const data = await res.json();
                data.sort((a, b) => b.id - a.id);
                libraryArticles = data;
            } catch (e) {
                console.warn('Could not load articles:', e);
                libraryArticles = [];
            }
        }

        async function loadTVData() {
            try {
                const res = await fetch(VIDEOS_JSON);
                videoData = await res.json();
            } catch (e) {
                console.warn('videos load failed', e);
            }
            try {
                const res = await fetch(COMMERCIALS_JSON);
                adList = await res.json();
            } catch (e) {
                console.warn('commercials load failed', e);
            }
        }

        function buildHouse() {
            const S = Engine.scene;

            S.add(new THREE.HemisphereLight(0xffe8c8, 0x2a1810, 0.5));
            S.add(new THREE.AmbientLight(0xffffff, 0.4));

            buildFloor(S);
            buildCeiling(S);
            buildWalls(S);
            buildCeilingLights(S);
            buildLivingRoom(S);
            buildBedroom(S);
            buildKitchen(S);
            buildLibrary(S);
            buildGameRoom(S);
            buildBathroom(S);
            buildHallwayDecor(S);
            buildExit(S);
        }

        function buildFloor(S) {
            const floorMat = new THREE.MeshLambertMaterial({ color: 0x4a2c14 });
            const floor = new THREE.Mesh(
                new THREE.BoxGeometry(
                    HOUSE.maxX - HOUSE.minX + WALL_T * 2,
                    0.2,
                    HOUSE.maxZ - HOUSE.minZ + WALL_T * 2
                ),
                floorMat
            );
            floor.position.set(
                (HOUSE.minX + HOUSE.maxX) / 2,
                -0.1,
                (HOUSE.minZ + HOUSE.maxZ) / 2
            );
            floor.receiveShadow = true;
            S.add(floor);

            const rugs = [
                { mat: 0x6b2020, x: 0, z: 12, w: 14, d: 10 },
                { mat: 0x6b2020, x: -12, z: -12, w: 10, d: 8 },
                { mat: 0x2a2a3a, x: 12, z: -16, w: 10, d: 6 },
                { mat: 0x3a3028, x: 12, z: -6, w: 10, d: 6 },
                { mat: 0x3a3028, x: 9, z: 16, w: 6, d: 5 },
                { mat: 0x4a2c14, x: -12, z: 6, w: 10, d: 8 }
            ];
            rugs.forEach(r => {
                const rug = new THREE.Mesh(
                    new THREE.PlaneGeometry(r.w, r.d),
                    new THREE.MeshLambertMaterial({ color: r.mat })
                );
                rug.rotation.x = -Math.PI / 2;
                rug.position.set(r.x, 0.005, r.z);
                rug.receiveShadow = true;
                S.add(rug);
            });
        }

        function buildCeiling(S) {
            const ceilMat = new THREE.MeshLambertMaterial({ color: 0x3a2818 });
            const ceiling = new THREE.Mesh(
                new THREE.PlaneGeometry(
                    HOUSE.maxX - HOUSE.minX + WALL_T * 2,
                    HOUSE.maxZ - HOUSE.minZ + WALL_T * 2
                ),
                ceilMat
            );
            ceiling.rotation.x = Math.PI / 2;
            ceiling.position.set(
                (HOUSE.minX + HOUSE.maxX) / 2,
                WALL_H,
                (HOUSE.minZ + HOUSE.maxZ) / 2
            );
            S.add(ceiling);
        }

        function buildWalls(S) {
            const wallMat = new THREE.MeshLambertMaterial({ color: 0x8a6a4a });
            const innerWallMat = new THREE.MeshLambertMaterial({ color: 0x9a7a5a });
            const trimMat = new THREE.MeshLambertMaterial({ color: 0xba1a1a });

            const mk = (cx, cz, w, d, mat) => {
                mat = mat || wallMat;
                const wall = new THREE.Mesh(
                    new THREE.BoxGeometry(w, WALL_H, d),
                    mat
                );
                wall.position.set(cx, WALL_H / 2, cz);
                wall.castShadow = true;
                wall.receiveShadow = true;
                S.add(wall);
                addBoxCollider(cx, cz, w, d, 0.4);
            };

            const HX = HOUSE.maxX + WALL_T / 2;
            const HZ = HOUSE.maxZ + WALL_T / 2;
            const LX = HOUSE.minX - WALL_T / 2;
            const LZ = HOUSE.minZ - WALL_T / 2;

            mk(0, LZ, HOUSE.maxX - HOUSE.minX + WALL_T * 2, WALL_T);
            mk(0, HZ, HOUSE.maxX - HOUSE.minX + WALL_T * 2, WALL_T);
            mk(LX, 0, WALL_T, HOUSE.maxZ - HOUSE.minZ);
            mk(HX, 0, WALL_T, HOUSE.maxZ - HOUSE.minZ);

            mk(-7, 2, 6, WALL_T, innerWallMat);
            mk(7, 2, 6, WALL_T, innerWallMat);

            mk(-4, -7, WALL_T, 10, innerWallMat);

            mk(4, -7, WALL_T, 10, innerWallMat);

            mk(-12, -2, 16, WALL_T, innerWallMat);
            mk(-12, -12, 16, WALL_T, innerWallMat);

            mk(12, -12, 16, WALL_T, innerWallMat);

            mk(14, 16, WALL_T, 8, innerWallMat);
            mk(4, 12, 10, WALL_T, innerWallMat);

            mk(0, 2, 4, WALL_T, innerWallMat);

            mk(-4, 10, WALL_T, 4, innerWallMat);

            mk(0, 3.35, 24, 0.1, trimMat);
            mk(0, 0.7, 24, 0.06, trimMat);

            const backTrim = new THREE.Mesh(
                new THREE.BoxGeometry(40, 0.1, 0.1),
                trimMat
            );
            backTrim.position.set(0, 3.35, HOUSE.minZ + 0.2);
            S.add(backTrim);
        }

        function buildCeilingLights(S) {
            const bulbMat = new THREE.MeshBasicMaterial({ color: 0xffe4a0 });
            const fixtureMat = new THREE.MeshLambertMaterial({ color: 0x3a2818 });

            const positions = [
                [0, 12],
                [0, 18],
                [-12, -14],
                [-12, -6],
                [10, -6],
                [16, -6],
                [-12, 4],
                [-12, 8],
                [12, -16],
                [16, -16],
                [9, 16]
            ];

            positions.forEach(p => {
                const fixture = new THREE.Mesh(
                    new THREE.CylinderGeometry(0.4, 0.4, 0.12, 12),
                    fixtureMat
                );
                fixture.position.set(p[0], WALL_H - 0.06, p[1]);
                S.add(fixture);

                const bulb = new THREE.Mesh(
                    new THREE.CylinderGeometry(0.34, 0.34, 0.08, 12),
                    bulbMat
                );
                bulb.position.set(p[0], WALL_H - 0.14, p[1]);
                S.add(bulb);

                const light = new THREE.PointLight(0xffe4a0, 0.6, 12);
                light.position.set(p[0], WALL_H - 0.4, p[1]);
                S.add(light);
            });
        }

        function buildLivingRoom(S) {
            const couchMat = new THREE.MeshLambertMaterial({ color: 0x2a3a48 });
            const cushionMat = new THREE.MeshLambertMaterial({ color: 0xba1a1a });
            const woodMat = new THREE.MeshLambertMaterial({ color: 0x4a2c14 });

            const CX = 0;
            const CZ = 14;

            const couch = new THREE.Mesh(new THREE.BoxGeometry(7, 0.7, 2.4), couchMat);
            couch.position.set(CX, 0.35, CZ);
            couch.castShadow = true;
            couch.receiveShadow = true;
            S.add(couch);
            addBoxCollider(CX, CZ, 7, 2.4, 1.1);

            const cushion = new THREE.Mesh(new THREE.BoxGeometry(6.8, 0.2, 2.2), cushionMat);
            cushion.position.set(CX, 0.75, CZ);
            S.add(cushion);

            const backrest = new THREE.Mesh(new THREE.BoxGeometry(7, 1.3, 0.35), couchMat);
            backrest.position.set(CX, 1.35, CZ + 1.05);
            S.add(backrest);

            [-1, 1].forEach(side => {
                const arm = new THREE.Mesh(new THREE.BoxGeometry(0.45, 1.3, 2.4), couchMat);
                arm.position.set(CX + side * 3.25, 0.9, CZ);
                S.add(arm);
            });

            const accentStrip = new THREE.Mesh(
                new THREE.BoxGeometry(6.8, 0.06, 0.1),
                new THREE.MeshBasicMaterial({ color: 0xba1a1a })
            );
            accentStrip.position.set(CX, 0.83, CZ - 1.1);
            S.add(accentStrip);

            const seatPickup = new THREE.Mesh(
                new THREE.BoxGeometry(6.6, 1.2, 2.2),
                new THREE.MeshBasicMaterial({ visible: false })
            );
            seatPickup.position.set(CX, 1.0, CZ);
            S.add(seatPickup);
            Engine.addInteractable(seatPickup, {
                onInteract: () => sitOnSeat({
                    x: CX, y: 1.3, z: CZ,
                    lookX: CX, lookZ: 8
                })
            });

            const coffeeTable = new THREE.Mesh(new THREE.BoxGeometry(3.5, 0.15, 1.8), tableTopMat);
            coffeeTable.position.set(CX, 0.45, 11);
            coffeeTable.castShadow = true;
            S.add(coffeeTable);
            addBoxCollider(CX, 11, 3.5, 1.8, 0.75);

            const ctLegMat = new THREE.MeshLambertMaterial({ color: 0x1a1a1a });
            [[-1.5, -0.7], [1.5, -0.7], [-1.5, 0.7], [1.5, 0.7]].forEach(p => {
                const leg = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.45, 0.1), ctLegMat);
                leg.position.set(CX + p[0], 0.225, 11 + p[1]);
                S.add(leg);
            });

            const bowl = new THREE.Mesh(
                new THREE.CylinderGeometry(0.3, 0.22, 0.18, 14),
                new THREE.MeshLambertMaterial({ color: 0xba1a1a })
            );
            bowl.position.set(CX - 0.6, 0.58, 11);
            S.add(bowl);

            const book1 = new THREE.Mesh(
                new THREE.BoxGeometry(0.7, 0.06, 1.0),
                new THREE.MeshLambertMaterial({ color: 0x2a3840 })
            );
            book1.position.set(CX + 0.6, 0.54, 11);
            book1.rotation.y = 0.2;
            S.add(book1);

            const armchairMat = new THREE.MeshLambertMaterial({ color: 0x3a4a58 });
            [-4.5, 4.5].forEach(x => {
                const chair = new THREE.Group();
                chair.position.set(x, 0, 12);

                const seat = new THREE.Mesh(new THREE.BoxGeometry(2, 0.6, 2), armchairMat);
                seat.position.y = 0.3;
                seat.castShadow = true;
                chair.add(seat);

                const back = new THREE.Mesh(new THREE.BoxGeometry(2, 1.2, 0.3), armchairMat);
                back.position.set(0, 1.0, 0.85);
                chair.add(back);

                [-1, 1].forEach(side => {
                    const arm = new THREE.Mesh(new THREE.BoxGeometry(0.3, 1.0, 2), armchairMat);
                    arm.position.set(side * 0.85, 0.7, 0);
                    chair.add(arm);
                });

                const cushionTop = new THREE.Mesh(new THREE.BoxGeometry(1.7, 0.15, 1.7), cushionMat);
                cushionTop.position.y = 0.65;
                chair.add(cushionTop);

                S.add(chair);

                const pick = new THREE.Mesh(
                    new THREE.BoxGeometry(2, 1.2, 2),
                    new THREE.MeshBasicMaterial({ visible: false })
                );
                pick.position.set(x, 0.7, 12);
                S.add(pick);
                Engine.addInteractable(pick, {
                    onInteract: () => sitOnSeat({
                        x: x, y: 1.3, z: 12,
                        lookX: CX, lookZ: 8
                    })
                });
            });

            const shelf = new THREE.Mesh(new THREE.BoxGeometry(11, 0.15, 0.4), woodMat);
            shelf.position.set(CX, 2.7, 2.4);
            S.add(shelf);

        function nextChannel(dir) {
            const keys = Object.keys(videoData.channels || {});
            if (keys.length === 0) {
                flashPrompt('No channels available');
                return;
            }
            keys.sort((a, b) => videoData.channels[a].number - videoData.channels[b].number);

            let idx = keys.indexOf(tvChannelKey);
            if (idx < 0) {
                idx = dir > 0 ? -1 : 0;
            }
            idx = (idx + dir + keys.length) % keys.length;
            tvChannelKey = keys[idx];

            const ch = videoData.channels[tvChannelKey];
            setChannelHud(ch.number, ch.name);

            startChannel(tvChannelKey);
        }

        function startChannel(chKey) {
            const ch = videoData.channels[chKey];
            if (!ch) return;

            const vids = (videoData.videos || []).filter(v => (v.channels || []).includes(chKey));
            if (vids.length === 0) {
                flashPrompt('No videos on this channel');
                return;
            }

            fisherYates(vids);

            tvQueue = [];
            const adsToPlay = Math.floor(Math.random() * 2);
            for (let i = 0; i < adsToPlay && adList.length; i++) {
                const ad = adList[Math.floor(Math.random() * adList.length)];
                tvQueue.push({ src: AD_SRC + ad, kind: 'ad', title: 'Advertisement' });
            }
            vids.forEach(v => {
                tvQueue.push({
                    src: VIDEO_SRC + v.src,
                    kind: 'video',
                    title: v.src.replace(/\.mp4$/i, ''),
                    channels: v.channels
                });
            });

            tvQueueIdx = 0;
            tvActive = true;
            playNextTV();
        }

        function playNextTV() {
            if (tvQueueIdx >= tvQueue.length) {
                tvQueueIdx = 0;
                fisherYates(tvQueue);
            }

            const item = tvQueue[tvQueueIdx];

            if (!activeVideoEl) {
                activeVideoEl = document.createElement('video');
                activeVideoEl.crossOrigin = 'anonymous';
                activeVideoEl.playsInline = true;
                activeVideoEl.volume = 0.5;
                activeVideoEl.style.display = 'none';
                document.body.appendChild(activeVideoEl);
            }

            playToken++;
            const myToken = playToken;

            activeVideoEl.onended = null;
            activeVideoEl.onerror = null;
            activeVideoEl.pause();
            activeVideoEl.removeAttribute('src');
            activeVideoEl.load();

            activeVideoEl.onended = () => {
                if (myToken !== playToken) return;
                tvQueueIdx++;
                playNextTV();
            };

            activeVideoEl.onerror = () => {
                if (myToken !== playToken) return;
                tvQueueIdx++;
                playNextTV();
            };

            activeVideoEl.src = item.src;

            activeVideoEl.play().catch(() => {
                activeVideoEl.muted = true;
                activeVideoEl.play().catch(() => {
                    if (myToken !== playToken) return;
                    tvQueueIdx++;
                    playNextTV();
                });
            });

            if (!activeCanvasTex) {
                const canvas = document.createElement('canvas');
                canvas.width = 1280;
                canvas.height = 720;
                activeCanvasTex = new THREE.CanvasTexture(canvas);
                tvScreenMat.map = activeCanvasTex;
                tvScreenMat.needsUpdate = true;
                tvScreenMat.color.setHex(0xffffff);
                activeCanvasTex.userData = {
                    canvas: canvas,
                    ctx: canvas.getContext('2d')
                };
            }

            if (!drawLoopRunning) {
                drawLoopRunning = true;
                requestAnimationFrame(drawTVFrame);
            }
        }

        function drawTVFrame() {
            if (!tvActive || !activeCanvasTex) {
                drawLoopRunning = false;
                return;
            }
            const ctx = activeCanvasTex.userData.ctx;
            const canvas = activeCanvasTex.userData.canvas;

            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            if (activeVideoEl && activeVideoEl.readyState >= 2) {
                const vw = activeVideoEl.videoWidth || 1280;
                const vh = activeVideoEl.videoHeight || 720;
                const aspect = vw / vh;
                const canvasAspect = canvas.width / canvas.height;

                let dw, dh, dx, dy;
                if (aspect > canvasAspect) {
                    dw = canvas.width;
                    dh = canvas.width / aspect;
                    dx = 0;
                    dy = (canvas.height - dh) / 2;
                } else {
                    dh = canvas.height;
                    dw = canvas.height * aspect;
                    dx = (canvas.width - dw) / 2;
                    dy = 0;
                }
                try { ctx.drawImage(activeVideoEl, dx, dy, dw, dh); } catch (e) {}
            }

            activeCanvasTex.needsUpdate = true;
            requestAnimationFrame(drawTVFrame);
        }

                    const article = articles[idx % articles.length];
                    idx++;

                    const colorIdx = (rowIdx * 3 + i * 2) % bookColors.length;
                    const color = bookColors[colorIdx];
                    const colorMat = colorMats[colorIdx];

                    const h = 0.7 + ((i + rowIdx) % 3) * 0.03;
                    const w = bookW + ((i + rowIdx) % 2) * 0.02;
                    const d = 0.4 + ((i * 2 + rowIdx) % 3) * 0.03;

                    const title = article ? article.title : 'Untitled';
                    const spineTex = makeBookSpineTexture(title, color);
                    const spineMat = new THREE.MeshBasicMaterial({ map: spineTex });

                    const book = new THREE.Mesh(
                        new THREE.BoxGeometry(w, h, d),
                        [colorMat, colorMat, colorMat, colorMat, spineMat, colorMat]
                    );

                    const localX = -usableW / 2 + gap + i * (bookW + gap) + w / 2;
                    const localZ = -SD / 2 + 0.1 + d / 2;
                    book.position.set(localX, surfaceY + h / 2 + 0.005, localZ);
                    book.castShadow = true;
                    book.receiveShadow = true;

                    if (article && article.file) {
                        const filePath = ARTICLES_CONTENT + article.file;
                        book.userData = {
                            isLibraryBook: true,
                            onInteract: function() {
                                Engine.openOverlay(filePath);
                            },
                            label: title
                        };
                    } else {
                        book.userData = { isLibraryBook: true, label: title };
                    }

                    libraryBooks.push(book);
                    group.add(book);
                }
            });
        }

        function sitOnSeat(info) {
            if (sitting) { flashPrompt('Already sitting.'); return; }
            sitting = true;
            sitSeat = info;

            const p = Engine.controls.getObject();
            sitReturnPos = { x: p.position.x, y: p.position.y, z: p.position.z };
            p.position.set(info.x, info.y, info.z);

            if (info.lookX !== undefined && info.lookZ !== undefined) {
                const dx = info.lookX - info.x;
                const dz = info.lookZ - info.z;
                const targetYaw = Math.atan2(-dx, -dz);
                p.rotation.y = targetYaw;
            }

            const hint = document.getElementById('sit-hint');
            if (hint) hint.style.display = 'block';
        }

        function standUp() {
            if (!sitting) return;
            sitting = false;
            const hint = document.getElementById('sit-hint');
            if (hint) hint.style.display = 'none';

            const p = Engine.controls.getObject();
            if (sitReturnPos) p.position.set(sitReturnPos.x, 1.7, sitReturnPos.z);
            sitReturnPos = null;
            sitSeat = null;
        }

        document.addEventListener('keydown', function(e) {
            if (sitting && (e.code === 'KeyE' || e.code === 'Escape' || e.code === 'KeyX')) {
                standUp();
                e.preventDefault();
                e.stopPropagation();
            }
            if ((e.code === 'KeyQ' || e.code === 'ArrowLeft') && tvActive) {
                e.preventDefault();
                nextChannel(-1);
            }
            if ((e.code === 'KeyR' || e.code === 'ArrowRight') && tvActive) {
                e.preventDefault();
                nextChannel(1);
            }
        }, true);

        (async function main() {
            Engine.init({
                bgColor: 0x1a1208,
                fog: true,
                fogNear: 35,
                fogFar: 90,
                startX: 0,
                startZ: 17,
                bounds: { minX: -19, maxX: 19, minZ: -19, maxZ: 19 }
            });

            const origUpdate = Engine.updatePlayer.bind(Engine);
            Engine.updatePlayer = function(delta) {
                if (sitting && sitSeat) {
                    const p = this.controls.getObject();
                    p.position.x = sitSeat.x;
                    p.position.y = sitSeat.y;
                    p.position.z = sitSeat.z;
                } else {
                    origUpdate(delta);
                }
            };

            await loadArticles();
            await loadTVData();

            buildHouse();

            const realInteractables = Engine.interactables.filter(o => !o.userData.isLibraryBook);
            Engine.interactables = realInteractables;

            const _origIntersect = Engine.raycaster.intersectObjects.bind(Engine.raycaster);

            Engine.raycaster.intersectObjects = function(objs, recursive) {
                const results = _origIntersect(objs, recursive);
                if (!objs || objs.length === 0) return results;

                const camPos = Engine.camera.position;
                const dir = _tmpVec2;
                Engine.camera.getWorldDirection(dir);

                let bestBook = null;
                let bestT = 3.2;
                for (let i = 0; i < libraryBooks.length; i++) {
                    const b = libraryBooks[i];
                    b.getWorldPosition(_tmpVec);
                    const dx = _tmpVec.x - camPos.x;
                    const dy = _tmpVec.y - camPos.y;
                    const dz = _tmpVec.z - camPos.z;
                    const t = dx * dir.x + dy * dir.y + dz * dir.z;
                    if (t < 0.2 || t > bestT) continue;
                    const cx = camPos.x + dir.x * t;
                    const cy = camPos.y + dir.y * t;
                    const cz = camPos.z + dir.z * t;
                    const ox = cx - _tmpVec.x;
                    const oy = cy - _tmpVec.y;
                    const oz = cz - _tmpVec.z;
                    const off = Math.sqrt(ox * ox + oy * oy + oz * oz);
                    if (off < 0.55 && t < bestT) {
                        bestT = t;
                        bestBook = b;
                    }
                }
                if (bestBook) {
                    results.push({ object: bestBook, distance: bestT });
                    results.sort((a, b) => a.distance - b.distance);
                }
                return results;
            };

            Engine.start();
        })();
