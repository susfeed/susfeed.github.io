<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>We Found This Nutcracker, Help Us Open This Walnut</title>
  <link rel="shortcut icon" href="../../img/amogus.webp" type="image/x-icon" />
  <link rel="stylesheet" href="../../index.css" />
  <link rel="stylesheet" href="../../content.css" />

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    .game-container {
      position: relative;
      width: 100%;
      max-width: 960px;
      margin: 0 auto;
      user-select: none;
      touch-action: none;
      background: #0d0d10;
      overflow: hidden;
      aspect-ratio: 16 / 9;
      border-radius: 4px;
      box-shadow: 0 8px 40px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(255, 255, 255, 0.06);
      cursor: none;
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
      cursor: none;
      touch-action: none;
    }
  </style>
</head>
<body>

  <div class="wrapper">

    <div class="site-header"></div>

    <main class="container article-content">
      <h1 class="article-main-title"><u>We Found This Nutcracker, Help Us Open This Walnut</u></h1>
      <p class="article-date"><i>Article Published by Cameron at 2026/10/06 11:11 PM CET</i></p>

      <div class="game-container">
        <canvas id="gameCanvas"></canvas>
      </div>
    </main>

    <div class="site-footer"></div>

  </div>

  <script src="../../contentheader.js"></script>

  <script>
    (function(){
      const canvas = document.getElementById("gameCanvas");
      const ctx = canvas.getContext("2d");

      const BASE_W = 960;
      const BASE_H = 540;
      let scaleX = 1, scaleY = 1;

      function resizeCanvas() {
        const container = canvas.parentElement;
        const rect = container.getBoundingClientRect();
        canvas.width = rect.width * window.devicePixelRatio;
        canvas.height = rect.height * window.devicePixelRatio;
        canvas.style.width = rect.width + 'px';
        canvas.style.height = rect.height + 'px';
        scaleX = canvas.width / BASE_W;
        scaleY = canvas.height / BASE_H;
      }
      window.addEventListener("resize", resizeCanvas);
      window.addEventListener("orientationchange", () => {
        setTimeout(resizeCanvas, 100);
      });
      resizeCanvas();

      let audioCtx = null;
      let audioUnlocked = false;
      let bangBuffer = null;
      let ringBuffer = null;

      async function loadAudioBuffer(url) {
        try {
          const response = await fetch(url);
          const arrayBuffer = await response.arrayBuffer();
          return await audioCtx.decodeAudioData(arrayBuffer);
        } catch (e) {
          return null;
        }
      }

      async function initAudio() {
        if (audioUnlocked) return;
        audioUnlocked = true;

        try {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
          if (audioCtx.state === 'suspended') {
            await audioCtx.resume();
          }

          bangBuffer = await loadAudioBuffer('bang.mp3');
          ringBuffer = await loadAudioBuffer('ring.mp3');
        } catch (e) {
          console.warn('Audio init failed:', e);
        }
      }

      function playSound(buffer, volume = 0.5) {
        if (!audioCtx) return;
        if (buffer) {
          try {
            const source = audioCtx.createBufferSource();
            source.buffer = buffer;
            const gain = audioCtx.createGain();
            gain.gain.value = volume;
            source.connect(gain);
            gain.connect(audioCtx.destination);
            source.start(0);
          } catch(e) {}
        } else {
          try {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(150, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
            gain.gain.setValueAtTime(volume, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.15);
          } catch(e) {}
        }
      }

      let gameStarted = false;
      let gameState = "playing";
      
      let nuke = {
        x: BASE_W / 2 - 100,
        y: BASE_H - 120,
        vx: 0,
        vy: 0,
        radius: 50,
        isGrabbed: false,
        bangs: 0,
        angle: 0,
        rotationSpeed: 0
      };

      let walnut = {
        x: BASE_W / 2 + 100,
        y: BASE_H - 120,
        radius: 45,
        shake: 0,
        cracked: false,
        crackProgress: 0
      };

      let explosion = {
        timer: 0,
        maxTimer: 180,
        particles: [],
        ringPlayed: false
      };

      let mouseX = BASE_W / 2;
      let mouseY = BASE_H / 2;

      const GRAVITY = 0.8;
      const FRICTION = 0.98;
      const BOUNCE = 0.6;
      const GROUND_Y = BASE_H - 80;
      const TABLE_TOP = BASE_H - 60;

      const nukeImg = new Image();
      nukeImg.src = "nuke.png";
      let nukeLoaded = false;
      nukeImg.onload = () => { nukeLoaded = true; };
      nukeImg.onerror = () => { nukeLoaded = false; };

      const walnutImg = new Image();
      walnutImg.src = "walnut.png";
      let walnutLoaded = false;
      walnutImg.onload = () => { walnutLoaded = true; };
      walnutImg.onerror = () => { walnutLoaded = false; };

      function getCanvasCoords(clientX, clientY) {
        const rect = canvas.getBoundingClientRect();
        return {
          x: (clientX - rect.left) * (canvas.width / rect.width),
          y: (clientY - rect.top) * (canvas.height / rect.height)
        };
      }

      canvas.addEventListener("mousemove", (e) => {
        const coords = getCanvasCoords(e.clientX, e.clientY);
        mouseX = coords.x / scaleX;
        mouseY = coords.y / scaleY;
        if (nuke.isGrabbed) {
          nuke.x = mouseX;
          nuke.y = mouseY;
        }
      });

      canvas.addEventListener("mousedown", async (e) => {
        const coords = getCanvasCoords(e.clientX, e.clientY);
        const bx = coords.x / scaleX;
        const by = coords.y / scaleY;

        if (!gameStarted) {
          await initAudio();
          gameStarted = true;
          return;
        }

        if (gameState !== "playing") return;

        const dx = bx - nuke.x;
        const dy = by - nuke.y;
        if (Math.sqrt(dx*dx + dy*dy) < nuke.radius + 20) {
          nuke.isGrabbed = true;
          nuke.vx = 0;
          nuke.vy = 0;
        }
      });

      canvas.addEventListener("mouseup", () => {
        nuke.isGrabbed = false;
      });

      window.addEventListener("mouseup", () => {
        nuke.isGrabbed = false;
      });

      canvas.addEventListener("touchstart", async (e) => {
        e.preventDefault();
        const touch = e.touches[0];
        const coords = getCanvasCoords(touch.clientX, touch.clientY);
        const bx = coords.x / scaleX;
        const by = coords.y / scaleY;

        if (!gameStarted) {
          await initAudio();
          gameStarted = true;
          return;
        }

        if (gameState !== "playing") return;

        const dx = bx - nuke.x;
        const dy = by - nuke.y;
        if (Math.sqrt(dx*dx + dy*dy) < nuke.radius + 20) {
          nuke.isGrabbed = true;
          nuke.vx = 0;
          nuke.vy = 0;
        }
      }, { passive: false });

      canvas.addEventListener("touchmove", (e) => {
        e.preventDefault();
        const touch = e.touches[0];
        const coords = getCanvasCoords(touch.clientX, touch.clientY);
        mouseX = coords.x / scaleX;
        mouseY = coords.y / scaleY;
        if (nuke.isGrabbed) {
          nuke.x = mouseX;
          nuke.y = mouseY;
        }
      }, { passive: false });

      canvas.addEventListener("touchend", (e) => {
        e.preventDefault();
        nuke.isGrabbed = false;
      }, { passive: false });

      function update() {
        if (!gameStarted) return;

        if (gameState === "exploding") {
          explosion.timer++;
          if (!explosion.ringPlayed && explosion.timer > 30) {
            playSound(ringBuffer, 0.8);
            explosion.ringPlayed = true;
          }
          for (let p of explosion.particles) {
            p.x += p.vx;
            p.y += p.vy;
            p.vy += 0.1;
            p.life--;
          }
          explosion.particles = explosion.particles.filter(p => p.life > 0);
          return;
        }

        if (gameState === "complete") return;

        if (!nuke.isGrabbed) {
          nuke.vy += GRAVITY;
          nuke.x += nuke.vx;
          nuke.y += nuke.vy;
          nuke.angle += nuke.rotationSpeed;
          nuke.rotationSpeed *= 0.98;
          if (nuke.vy !== 0) nuke.rotationSpeed = nuke.vx * 0.02;

          if (nuke.y + nuke.radius > GROUND_Y) {
            nuke.y = GROUND_Y - nuke.radius;
            nuke.vy *= -BOUNCE;
            nuke.vx *= FRICTION;
            nuke.rotationSpeed *= 0.8;
          }

          if (nuke.x - nuke.radius < 0) {
            nuke.x = nuke.radius;
            nuke.vx *= -BOUNCE;
          }
          if (nuke.x + nuke.radius > BASE_W) {
            nuke.x = BASE_W - nuke.radius;
            nuke.vx *= -BOUNCE;
          }

          const dx = nuke.x - walnut.x;
          const dy = nuke.y - walnut.y;
          const dist = Math.sqrt(dx*dx + dy*dy);
          const minDist = nuke.radius + walnut.radius;

          if (dist < minDist) {
            const overlap = minDist - dist;
            const nx = dx / dist;
            const ny = dy / dist;
            nuke.x += nx * overlap;
            nuke.y += ny * overlap;

            const relativeVel = Math.sqrt(nuke.vx*nuke.vx + nuke.vy*nuke.vy);
            if (relativeVel > 3.5) {
              nuke.bangs++;
              walnut.shake = 15;
              playSound(bangBuffer, 0.6);
              if (nuke.bangs >= 3) triggerExplosion();
            }

            const dot = nuke.vx * nx + nuke.vy * ny;
            nuke.vx -= 2 * dot * nx;
            nuke.vy -= 2 * dot * ny;
            nuke.vx *= 0.7;
            nuke.vy *= 0.7;
            nuke.rotationSpeed *= 0.5;
          }
        } else {
          const dx = nuke.x - walnut.x;
          const dy = nuke.y - walnut.y;
          const dist = Math.sqrt(dx*dx + dy*dy);
          if (dist < nuke.radius + walnut.radius) {
             const overlap = (nuke.radius + walnut.radius) - dist;
             const nx = dx / dist;
             const ny = dy / dist;
             nuke.x += nx * overlap;
             nuke.y += ny * overlap;
          }
        }

        if (walnut.shake > 0) walnut.shake *= 0.9;
        if (walnut.shake < 0.5) walnut.shake = 0;

        if (nuke.bangs > 0) {
          walnut.cracked = true;
          walnut.crackProgress = Math.min(1, nuke.bangs / 3);
        }
      }

      function triggerExplosion() {
        gameState = "exploding";
        explosion.timer = 0;
        explosion.ringPlayed = false;
        for (let i = 0; i < 200; i++) {
          const angle = Math.random() * Math.PI * 2;
          const speed = 5 + Math.random() * 25;
          explosion.particles.push({
            x: walnut.x,
            y: walnut.y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            life: 60 + Math.random() * 80,
            maxLife: 140,
            color: `hsl(${30 + Math.random()*30}, 100%, ${50 + Math.random()*50}%)`,
            size: 2 + Math.random() * 10
          });
        }
        document.documentElement.style.backgroundColor = '#ffffff';
        document.body.style.backgroundColor = '#ffffff';
        const allElements = document.querySelectorAll('*');
        allElements.forEach(el => {
          el.style.backgroundColor = '#ffffff';
          el.style.color = '#ffffff';
          el.style.borderColor = '#ffffff';
          el.style.boxShadow = 'none';
        });
      }

      function drawBackground() {
        const wallGrad = ctx.createLinearGradient(0, 0, 0, BASE_H);
        wallGrad.addColorStop(0, '#3a2a20');
        wallGrad.addColorStop(1, '#1a1210');
        ctx.fillStyle = wallGrad;
        ctx.fillRect(0, 0, BASE_W, BASE_H);

        ctx.strokeStyle = 'rgba(255, 255, 255, 0.03)';
        ctx.lineWidth = 2;
        for (let x = 0; x < BASE_W; x += 40) {
          ctx.beginPath();
          ctx.moveTo(x, 0);
          ctx.lineTo(x, BASE_H);
          ctx.stroke();
        }

        const tableGrad = ctx.createLinearGradient(0, TABLE_TOP, 0, BASE_H);
        tableGrad.addColorStop(0, '#5a3a2a');
        tableGrad.addColorStop(0.1, '#4a2a1a');
        tableGrad.addColorStop(1, '#2a1510');
        ctx.fillStyle = tableGrad;
        ctx.fillRect(0, TABLE_TOP, BASE_W, BASE_H - TABLE_TOP);

        ctx.strokeStyle = 'rgba(0, 0, 0, 0.15)';
        ctx.lineWidth = 1;
        for (let y = TABLE_TOP + 10; y < BASE_H; y += 15) {
          ctx.beginPath();
          ctx.moveTo(0, y);
          ctx.bezierCurveTo(BASE_W * 0.25, y + 5, BASE_W * 0.75, y - 5, BASE_W, y);
          ctx.stroke();
        }

        ctx.fillStyle = 'rgba(255, 255, 255, 0.05)';
        ctx.fillRect(0, TABLE_TOP, BASE_W, 3);

        ctx.fillStyle = 'rgba(0,0,0,0.3)';
        ctx.fillRect(0, TABLE_TOP, BASE_W, 10);
      }

      function drawWalnut() {
        const shakeX = (Math.random() - 0.5) * walnut.shake;
        const shakeY = (Math.random() - 0.5) * walnut.shake;

        ctx.save();
        ctx.translate(walnut.x + shakeX, walnut.y + shakeY);

        ctx.beginPath();
        ctx.ellipse(0, 35, 50, 15, 0, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(0,0,0,0.4)';
        ctx.fill();

        if (walnutLoaded) {
          ctx.drawImage(walnutImg, -walnut.radius, -walnut.radius, walnut.radius * 2, walnut.radius * 2);
        } else {
          const w = 90;
          const h = 110;
          
          ctx.beginPath();
          ctx.ellipse(0, 0, w/2, h/2, 0, 0, Math.PI * 2);
          ctx.fillStyle = '#c49a6c';
          ctx.fill();
          ctx.strokeStyle = '#8a6a4a';
          ctx.lineWidth = 3;
          ctx.stroke();

          ctx.lineWidth = 2;
          ctx.strokeStyle = '#a07850';
          
          for (let i = -30; i <= 30; i += 15) {
            ctx.beginPath();
            ctx.moveTo(i, -h/2 + 10);
            ctx.bezierCurveTo(i + 10, -20, i - 10, 20, i, h/2 - 10);
            ctx.stroke();
          }
          
          for (let j = -30; j <= 30; j += 15) {
            ctx.beginPath();
            ctx.moveTo(-w/2 + 10, j);
            ctx.bezierCurveTo(-20, j + 10, 20, j - 10, w/2 - 10, j);
            ctx.stroke();
          }

          ctx.beginPath();
          ctx.moveTo(0, -h/2 - 5);
          ctx.lineTo(5, -h/2 + 10);
          ctx.lineTo(-5, -h/2 + 10);
          ctx.closePath();
          ctx.fillStyle = '#b08858';
          ctx.fill();
        }

        if (walnut.cracked) {
          ctx.strokeStyle = '#3a2010';
          ctx.lineWidth = 2 + walnut.crackProgress * 2;
          
          ctx.beginPath();
          ctx.moveTo(-10, -20);
          ctx.lineTo(5, 0);
          ctx.lineTo(-15, 20);
          ctx.stroke();

          if (walnut.crackProgress > 0.3) {
            ctx.beginPath();
            ctx.moveTo(20, -30);
            ctx.lineTo(10, 10);
            ctx.lineTo(30, 40);
            ctx.stroke();
          }

          if (walnut.crackProgress > 0.6) {
            ctx.beginPath();
            ctx.moveTo(-40, 10);
            ctx.lineTo(-10, 0);
            ctx.lineTo(0, -30);
            ctx.stroke();
          }
        }

        ctx.restore();
      }

      function drawNuke() {
        ctx.save();
        ctx.translate(nuke.x, nuke.y);
        ctx.rotate(nuke.angle);

        if (nukeLoaded) {
          ctx.drawImage(nukeImg, -nuke.radius, -nuke.radius, nuke.radius * 2, nuke.radius * 2);
        } else {
          ctx.beginPath();
          ctx.ellipse(0, 0, 25, 50, 0, 0, Math.PI * 2);
          ctx.fillStyle = '#8a8a8a';
          ctx.fill();
          ctx.strokeStyle = '#5a5a5a';
          ctx.lineWidth = 3;
          ctx.stroke();

          ctx.beginPath();
          ctx.ellipse(-5, -10, 10, 30, 0, 0, Math.PI * 2);
          ctx.fillStyle = 'rgba(255, 255, 255, 0.2)';
          ctx.fill();

          ctx.fillStyle = '#6a6a6a';
          ctx.beginPath();
          ctx.moveTo(-10, 45);
          ctx.lineTo(-30, 65);
          ctx.lineTo(-10, 75);
          ctx.closePath();
          ctx.fill();
          ctx.stroke();

          ctx.beginPath();
          ctx.moveTo(10, 45);
          ctx.lineTo(30, 65);
          ctx.lineTo(10, 75);
          ctx.closePath();
          ctx.fill();
          ctx.stroke();

          ctx.beginPath();
          ctx.moveTo(0, 50);
          ctx.lineTo(0, 80);
          ctx.lineTo(-15, 75);
          ctx.closePath();
          ctx.fill();
          ctx.stroke();

          ctx.beginPath();
          ctx.arc(0, -45, 8, 0, Math.PI * 2);
          ctx.fillStyle = '#4a4a4a';
          ctx.fill();

          ctx.beginPath();
          ctx.arc(-5, -20, 4, 0, Math.PI * 2);
          ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
          ctx.fill();
        }

        ctx.restore();
      }

      function drawExplosion() {
        const progress = explosion.timer / explosion.maxTimer;
        const alpha = Math.max(0, 1 - progress * 1.2);

        ctx.fillStyle = `rgba(255, 255, 255, ${alpha})`;
        ctx.fillRect(0, 0, BASE_W, BASE_H);

        for (let p of explosion.particles) {
          const pAlpha = p.life / p.maxLife;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.size * pAlpha, 0, Math.PI * 2);
          ctx.fillStyle = p.color.replace(')', `, ${pAlpha})`).replace('hsl', 'hsla');
          ctx.fill();
        }

        if (progress < 0.5) {
          const coreAlpha = 1 - (progress * 2);
          const coreSize = 100 + progress * 400;
          const grad = ctx.createRadialGradient(walnut.x, walnut.y, 5, walnut.x, walnut.y, coreSize);
          grad.addColorStop(0, `rgba(255, 255, 255, ${coreAlpha})`);
          grad.addColorStop(0.5, `rgba(255, 200, 50, ${coreAlpha * 0.8})`);
          grad.addColorStop(1, `rgba(255, 100, 0, 0)`);
          ctx.fillStyle = grad;
          ctx.beginPath();
          ctx.arc(walnut.x, walnut.y, coreSize, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      function drawCursor() {
        const cx = mouseX;
        const cy = mouseY;

        ctx.save();
        ctx.translate(cx, cy);

        let scale = 1;
        if (nuke.isGrabbed) scale = 0.85;
        ctx.scale(scale, scale);

        ctx.shadowColor = 'rgba(0, 0, 0, 0.7)';
        ctx.shadowBlur = 8;
        ctx.shadowOffsetX = 2;
        ctx.shadowOffsetY = 2;

        ctx.fillStyle = '#ffffff';
        ctx.strokeStyle = '#222222';
        ctx.lineWidth = 2;

        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.lineTo(0, 28);
        ctx.lineTo(8, 20);
        ctx.lineTo(14, 32);
        ctx.lineTo(20, 28);
        ctx.lineTo(14, 16);
        ctx.lineTo(24, 16);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();

        ctx.shadowBlur = 0;
        ctx.shadowOffsetX = 0;
        ctx.shadowOffsetY = 0;
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.6)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(2, 4);
        ctx.lineTo(2, 22);
        ctx.stroke();

        ctx.restore();
      }

      function drawUI() {
        ctx.save();
        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 24px "Segoe UI", Arial, sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'top';
        
        if (!gameStarted) {
          ctx.shadowColor = 'rgba(0,0,0,0.8)';
          ctx.shadowBlur = 10;
          ctx.fillText('Click to Start', BASE_W/2, BASE_H/2 + 100);
        } else if (gameState === "playing") {
          ctx.shadowColor = 'rgba(0,0,0,0.8)';
          ctx.shadowBlur = 10;
          ctx.font = 'bold 18px "Segoe UI", Arial, sans-serif';
          ctx.fillText('Drag the nutcracker to smash the Walnut', BASE_W/2, 30);
          
          ctx.font = 'bold 22px "Segoe UI", Arial, sans-serif';
          ctx.fillStyle = '#f0e068';
          ctx.fillText(`BANGS: ${nuke.bangs} / 3`, BASE_W/2, 70);
          
          if (nuke.bangs >= 3) {
            ctx.fillStyle = '#ff4040';
            ctx.fillText('BOOM!', BASE_W/2, 110);
          }
        }
        
        ctx.restore();
      }

      function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        ctx.save();
        ctx.scale(scaleX, scaleY);

        if (gameState === "exploding") {
          drawExplosion();
        } else if (gameState === "complete") {
          ctx.fillStyle = '#ffffff';
          ctx.fillRect(0, 0, BASE_W, BASE_H);
        } else {
          drawBackground();
          drawWalnut();
          drawNuke();
          drawUI();
          drawCursor();
        }
        
        ctx.restore();
      }

      function loop() {
        update();
        draw();
        requestAnimationFrame(loop);
      }

      resizeCanvas();
      loop();

    })();
  </script>

</body>
