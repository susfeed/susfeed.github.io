<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>New York Flyover Simulator</title>
  <link rel="shortcut icon" href="../../img/amogus.webp" type="image/x-icon" />
  <link rel="stylesheet" href="../../index.css" />
  <link rel="stylesheet" href="../../styles/90s.css" />

  <style>
    .game-container {
      position: relative;
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
      user-select: none;
      touch-action: none;
      background: #000;
      overflow: hidden;
      aspect-ratio: 16 / 9;
      border: 4px solid #3a5e77;
      box-shadow: 0 0 0 4px #1f2e3a, 0 8px 0 #0a1a2a;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
      cursor: pointer;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }

    .scoreboard {
      margin-top: 20px;
      text-align: center;
      font-size: 1.2rem;
      font-family: 'Courier New', Courier, monospace;
      color: #9bb8d4;
      text-shadow: 2px 2px 0 #0a1a2a;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>

  <div class="wrapper">

    <div class="site-header"></div>

    <main class="container article-content">
      <h1 class="article-main-title"><u>New York Flyover Simulator</u></h1>
      <p class="article-date"><i>Article Published by Cameron at 1993/08/11 8:08 PM CET</i></p>

      <div class="game-container">
        <canvas id="gameCanvas"></canvas>
      </div>

      <div class="scoreboard">
        <p><i>CLICK / TAP TO FLY - avoid the Towers</i></p>
      </div>
    </main>

    <div class="site-footer"></div>

  </div>

  <script src="../../contentheader.js"></script>

  <script>
    (function() {
      const canvas = document.getElementById("gameCanvas");
      const ctx = canvas.getContext("2d");

      ctx.imageSmoothingEnabled = false;

      const W = 800;
      const H = 450;
      canvas.width = W;
      canvas.height = H;

      const GRAVITY = 0.45;
      const JUMP_FORCE = -7.2;
      const PIPE_WIDTH = 65;
      const GAP_HEIGHT = 130;
      const PIPE_SPEED = 2.6;
      const PIPE_SPACING = 260;

      const GROUND_Y = H - 40;
      const CEILING_Y = 20;

      let plane = {
        x: 130,
        y: H / 2,
        vy: 0,
        radius: 16,
        angle: 0,
      };

      let pipes = [];
      let score = 0;
      let bestScore = 0;
      let gameOver = false;
      let gameStarted = false;
      let frame = 0;

      let particles = [];
      let explosionParticles = [];
      let debrisParticles = [];
      let screenShake = 0;

      const COLORS = {
        skyTop: '#1a2e4a',
        skyBottom: '#4a7a9c',
        buildingDark: '#2a2a3a',
        buildingLight: '#4a4a6a',
        window: '#e8e8a0',
        windowLit: '#ffffb0',
        ground: '#3a5a3a',
        groundStripe: '#5a8a5a',
        text: '#e8e8e8',
        textShadow: '#1a1a2a',
        twinTower: '#6a6a7a',
        twinTowerEdge: '#8a8a9a',
        twinWindow: '#d4d4a0',
        twinWindowDark: '#a0a080',
        planeBody: '#c0c0c0',
        planeDark: '#808080',
        planeLight: '#e0e0e0',
        planeWindow: '#4a8ab0',
        planeStripe: '#b03030',
        explosion1: '#ff4400',
        explosion2: '#ff8800',
        explosion3: '#ffcc00',
        explosion4: '#ffffff',
        explosion5: '#888888',
        explosion6: '#ff2200',
        explosion7: '#ffaa00',
      };

      let audioCtx = null;
      function playBeep(freq, duration, type, volume) {
        try {
          if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
          if (audioCtx.state === 'suspended') audioCtx.resume();
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = type || 'square';
          osc.frequency.value = freq;
          gain.gain.value = volume || 0.3;
          gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start();
          osc.stop(audioCtx.currentTime + duration);
        } catch (e) {}
      }

      function createExplosion(x, y, count) {
        const colors = [COLORS.explosion1, COLORS.explosion2, COLORS.explosion3, COLORS.explosion4, COLORS.explosion5, COLORS.explosion6, COLORS.explosion7];
        for (let i = 0; i < count; i++) {
          const angle = Math.random() * Math.PI * 2;
          const speed = Math.random() * 12 + 3;
          explosionParticles.push({
            x: x,
            y: y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed - 2,
            life: 30 + Math.random() * 40,
            maxLife: 70,
            size: 4 + Math.random() * 10,
            color: colors[Math.floor(Math.random() * colors.length)],
            gravity: 0.12 + Math.random() * 0.1,
          });
        }
      }

      function createTowerDebris(p) {
        const topH = p.topHeight;
        const botY = p.bottomY;
        const botH = GROUND_Y - botY;
        const colors = [COLORS.twinTower, COLORS.twinTowerEdge, COLORS.twinWindow, COLORS.twinWindowDark, COLORS.twinWindowDark];

        const topBlockCount = Math.floor((topH - CEILING_Y) / 12);
        for (let i = 0; i < topBlockCount; i++) {
          const by = CEILING_Y + i * 12;
          const bx = p.x + (Math.random() - 0.5) * PIPE_WIDTH;
          debrisParticles.push({
            x: bx,
            y: by,
            vx: (Math.random() - 0.5) * 8 + 2,
            vy: -Math.random() * 6 - 2,
            life: 80 + Math.random() * 60,
            maxLife: 140,
            size: 8 + Math.random() * 8,
            color: colors[Math.floor(Math.random() * colors.length)],
            gravity: 0.25 + Math.random() * 0.15,
            rotation: Math.random() * Math.PI * 2,
            rotSpeed: (Math.random() - 0.5) * 0.4,
            isBlock: true,
          });
        }

        const botBlockCount = Math.floor(botH / 12);
        for (let i = 0; i < botBlockCount; i++) {
          const by = botY + i * 12;
          const bx = p.x + (Math.random() - 0.5) * PIPE_WIDTH;
          debrisParticles.push({
            x: bx,
            y: by,
            vx: (Math.random() - 0.5) * 8 + 2,
            vy: -Math.random() * 6 - 2,
            life: 80 + Math.random() * 60,
            maxLife: 140,
            size: 8 + Math.random() * 8,
            color: colors[Math.floor(Math.random() * colors.length)],
            gravity: 0.25 + Math.random() * 0.15,
            rotation: Math.random() * Math.PI * 2,
            rotSpeed: (Math.random() - 0.5) * 0.4,
            isBlock: true,
          });
        }

        for (let i = 0; i < 30; i++) {
          const by = CEILING_Y + Math.random() * (topH - CEILING_Y);
          debrisParticles.push({
            x: p.x + Math.random() * PIPE_WIDTH,
            y: by,
            vx: (Math.random() - 0.5) * 12,
            vy: -Math.random() * 8 - 3,
            life: 60 + Math.random() * 50,
            maxLife: 110,
            size: 4 + Math.random() * 6,
            color: colors[Math.floor(Math.random() * colors.length)],
            gravity: 0.3 + Math.random() * 0.1,
            rotation: Math.random() * Math.PI * 2,
            rotSpeed: (Math.random() - 0.5) * 0.5,
            isBlock: true,
          });
        }

        for (let i = 0; i < 30; i++) {
          const by = botY + Math.random() * botH;
          debrisParticles.push({
            x: p.x + Math.random() * PIPE_WIDTH,
            y: by,
            vx: (Math.random() - 0.5) * 12,
            vy: -Math.random() * 8 - 3,
            life: 60 + Math.random() * 50,
            maxLife: 110,
            size: 4 + Math.random() * 6,
            color: colors[Math.floor(Math.random() * colors.length)],
            gravity: 0.3 + Math.random() * 0.1,
            rotation: Math.random() * Math.PI * 2,
            rotSpeed: (Math.random() - 0.5) * 0.5,
            isBlock: true,
          });
        }
      }

      function resetGame() {
        plane = {
          x: 130,
          y: H / 2,
          vy: 0,
          radius: 16,
          angle: 0,
        };
        pipes = [];
        score = 0;
        gameOver = false;
        gameStarted = false;
        frame = 0;
        particles = [];
        explosionParticles = [];
        debrisParticles = [];
        screenShake = 0;

        for (let i = 0; i < 4; i++) {
          spawnPipe(W + i * PIPE_SPACING);
        }
      }

      function spawnPipe(x) {
        const minTop = 60;
        const maxTop = GROUND_Y - GAP_HEIGHT - 60;
        const topHeight = Math.floor(Math.random() * (maxTop - minTop) + minTop);
        const bottomY = topHeight + GAP_HEIGHT;
        pipes.push({
          x: x,
          topHeight: topHeight,
          bottomY: bottomY,
          passed: false,
          destroyed: false,
          destructionTimer: 0,
        });
      }

      function jump() {
        if (gameOver) {
          resetGame();
          return;
        }
        if (!gameStarted) {
          gameStarted = true;
        }
        plane.vy = JUMP_FORCE;
        playBeep(440, 0.12, 'square', 0.35);
        for (let i = 0; i < 5; i++) {
          particles.push({
            x: plane.x - 10,
            y: plane.y + (Math.random() - 0.5) * 10,
            vx: -2 - Math.random() * 2,
            vy: (Math.random() - 0.5) * 2,
            life: 15 + Math.random() * 10,
            size: 2 + Math.random() * 3,
            color: '#88ccff',
          });
        }
      }

      function destroyTower(p) {
        if (p.destroyed) return;
        p.destroyed = true;
        p.destructionTimer = 5;

        createTowerDebris(p);

        createExplosion(p.x + PIPE_WIDTH / 2, (CEILING_Y + p.topHeight) / 2, 60);
        createExplosion(p.x + PIPE_WIDTH / 2, (p.bottomY + GROUND_Y) / 2, 60);

        playBeep(80, 0.8, 'sawtooth', 0.5);
        playBeep(60, 1.2, 'sawtooth', 0.3);
      }

      function update() {
        if (screenShake > 0) screenShake *= 0.9;
        if (screenShake < 0.1) screenShake = 0;

        for (let i = explosionParticles.length - 1; i >= 0; i--) {
          const p = explosionParticles[i];
          p.vy += p.gravity;
          p.x += p.vx;
          p.y += p.vy;
          p.vx *= 0.98;
          p.vy *= 0.98;
          p.life--;
          if (p.life <= 0) explosionParticles.splice(i, 1);
        }

        for (let i = debrisParticles.length - 1; i >= 0; i--) {
          const p = debrisParticles[i];
          p.vy += p.gravity;
          p.x += p.vx;
          p.y += p.vy;
          p.vx *= 0.99;
          p.rotation += p.rotSpeed;
          p.life--;
          if (p.y > GROUND_Y - p.size / 2) {
            p.y = GROUND_Y - p.size / 2;
            p.vy *= -0.35;
            p.vx *= 0.7;
            p.rotSpeed *= 0.7;
          }
          if (p.life <= 0) debrisParticles.splice(i, 1);
        }

        if (gameOver) return;
        if (!gameStarted) return;

        frame++;

        plane.vy += GRAVITY;
        plane.y += plane.vy;

        const targetAngle = Math.max(-0.5, Math.min(0.8, plane.vy * 0.06));
        plane.angle += (targetAngle - plane.angle) * 0.15;

        if (plane.y - plane.radius < CEILING_Y) {
          plane.y = CEILING_Y + plane.radius;
          plane.vy = 0;
        }

        if (plane.y + plane.radius > GROUND_Y) {
          plane.y = GROUND_Y - plane.radius;
          plane.vy = 0;
          gameOver = true;
          playBeep(120, 0.4, 'sawtooth', 0.4);
          createExplosion(plane.x, plane.y, 100);
          screenShake = 20;
          if (score > bestScore) bestScore = score;
        }

        for (let i = particles.length - 1; i >= 0; i--) {
          const p = particles[i];
          p.x += p.vx;
          p.y += p.vy;
          p.life--;
          if (p.life <= 0) particles.splice(i, 1);
        }

        for (let i = pipes.length - 1; i >= 0; i--) {
          const p = pipes[i];
          p.x -= PIPE_SPEED;

          if (p.destroyed) {
            p.destructionTimer--;
            if (p.destructionTimer <= 0) {
              pipes.splice(i, 1);
            }
            continue;
          }

          if (p.x + PIPE_WIDTH < -50) {
            pipes.splice(i, 1);
            continue;
          }

          if (!p.passed && p.x + PIPE_WIDTH < plane.x - plane.radius) {
            p.passed = true;
            score++;
            playBeep(880, 0.1, 'square', 0.3);
          }

          const topRect = {
            x: p.x,
            y: CEILING_Y,
            w: PIPE_WIDTH,
            h: p.topHeight - CEILING_Y,
          };
          const botRect = {
            x: p.x,
            y: p.bottomY,
            w: PIPE_WIDTH,
            h: GROUND_Y - p.bottomY,
          };

          if (circleRectCollide(plane.x, plane.y, plane.radius, topRect.x, topRect.y, topRect.w, topRect.h) ||
              circleRectCollide(plane.x, plane.y, plane.radius, botRect.x, botRect.y, botRect.w, botRect.h)) {
            gameOver = true;
            playBeep(120, 0.4, 'sawtooth', 0.4);
            createExplosion(plane.x, plane.y, 120);
            destroyTower(p);
            screenShake = 30;
            if (score > bestScore) bestScore = score;
          }
        }

        const lastPipe = pipes[pipes.length - 1];
        if (!lastPipe || lastPipe.x < W - PIPE_SPACING) {
          spawnPipe(W + 20);
        }
      }

      function circleRectCollide(cx, cy, r, rx, ry, rw, rh) {
        const closestX = Math.max(rx, Math.min(cx, rx + rw));
        const closestY = Math.max(ry, Math.min(cy, ry + rh));
        const dx = cx - closestX;
        const dy = cy - closestY;
        return (dx * dx + dy * dy) < (r * r);
      }

      function drawBackground() {
        const grad = ctx.createLinearGradient(0, 0, 0, H);
        grad.addColorStop(0, COLORS.skyTop);
        grad.addColorStop(1, COLORS.skyBottom);
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, W, H);

        ctx.fillStyle = 'rgba(200, 220, 240, 0.25)';
        for (let i = 0; i < 6; i++) {
          const cx = ((i * 170 + frame * 0.3) % (W + 120)) - 60;
          const cy = 40 + (i * 37) % 130;
          ctx.fillRect(cx, cy, 60, 16);
          ctx.fillRect(cx + 15, cy - 8, 30, 8);
          ctx.fillRect(cx - 10, cy + 4, 80, 12);
        }

        ctx.fillStyle = 'rgba(30, 40, 60, 0.5)';
        for (let i = 0; i < 14; i++) {
          const bx = (i * 65 + frame * 0.1) % (W + 80) - 40;
          const bh = 60 + (i * 23) % 80;
          ctx.fillRect(bx, GROUND_Y - bh, 40, bh);
        }
      }

      function drawTwinTowerPipe(p) {
        if (p.destroyed) return;

        const topH = p.topHeight;
        const botY = p.bottomY;
        const botH = GROUND_Y - botY;

        ctx.fillStyle = COLORS.twinTower;
        ctx.fillRect(p.x, CEILING_Y, PIPE_WIDTH, topH - CEILING_Y);
        ctx.fillStyle = COLORS.twinTowerEdge;
        ctx.fillRect(p.x, CEILING_Y, 6, topH - CEILING_Y);
        ctx.fillRect(p.x + PIPE_WIDTH - 6, CEILING_Y, 6, topH - CEILING_Y);
        ctx.fillStyle = COLORS.twinWindow;
        const winW = 10;
        const winH = 12;
        const cols = 3;
        const colSpacing = (PIPE_WIDTH - 10) / (cols + 1);
        for (let row = 0; row < Math.floor((topH - CEILING_Y) / 18); row++) {
          for (let c = 0; c < cols; c++) {
            const wx = p.x + 8 + c * colSpacing;
            const wy = CEILING_Y + 10 + row * 18;
            if (wy + winH < topH - 4) {
              ctx.fillStyle = (row % 3 === 0 && c % 2 === 0) ? COLORS.windowLit : COLORS.twinWindowDark;
              ctx.fillRect(wx, wy, winW, winH);
            }
          }
        }
        ctx.fillStyle = '#aaa';
        ctx.fillRect(p.x + PIPE_WIDTH / 2 - 2, CEILING_Y - 12, 4, 12);
        ctx.fillStyle = '#ff4444';
        ctx.fillRect(p.x + PIPE_WIDTH / 2 - 2, CEILING_Y - 18, 4, 6);

        ctx.fillStyle = COLORS.twinTower;
        ctx.fillRect(p.x, botY, PIPE_WIDTH, botH);
        ctx.fillStyle = COLORS.twinTowerEdge;
        ctx.fillRect(p.x, botY, 6, botH);
        ctx.fillRect(p.x + PIPE_WIDTH - 6, botY, 6, botH);
        ctx.fillStyle = COLORS.twinWindow;
        for (let row = 0; row < Math.floor(botH / 18); row++) {
          for (let c = 0; c < cols; c++) {
            const wx = p.x + 8 + c * colSpacing;
            const wy = botY + 10 + row * 18;
            if (wy + winH < GROUND_Y - 4) {
              ctx.fillStyle = (row % 3 === 1 && c % 2 === 1) ? COLORS.windowLit : COLORS.twinWindowDark;
              ctx.fillRect(wx, wy, winW, winH);
            }
          }
        }
        ctx.fillStyle = '#aaa';
        ctx.fillRect(p.x + PIPE_WIDTH / 2 - 2, GROUND_Y - 8, 4, 8);
      }

      function drawPlane() {
        const px = plane.x;
        const py = plane.y;
        const r = plane.radius;

        ctx.save();
        ctx.translate(px, py);
        ctx.rotate(plane.angle);

        ctx.fillStyle = COLORS.planeBody;
        ctx.fillRect(-r - 8, -r * 0.4, r * 2 + 16, r * 0.8);

        ctx.fillStyle = COLORS.planeDark;
        ctx.fillRect(-r - 8, r * 0.1, r * 2 + 16, r * 0.3);

        ctx.fillStyle = COLORS.planeLight;
        ctx.fillRect(-r - 8, -r * 0.4, r * 2 + 16, 3);

        ctx.fillStyle = COLORS.planeStripe;
        ctx.fillRect(-r - 8, -r * 0.4, 6, r * 0.8);

        ctx.fillStyle = COLORS.planeBody;
        ctx.beginPath();
        ctx.moveTo(r + 8, -r * 0.3);
        ctx.lineTo(r + 18, 0);
        ctx.lineTo(r + 8, r * 0.3);
        ctx.closePath();
        ctx.fill();

        ctx.fillStyle = COLORS.planeDark;
        ctx.beginPath();
        ctx.moveTo(-r - 8, -r * 0.2);
        ctx.lineTo(-r - 18, -r * 0.6);
        ctx.lineTo(-r - 14, -r * 0.1);
        ctx.closePath();
        ctx.fill();

        ctx.fillStyle = COLORS.planeBody;
        ctx.fillRect(-r - 14, -r * 0.15, 10, 4);
        ctx.fillRect(-r - 14, r * 0.05, 10, 4);

        ctx.fillStyle = COLORS.planeWindow;
        ctx.fillRect(-r + 4, -r * 0.2, 8, 6);
        ctx.fillRect(-r + 16, -r * 0.2, 8, 6);
        ctx.fillRect(-r + 28, -r * 0.2, 8, 6);

        ctx.fillStyle = COLORS.planeBody;
        ctx.beginPath();
        ctx.moveTo(-4, -r * 0.4);
        ctx.lineTo(-12, -r * 0.9);
        ctx.lineTo(8, -r * 0.9);
        ctx.lineTo(14, -r * 0.4);
        ctx.closePath();
        ctx.fill();

        ctx.fillStyle = COLORS.planeDark;
        ctx.beginPath();
        ctx.moveTo(-4, -r * 0.4);
        ctx.lineTo(-12, -r * 0.9);
        ctx.lineTo(8, -r * 0.9);
        ctx.lineTo(14, -r * 0.4);
        ctx.closePath();
        ctx.globalAlpha = 0.3;
        ctx.fill();
        ctx.globalAlpha = 1;

        ctx.fillStyle = COLORS.planeLight;
        ctx.fillRect(-12, -r * 0.9, 20, 2);

        ctx.fillStyle = COLORS.planeDark;
        ctx.fillRect(-8, -r * 0.7, 10, 6);
        ctx.fillStyle = '#666';
        ctx.fillRect(-8, -r * 0.7, 10, 2);

        ctx.fillStyle = '#444';
        ctx.fillRect(r + 16, -2, 6, 4);
        ctx.fillStyle = '#222';
        ctx.fillRect(r + 20, -r * 0.5, 3, r);

        ctx.restore();
      }

      function drawParticles() {
        for (const p of particles) {
          ctx.fillStyle = p.color || '#88ccff';
          ctx.globalAlpha = Math.min(1, p.life / 10);
          ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
        }
        ctx.globalAlpha = 1;
      }

      function drawExplosion() {
        for (const p of explosionParticles) {
          const alpha = Math.min(1, p.life / 20);
          ctx.globalAlpha = alpha;
          ctx.fillStyle = p.color;
          ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
        }
        ctx.globalAlpha = 1;
      }

      function drawDebris() {
        for (const p of debrisParticles) {
          const alpha = Math.min(1, p.life / 25);
          ctx.globalAlpha = alpha;
          ctx.save();
          ctx.translate(p.x, p.y);
          ctx.rotate(p.rotation);
          ctx.fillStyle = p.color;
          ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
          ctx.strokeStyle = 'rgba(0,0,0,0.3)';
          ctx.lineWidth = 1;
          ctx.strokeRect(-p.size / 2, -p.size / 2, p.size, p.size);
          ctx.restore();
        }
        ctx.globalAlpha = 1;
      }

      function drawGround() {
        ctx.fillStyle = COLORS.ground;
        ctx.fillRect(0, GROUND_Y, W, H - GROUND_Y);
        ctx.fillStyle = COLORS.groundStripe;
        for (let i = 0; i < W; i += 20) {
          const offset = (frame * 2) % 20;
          ctx.fillRect(i - offset, GROUND_Y + 6, 10, 6);
          ctx.fillRect(i - offset + 10, GROUND_Y + 20, 10, 6);
        }
        ctx.fillStyle = '#5a8a5a';
        ctx.fillRect(0, GROUND_Y, W, 3);
      }

      function drawUI() {
        ctx.font = 'bold 36px "Courier New", Courier, monospace';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'top';

        ctx.fillStyle = COLORS.textShadow;
        ctx.fillText(score, W / 2 + 3, 28);
        ctx.fillStyle = COLORS.text;
        ctx.fillText(score, W / 2, 25);

        ctx.font = 'bold 16px "Courier New", Courier, monospace';
        ctx.fillStyle = COLORS.textShadow;
        ctx.fillText('BEST: ' + bestScore, W / 2 + 2, 72);
        ctx.fillStyle = '#b8d4e8';
        ctx.fillText('BEST: ' + bestScore, W / 2, 70);

        if (!gameStarted && !gameOver) {
          ctx.font = 'bold 28px "Courier New", Courier, monospace';
          ctx.fillStyle = COLORS.textShadow;
          ctx.fillText('CLICK TO FLY', W / 2 + 3, H / 2 - 40 + 3);
          ctx.fillStyle = COLORS.text;
          ctx.fillText('CLICK TO FLY', W / 2, H / 2 - 40);

          ctx.font = 'bold 16px "Courier New", Courier, monospace';
          ctx.fillStyle = '#b8d4e8';
          ctx.fillText('NEW YORK FLYOVER SIMULATOR', W / 2, H / 2 + 10);
        }

        if (gameOver) {
          ctx.fillStyle = 'rgba(10, 20, 30, 0.7)';
          ctx.fillRect(0, 0, W, H);

          ctx.font = 'bold 44px "Courier New", Courier, monospace';
          ctx.fillStyle = COLORS.textShadow;
          ctx.fillText('GAME OVER', W / 2 + 4, H / 2 - 60 + 4);
          ctx.fillStyle = '#e86a4a';
          ctx.fillText('GAME OVER', W / 2, H / 2 - 60);

          ctx.font = 'bold 22px "Courier New", Courier, monospace';
          ctx.fillStyle = COLORS.textShadow;
          ctx.fillText('SCORE: ' + score, W / 2 + 2, H / 2 + 10 + 2);
          ctx.fillStyle = COLORS.text;
          ctx.fillText('SCORE: ' + score, W / 2, H / 2 + 10);

          ctx.font = 'bold 18px "Courier New", Courier, monospace';
          ctx.fillStyle = '#b8d4e8';
          ctx.fillText('CLICK TO RESTART', W / 2, H / 2 + 70);
        }
      }

      function draw() {
        ctx.save();

        if (screenShake > 0) {
          ctx.translate((Math.random() - 0.5) * screenShake, (Math.random() - 0.5) * screenShake);
        }

        drawBackground();
        for (const p of pipes) {
          drawTwinTowerPipe(p);
        }
        drawGround();
        drawParticles();
        if (!gameOver) drawPlane();
        drawDebris();
        drawExplosion();
        drawUI();

        ctx.fillStyle = 'rgba(0, 0, 0, 0.03)';
        for (let y = 0; y < H; y += 4) {
          ctx.fillRect(0, y, W, 1);
        }

        ctx.restore();
      }

      function gameLoop() {
        update();
        draw();
        requestAnimationFrame(gameLoop);
      }

      canvas.addEventListener('click', (e) => {
        e.preventDefault();
        jump();
      });

      canvas.addEventListener('touchstart', (e) => {
        e.preventDefault();
        jump();
      }, { passive: false });

      window.addEventListener('keydown', (e) => {
        if (e.code === 'Space' || e.code === 'ArrowUp') {
          e.preventDefault();
          jump();
        }
      });

      resetGame();
      gameLoop();
    })();
  </script>

</body>
</html>
