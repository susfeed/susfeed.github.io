<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

  <link rel="shortcut icon" href="../../img/amogus.webp" type="image/x-icon" />
  <link rel="stylesheet" href="../../index.css" />
  <link rel="stylesheet" href="../../content.css" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    .game-container {
      position: relative;
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
      background: #000;
      overflow: hidden;
      aspect-ratio: 16 / 9;
      border-radius: 12px;
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.6);
      cursor: pointer;
      font-family: 'Segoe UI', Arial, Helvetica, sans-serif;
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    .start-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 10;
      transition: opacity 0.4s;
      cursor: pointer;
      padding: 20px;
    }

    .start-overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .start-overlay h1 {
      color: #ffffff;
      font-size: clamp(24px, 6vw, 52px);
      letter-spacing: 2px;
      margin-bottom: 16px;
      text-align: center;
      font-weight: 800;
      text-shadow: 0 2px 10px rgba(0,0,0,0.5);
    }

    .start-overlay p {
      color: #a0a0b0;
      font-size: clamp(14px, 2.5vw, 18px);
      margin-bottom: 40px;
      text-align: center;
      max-width: 500px;
      line-height: 1.5;
    }

    .start-btn {
      background: linear-gradient(135deg, #e32636 0%, #b81d2a 100%);
      border: none;
      color: #ffffff;
      font-family: 'Segoe UI', Arial, Helvetica, sans-serif;
      font-weight: 700;
      font-size: clamp(16px, 3vw, 22px);
      padding: 16px 50px;
      border-radius: 8px;
      cursor: pointer;
      letter-spacing: 2px;
      text-transform: uppercase;
      box-shadow: 0 4px 15px rgba(227, 38, 54, 0.4);
      transition: all 0.2s;
    }

    .start-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(227, 38, 54, 0.6);
    }

    .start-btn:active {
      transform: translateY(0);
    }
  </style>
</head>

      function startGame() {
        startOverlay.classList.add('hidden');

        if (!bgmAudio) {
          bgmAudio = new Audio('bgm.mp3');
          bgmAudio.loop = true;
          bgmAudio.volume = 0.3;
          bgmAudio.play().catch(() => {});
        }
        if (!scrollAudio) {
          scrollAudio = new Audio('scroll.mp3');
          scrollAudio.loop = true;
          scrollAudio.volume = 0.4;
        }
        if (!clickAudio) {
          clickAudio = new Audio('click.mp3');
          clickAudio.volume = 0.5;
        }

        resetGame();
      }

      function resetGame() {
        gameState = 'dialogue';
        charIndex = 0;
        typingTimer = 0;
        isTyping = true;
        showOptions = false;
        hoverOption = -1;
        affection = 50;
        endingTitle = '';
        endingDesc = '';
        endingColor = COLORS.red;
        pathTaken = 'none';

        const node = dialogues.start;
        currentDialogue = node.text;
        currentOptions = node.options;

        if (scrollAudio) {
          scrollAudio.currentTime = 0;
          scrollAudio.play().catch(() => {});
        }
      }

      function drawBackground() {
        if (roomLoaded) {
          ctx.drawImage(roomImage, 0, 0, W, H);
          ctx.fillStyle = 'rgba(10, 10, 20, 0.6)';
          ctx.fillRect(0, 0, W, H);
        } else {
          ctx.fillStyle = COLORS.bg;
          ctx.fillRect(0, 0, W, H);
        }
      }

      function drawJosh() {
        if (joshLoaded) {
          const imgAspect = joshImage.width / joshImage.height;
          const drawH = 560;
          const drawW = drawH * imgAspect;
          const x = W / 2 - drawW / 2;
          const y = H - drawH + 60;

          ctx.save();
          ctx.shadowColor = 'rgba(0, 0, 0, 0.6)';
          ctx.shadowBlur = 30;
          ctx.shadowOffsetY = 15;
          ctx.drawImage(joshImage, x, y, drawW, drawH);
          ctx.restore();
        }
      }

      function drawAffectionBar() {
        const barW = 200;
        const barH = 8;
        const x = W - barW - 30;
        const y = 30;

        ctx.fillStyle = 'rgba(255, 255, 255, 0.1)';
        ctx.beginPath();
        ctx.roundRect(x, y, barW, barH, 4);
        ctx.fill();

        const fillW = (affection / 100) * barW;
        const gradient = ctx.createLinearGradient(x, y, x + barW, y);
        gradient.addColorStop(0, '#e32636');
        gradient.addColorStop(1, '#ff6b7a');
        ctx.fillStyle = gradient;
        ctx.beginPath();
        ctx.roundRect(x, y, fillW, barH, 4);
        ctx.fill();

        ctx.font = '600 12px "Segoe UI", Arial, sans-serif';
        ctx.fillStyle = 'rgba(255, 255, 255, 0.7)';
        ctx.textAlign = 'right';
        ctx.textBaseline = 'bottom';
        ctx.fillText('AFFECTION', W - 30, y - 6);
      }

      function wrapText(text, x, y, maxWidth, lineHeight) {
        ctx.font = '400 19px "Segoe UI", Arial, sans-serif';
        ctx.textAlign = 'left';
        ctx.textBaseline = 'top';
        const words = text.split(' ');
        let line = '';
        let lineY = y;
        for (let n = 0; n < words.length; n++) {
          const testLine = line + words[n] + ' ';
          const metrics = ctx.measureText(testLine);
          if (metrics.width > maxWidth && n > 0) {
            ctx.fillStyle = COLORS.text;
            ctx.fillText(line, x, lineY);
            line = words[n] + ' ';
            lineY += lineHeight;
          } else {
            line = testLine;
          }
        }
        ctx.fillStyle = COLORS.text;
        ctx.fillText(line, x, lineY);
      }

      function drawDialogueBox() {
        const x = 40;
        const y = H - 180;
        const w = W - 80;
        const h = 150;

        ctx.fillStyle = COLORS.panel;
        ctx.beginPath();
        ctx.roundRect(x, y, w, h, 16);
        ctx.fill();

        ctx.strokeStyle = COLORS.panelBorder;
        ctx.lineWidth = 1;
        ctx.stroke();

        ctx.fillStyle = COLORS.red;
        ctx.beginPath();
        ctx.roundRect(x + 20, y + 20, 4, 30, 2);
        ctx.fill();

        ctx.font = '700 20px "Segoe UI", Arial, sans-serif';
        ctx.fillStyle = COLORS.text;
        ctx.textAlign = 'left';
        ctx.textBaseline = 'middle';
        ctx.fillText('Josh', x + 36, y + 35);

        if (gameState === 'dialogue' || gameState === 'end') {
          const displayText = currentDialogue.substring(0, charIndex);
          wrapText(displayText, x + 36, y + 65, w - 80, 28);

          if (isTyping) {
            ctx.fillStyle = COLORS.red;
            ctx.beginPath();
            ctx.arc(x + w - 40, y + h - 25, 4, 0, Math.PI * 2);
            ctx.fill();
          }
        }
      }

      function drawOptions() {
        if (!showOptions) return;

        for (let i = 0; i < currentOptions.length; i++) {
          const ox = (W - OPTION_W) / 2;
          const oy = OPTION_START_Y + i * (OPTION_H + OPTION_GAP);
          const isHovered = hoverOption === i;

          ctx.save();
          ctx.shadowColor = isHovered ? 'rgba(227, 38, 54, 0.5)' : 'rgba(0, 0, 0, 0.3)';
          ctx.shadowBlur = isHovered ? 20 : 10;
          ctx.shadowOffsetY = isHovered ? 6 : 3;

          ctx.fillStyle = isHovered ? COLORS.optionHover : COLORS.optionBg;
          ctx.beginPath();
          ctx.roundRect(ox, oy, OPTION_W, OPTION_H, 10);
          ctx.fill();

          ctx.strokeStyle = isHovered ? COLORS.optionHoverBorder : COLORS.optionBorder;
          ctx.lineWidth = 2;
          ctx.stroke();
          ctx.restore();

          ctx.font = '600 17px "Segoe UI", Arial, sans-serif';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillStyle = isHovered ? '#ffffff' : COLORS.text;
          ctx.fillText(currentOptions[i].text, ox + OPTION_W / 2, oy + OPTION_H / 2);
        }
      }

      function drawEndingScreen() {
        ctx.fillStyle = 'rgba(10, 10, 20, 0.95)';
        ctx.fillRect(0, 0, W, H);

        const boxW = 620;
        const boxH = 320;
        const boxX = (W - boxW) / 2;
        const boxY = (H - boxH) / 2;

        ctx.fillStyle = COLORS.panel;
        ctx.beginPath();
        ctx.roundRect(boxX, boxY, boxW, boxH, 20);
        ctx.fill();

        ctx.strokeStyle = endingColor;
        ctx.lineWidth = 3;
        ctx.stroke();

        ctx.font = '800 32px "Segoe UI", Arial, sans-serif';
        ctx.fillStyle = endingColor;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(endingTitle, W / 2, boxY + 60);

        ctx.font = '400 18px "Segoe UI", Arial, sans-serif';
        ctx.fillStyle = COLORS.text;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'top';
        const maxWidth = boxW - 80;
        const words = endingDesc.split(' ');
        let line = '';
        let lineY = boxY + 110;
        const lineHeight = 26;
        for (let n = 0; n < words.length; n++) {
          const testLine = line + words[n] + ' ';
          const metrics = ctx.measureText(testLine);
          if (metrics.width > maxWidth && n > 0) {
            ctx.fillText(line, W / 2, lineY);
            line = words[n] + ' ';
            lineY += lineHeight;
          } else {
            line = testLine;
          }
        }
        ctx.fillText(line, W / 2, lineY);

        ctx.font = '700 16px "Segoe UI", Arial, sans-serif';
        ctx.fillStyle = COLORS.textDim;
        ctx.fillText('FINAL AFFECTION: ' + Math.round(affection), W / 2, boxY + boxH - 70);

        if (!isTyping) {
          ctx.font = '600 16px "Segoe UI", Arial, sans-serif';
          ctx.fillStyle = COLORS.textDim;
          ctx.fillText('Click to restart', W / 2, boxY + boxH - 35);
        }
      }

      function update() {
        if (gameState === 'dialogue' || gameState === 'end') {
          if (isTyping) {
            typingTimer++;
            if (typingTimer >= TYPING_SPEED) {
              typingTimer = 0;
              charIndex++;
              if (charIndex >= currentDialogue.length) {
                charIndex = currentDialogue.length;
                isTyping = false;
                if (gameState === 'dialogue') {
                  showOptions = true;
                }
                if (scrollAudio) {
                  scrollAudio.pause();
                  scrollAudio.currentTime = 0;
                }
              }
            }
          }
        }
      }

      function draw() {
        if (gameState === 'end') {
          drawBackground();
          drawJosh();
          drawEndingScreen();
        } else {
          drawBackground();
          drawJosh();
          drawAffectionBar();
          drawOptions();
          drawDialogueBox();
        }
      }

      function gameLoop() {
        update();
        draw();
        requestAnimationFrame(gameLoop);
      }

      function resolveEnding(key) {
        const base = endings[key];
        let title = base.title;
        let desc = base.desc;
        let color = base.color;

        if (key === 'end_perfect' && affection < 70) {
          title = endings.end_okay.title;
          desc = endings.end_okay.desc;
          color = endings.end_okay.color;
        } else if (key === 'end_okay' && affection >= 70) {
          title = endings.end_perfect.title;
          desc = endings.end_perfect.desc;
          color = endings.end_perfect.color;
        } else if (key === 'end_okay' && affection < 40) {
          title = endings.end_bad.title;
          desc = endings.end_bad.desc;
          color = endings.end_bad.color;
        }

        if (pathTaken === 'deep' && affection >= 70) {
          title = 'SOULMATES';
          desc = "Josh laughs. 'My grandma would have loved you.' You talk for three more hours. He shows you the tattoo. You show him your worst article. Neither of you wants to leave. The waiter has to ask you twice to pay.";
          color = COLORS.gold;
        } else if (pathTaken === 'fan' && affection >= 70) {
          title = 'SUPERFAN & WRITER';
          desc = "Josh grins. 'I'm going to frame this receipt.' You spend the next hour talking about bad articles, worse tattoos, and the fact that nobody at SusFeed knows what they're doing. He texts you before you're even home.";
          color = COLORS.green;
        } else if (pathTaken === 'satire' && affection >= 70) {
          title = 'PERFECT MATCH';
          desc = "Josh stares at you for a long moment. 'Wait... you're right. It's just a job. But it's a cool job. And you're cool. Want to get coffee sometime?' You say yes. He smiles. A real smile this time.";
          color = COLORS.green;
        }

        endingTitle = title;
        endingDesc = desc;
        endingColor = color;
        currentDialogue = desc;
        gameState = 'end';
        charIndex = 0;
        isTyping = true;
        showOptions = false;
        hoverOption = -1;
        if (bgmAudio) bgmAudio.pause();
      }

      function selectOption(index) {
        const option = currentOptions[index];
        if (!option) return;

        if (clickAudio) {
          clickAudio.currentTime = 0;
          clickAudio.play().catch(() => {});
        }

        affection += option.aff;
        affection = Math.max(0, Math.min(100, affection));

        if (option.path && option.path !== 'career') {
          pathTaken = option.path;
        }

        const nextKey = option.next;

        if (nextKey.startsWith('end_')) {
          resolveEnding(nextKey);
          return;
        }

        const node = dialogues[nextKey];
        if (!node) return;

        currentDialogue = node.text;
        currentOptions = node.options;
        charIndex = 0;
        isTyping = true;
        showOptions = false;
        hoverOption = -1;
        typingTimer = 0;

        if (scrollAudio) {
          scrollAudio.currentTime = 0;
          scrollAudio.play().catch(() => {});
        }
      }

      function handleClick(mx, my) {
        if (gameState === 'dialogue') {
          if (isTyping) {
            charIndex = currentDialogue.length;
            isTyping = false;
            showOptions = true;
            if (scrollAudio) {
              scrollAudio.pause();
              scrollAudio.currentTime = 0;
            }
            return;
          }

          if (showOptions) {
            for (let i = 0; i < currentOptions.length; i++) {
              const ox = (W - OPTION_W) / 2;
              const oy = OPTION_START_Y + i * (OPTION_H + OPTION_GAP);
              if (mx > ox && mx < ox + OPTION_W && my > oy && my < oy + OPTION_H) {
                selectOption(i);
                return;
              }
            }
          }
        } else if (gameState === 'end') {
          if (!isTyping) {
            resetGame();
            if (bgmAudio) {
              bgmAudio.currentTime = 0;
              bgmAudio.play().catch(() => {});
            }
          } else {
            charIndex = currentDialogue.length;
            isTyping = false;
          }
        }
      }

      function handleHover(mx, my) {
        if (gameState === 'dialogue' && showOptions) {
          hoverOption = -1;
          for (let i = 0; i < currentOptions.length; i++) {
            const ox = (W - OPTION_W) / 2;
            const oy = OPTION_START_Y + i * (OPTION_H + OPTION_GAP);
            if (mx > ox && mx < ox + OPTION_W && my > oy && my < oy + OPTION_H) {
              hoverOption = i;
              break;
            }
          }
        }
      }

      function getCanvasCoords(e) {
        const rect = canvas.getBoundingClientRect();
        const scaleX = W / rect.width;
        const scaleY = H / rect.height;
        let clientX, clientY;
        if (e.touches) {
          clientX = e.touches[0].clientX;
          clientY = e.touches[0].clientY;
        } else {
          clientX = e.clientX;
          clientY = e.clientY;
        }
        return {
          x: (clientX - rect.left) * scaleX,
          y: (clientY - rect.top) * scaleY
        };
      }

      canvas.addEventListener('mousemove', (e) => {
        const coords = getCanvasCoords(e);
        handleHover(coords.x, coords.y);
      });

      canvas.addEventListener('click', (e) => {
        const coords = getCanvasCoords(e);
        handleClick(coords.x, coords.y);
      });

      canvas.addEventListener('touchstart', (e) => {
        e.preventDefault();
        const coords = getCanvasCoords(e);
        handleHover(coords.x, coords.y);
        handleClick(coords.x, coords.y);
      }, { passive: false });

      startBtn.addEventListener('click', startGame);
      startBtn.addEventListener('touchend', (e) => {
        e.preventDefault();
        startGame();
      }, { passive: false });

      gameLoop();
    })();
  </script>

</body>
