<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pancake Catch · Dr. Bombay Ice Cream</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #1e0f2e;
      font-family: 'Segoe UI', 'Poppins', system-ui, sans-serif;
      color: #fef7e6;
      line-height: 1.5;
      overflow-x: hidden;
      position: relative;
      min-height: 100vh;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at 30% 20%, #3e1a58 0%, #1a0b24 70%, #0b0614 100%);
      z-index: -2;
    }

    body::after {
      content: "";
      position: fixed;
      inset: 0;
      background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" opacity="0.06"><circle cx="30" cy="30" r="5" fill="%23f5b342"/><circle cx="170" cy="70" r="7" fill="%23b77fdb"/><circle cx="80" cy="140" r="8" fill="%23f5b342"/><circle cx="140" cy="180" r="4" fill="%23d9a5f0"/><circle cx="40" cy="190" r="6" fill="%23f5b342"/><circle cx="190" cy="20" r="8" fill="%23b77fdb"/><circle cx="110" cy="40" r="5" fill="%23f5b342"/><circle cx="20" cy="100" r="7" fill="%23d9a5f0"/></svg>');
      background-size: 280px 280px;
      z-index: -1;
      pointer-events: none;
    }

    .page-wrapper {
      max-width: 1100px;
      margin: 0 auto;
      padding: 1.5rem 1.5rem 3rem;
      position: relative;
      z-index: 2;
    }

    .site-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.5rem 0 1.25rem;
      border-bottom: 2px solid rgba(245, 179, 66, 0.3);
      margin-bottom: 2rem;
      flex-wrap: wrap;
      gap: 1rem;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 1.8rem;
      color: #fef7e6;
      text-shadow: 3px 3px 0 #4a1d6b;
      font-family: 'Georgia', 'Times New Roman', serif;
      font-style: italic;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .logo .dr {
      color: #f5b342;
      font-style: normal;
      font-weight: 900;
      font-size: 2rem;
    }

    .logo .bombay {
      color: #fef7e6;
      font-weight: 700;
    }

    .logo .pill {
      background: #f5b342;
      padding: 0.15rem 0.75rem 0.2rem;
      border-radius: 40px 40px 40px 8px;
      font-size: 1.2rem;
      color: #1e0f2e;
      text-shadow: none;
      font-weight: 900;
      transform: rotate(-2deg);
      display: inline-block;
      font-style: normal;
      font-family: 'Segoe UI', sans-serif;
      margin-left: 0.3rem;
      letter-spacing: 1px;
    }

    .nav-links {
      display: flex;
      gap: 0.8rem;
      flex-wrap: wrap;
    }

    .nav-btn {
      color: #fef7e6;
      background: #3a1852;
      padding: 0.6rem 1.5rem;
      border-radius: 60px;
      text-decoration: none;
      font-weight: 700;
      font-size: 0.95rem;
      letter-spacing: 1px;
      border: 2px solid #f5b342;
      box-shadow: 0 5px 0 #1f0a2b, 0 6px 12px rgba(0, 0, 0, 0.4);
      transition: 0.12s ease;
      text-transform: uppercase;
    }

    .nav-btn:hover {
      background: #f5b342;
      color: #1e0f2e;
      border-color: #fef7e6;
      box-shadow: 0 3px 0 #1f0a2b, 0 5px 10px rgba(0, 0, 0, 0.5);
      transform: translateY(2px);
    }

    .game-title {
      text-align: center;
      font-size: 2.8rem;
      font-weight: 900;
      letter-spacing: -1px;
      margin-bottom: 0.5rem;
      color: #fef7e6;
      text-shadow: 4px 4px 0 #4a1d6b, 7px 7px 0 #f5b342;
    }

    .game-title .highlight {
      background: linear-gradient(145deg, #d9a5f0, #b77fdb);
      color: #1e0f2e;
      padding: 0.1rem 1rem 0.2rem;
      border-radius: 50px 50px 50px 8px;
      display: inline-block;
      text-shadow: none;
      box-shadow: 0 6px 0 #2b0f3b;
    }

    .game-subtitle {
      text-align: center;
      font-size: 1.1rem;
      color: #b77fdb;
      font-weight: 600;
      letter-spacing: 1px;
      margin-bottom: 1.5rem;
      text-transform: uppercase;
    }

    .game-container {
      background: rgba(43, 15, 59, 0.7);
      backdrop-filter: blur(10px);
      border: 3px solid #b77fdb;
      border-radius: 40px 40px 40px 16px;
      padding: 1.5rem;
      box-shadow: 0 16px 0 #1f0a2b, 0 22px 28px rgba(0, 0, 0, 0.8);
      margin-bottom: 2rem;
    }

    .hud {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
      margin-bottom: 1rem;
      padding: 0.5rem 0.5rem 0;
    }

    .hud-item {
      background: #2b0f3b;
      padding: 0.5rem 1.5rem;
      border-radius: 40px;
      border: 2px solid #f5b342;
      box-shadow: 0 4px 0 #0b0614;
      font-weight: 800;
      font-size: 1.1rem;
      letter-spacing: 1px;
      display: flex;
      align-items: center;
      gap: 0.6rem;
      color: #f5b342;
    }

    .hud-item span {
      color: #fef7e6;
      font-size: 1.3rem;
    }

    .canvas-wrapper {
      position: relative;
      width: 100%;
      border-radius: 28px;
      overflow: hidden;
      border: 3px solid #f5b342;
      box-shadow: inset 0 0 40px rgba(0, 0, 0, 0.8);
      background: #0b0614;
    }

    canvas {
      display: block;
      width: 100%;
      height: auto;
      background: radial-gradient(circle at 50% 20%, #2b0f3b 0%, #0b0614 100%);
      cursor: none;
      touch-action: none;
    }

    .game-overlay {
      position: absolute;
      inset: 0;
      background: rgba(11, 6, 20, 0.92);
      backdrop-filter: blur(6px);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 1.5rem;
      border-radius: 25px;
      padding: 2rem;
      text-align: center;
    }

    .game-overlay.hidden {
      display: none;
    }

    .game-overlay h2 {
      font-size: 2.8rem;
      font-weight: 900;
      color: #f5b342;
      text-shadow: 3px 3px 0 #4a1d6b;
      letter-spacing: -1px;
    }

    .game-overlay p {
      font-size: 1.2rem;
      color: #e2d0f0;
      max-width: 500px;
      line-height: 1.6;
    }

    .overlay-btn {
      background: #f5b342;
      color: #1e0f2e;
      padding: 1rem 2.8rem;
      border-radius: 60px;
      font-weight: 800;
      font-size: 1.3rem;
      letter-spacing: 1.2px;
      border: 3px solid #fef7e6;
      box-shadow: 0 7px 0 #3a1852, 0 10px 18px rgba(0, 0, 0, 0.6);
      transition: 0.1s linear;
      cursor: pointer;
      text-transform: uppercase;
      font-family: inherit;
    }

    .overlay-btn:hover {
      background: #d9a5f0;
      box-shadow: 0 4px 0 #3a1852, 0 8px 14px rgba(0, 0, 0, 0.7);
      transform: translateY(3px);
      border-color: #f5b342;
    }

    .back-home {
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      background: #f5b342;
      color: #1e0f2e;
      padding: 0.8rem 2rem;
      border-radius: 60px;
      font-weight: 800;
      font-size: 1.1rem;
      text-decoration: none;
      letter-spacing: 1.2px;
      border: 3px solid #fef7e6;
      box-shadow: 0 7px 0 #3a1852, 0 10px 18px rgba(0, 0, 0, 0.6);
      transition: 0.1s linear;
      cursor: pointer;
      text-transform: uppercase;
      margin: 0 auto;
    }

    .back-home:hover {
      background: #d9a5f0;
      box-shadow: 0 4px 0 #3a1852, 0 8px 14px rgba(0, 0, 0, 0.7);
      transform: translateY(3px);
      border-color: #f5b342;
    }

    .footer-note {
      text-align: center;
      margin-top: 2.5rem;
      color: #b77fdb;
      font-weight: 600;
      font-size: 0.9rem;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      border-top: 2px dashed #3a1852;
      padding-top: 2.2rem;
    }

    @media (max-width: 700px) {
      .game-title {
        font-size: 2rem;
      }
      .hud-item {
        font-size: 0.9rem;
        padding: 0.4rem 1rem;
      }
      .game-overlay h2 {
        font-size: 2rem;
      }
      .site-header {
        justify-content: center;
      }
      .page-wrapper {
        padding: 1rem 1rem 2rem;
      }
      .game-container {
        padding: 0.8rem;
      }
    }

    @media (max-width: 500px) {
      .logo {
        font-size: 1.4rem;
      }
      .logo .dr {
        font-size: 1.6rem;
      }
      .logo .pill {
        font-size: 0.9rem;
      }
      .nav-btn {
        font-size: 0.8rem;
        padding: 0.5rem 1rem;
      }
    }
  </style>
</head>
<body>
  <div class="page-wrapper">
    <header class="site-header">
      <div class="logo">
        <span class="dr">Dr.</span>
        <span class="bombay">Bombay</span>
        <span class="pill">ICE CREAM</span>
      </div>
      <div class="nav-links">
        <a href="index.html" class="nav-btn">HOME</a>
        <a href="about.html" class="nav-btn">ABOUT</a>
      </div>
    </header>

    <h1 class="game-title">
      PANCAKE <span class="highlight">CATCH</span>
    </h1>
    <p class="game-subtitle">Catch the pancakes · Dodge the broccoli</p>

    <div class="game-container">
      <div class="hud">
        <div class="hud-item">
          SCORE <span id="scoreDisplay">0</span>
        </div>
        <div class="hud-item">
          LIVES <span id="livesDisplay">❤️❤️❤️</span>
        </div>
        <div class="hud-item">
          LEVEL <span id="levelDisplay">1</span>
        </div>
      </div>
      <div class="canvas-wrapper">
        <canvas id="gameCanvas" width="900" height="520"></canvas>
        <div class="game-overlay" id="overlay">
          <h2 id="overlayTitle">READY?</h2>
          <p id="overlayText">Catch falling pancakes with the plate. Avoid the broccoli. Use mouse, touch, or arrow keys.</p>
          <button class="overlay-btn" id="startBtn">START GAME</button>
        </div>
      </div>
    </div>

    <a href="index.html" class="back-home">← BACK TO FLAVOR</a>

    <div class="footer-note">
      BLACK RASPBERRY PANCAKE · 2026
    </div>
  </div>

  <script>
    (function() {
      const canvas = document.getElementById('gameCanvas');
      const ctx = canvas.getContext('2d');
      const scoreDisplay = document.getElementById('scoreDisplay');
      const livesDisplay = document.getElementById('livesDisplay');
      const levelDisplay = document.getElementById('levelDisplay');
      const overlay = document.getElementById('overlay');
      const overlayTitle = document.getElementById('overlayTitle');
      const overlayText = document.getElementById('overlayText');
      const startBtn = document.getElementById('startBtn');

      const W = canvas.width;
      const H = canvas.height;

      let gameState = 'idle';
      let score = 0;
      let lives = 3;
      let level = 1;
      let frameCount = 0;

      const plate = {
        x: W / 2,
        y: H - 55,
        width: 120,
        height: 30,
        targetX: W / 2,
        speed: 0.18
      };

      let items = [];
      let particles = [];

      const keys = { left: false, right: false };
      let pointerActive = false;

      const pancakeColors = ['#c9934f', '#e8bd7a', '#b8834a', '#f0cc8e', '#d4a561'];
      const jamColors = ['#9a5fc4', '#723d9e', '#b77fdb'];

      function resetGame() {
        score = 0;
        lives = 3;
        level = 1;
        frameCount = 0;
        items = [];
        particles = [];
        plate.x = W / 2;
        plate.targetX = W / 2;
        updateHUD();
      }

      function updateHUD() {
        scoreDisplay.textContent = score;
        let hearts = '';
        for (let i = 0; i < 3; i++) {
          hearts += i < lives ? '❤️' : '🖤';
        }
        livesDisplay.textContent = hearts;
        levelDisplay.textContent = level;
      }

      function spawnItem() {
        const spawnRate = Math.max(22, 55 - level * 4);
        if (frameCount % spawnRate !== 0) return;

        const isBroccoli = Math.random() < 0.22 + level * 0.015;
        const x = 40 + Math.random() * (W - 80);
        const baseSpeed = 1.5 + level * 0.35;
        const speed = baseSpeed + Math.random() * 0.8;

        if (isBroccoli) {
          items.push({
            type: 'broccoli',
            x: x,
            y: -30,
            r: 22,
            speed: speed,
            rot: Math.random() * Math.PI * 2,
            rotSpeed: (Math.random() - 0.5) * 0.06
          });
        } else {
          const isJam = Math.random() < 0.3;
          items.push({
            type: isJam ? 'jam' : 'pancake',
            x: x,
            y: -30,
            r: isJam ? 18 : 22,
            speed: speed,
            rot: Math.random() * Math.PI * 2,
            rotSpeed: (Math.random() - 0.5) * 0.05,
            color: isJam ? jamColors[Math.floor(Math.random() * jamColors.length)] : pancakeColors[Math.floor(Math.random() * pancakeColors.length)]
          });
        }
      }

      function spawnParticles(x, y, color, count) {
        for (let i = 0; i < count; i++) {
          particles.push({
            x: x,
            y: y,
            vx: (Math.random() - 0.5) * 6,
            vy: (Math.random() - 0.5) * 6 - 2,
            life: 1,
            color: color,
            size: 3 + Math.random() * 5
          });
        }
      }

      function update() {
        if (gameState !== 'playing') return;

        frameCount++;

        if (keys.left) plate.targetX -= 9;
        if (keys.right) plate.targetX += 9;
        plate.targetX = Math.max(plate.width / 2 + 10, Math.min(W - plate.width / 2 - 10, plate.targetX));

        plate.x += (plate.targetX - plate.x) * plate.speed;

        spawnItem();

        for (let i = items.length - 1; i >= 0; i--) {
          const item = items[i];
          item.y += item.speed;
          item.rot += item.rotSpeed;

          const plateTop = plate.y - plate.height / 2 - 8;
          const plateLeft = plate.x - plate.width / 2;
          const plateRight = plate.x + plate.width / 2;

          if (item.y + item.r > plateTop && item.y - item.r < plateTop + 30) {
            if (item.x > plateLeft - 10 && item.x < plateRight + 10) {
              if (item.type === 'broccoli') {
                lives--;
                spawnParticles(item.x, item.y, '#4a8c3f', 14);
                updateHUD();
                if (lives <= 0) {
                  gameOver();
                }
              } else {
                const points = item.type === 'jam' ? 15 : 10;
                score += points;
                spawnParticles(item.x, item.y, item.color, 10);
                updateHUD();
                if (score >= level * 120) {
                  level++;
                  updateHUD();
                }
              }
              items.splice(i, 1);
              continue;
            }
          }

          if (item.y - item.r > H + 40) {
            items.splice(i, 1);
          }
        }

        for (let i = particles.length - 1; i >= 0; i--) {
          const p = particles[i];
          p.x += p.vx;
          p.y += p.vy;
          p.vy += 0.15;
          p.life -= 0.025;
          if (p.life <= 0) particles.splice(i, 1);
        }
      }

      function gameOver() {
        gameState = 'gameover';
        overlayTitle.textContent = 'GAME OVER';
        overlayText.innerHTML = 'You scored <strong style="color:#f5b342;">' + score + '</strong> points!<br>Level ' + level + ' reached.';
        startBtn.textContent = 'PLAY AGAIN';
        overlay.classList.remove('hidden');
        pointerActive = false;
      }

      function startGame() {
        resetGame();
        gameState = 'playing';
        overlay.classList.add('hidden');
        pointerActive = true;
      }

      function drawPlate() {
        ctx.save();
        ctx.translate(plate.x, plate.y);

        ctx.fillStyle = '#2b0f3b';
        ctx.beginPath();
        ctx.ellipse(0, 8, plate.width / 2 + 6, 12, 0, 0, Math.PI * 2);
        ctx.fill();

        const plateGrad = ctx.createLinearGradient(0, -12, 0, 12);
        plateGrad.addColorStop(0, '#fef7e6');
        plateGrad.addColorStop(0.5, '#e8d5b0');
        plateGrad.addColorStop(1, '#c9b088');
        ctx.fillStyle = plateGrad;
        ctx.beginPath();
        ctx.ellipse(0, 0, plate.width / 2, plate.height / 2, 0, 0, Math.PI * 2);
        ctx.fill();

        ctx.strokeStyle = '#f5b342';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.ellipse(0, 0, plate.width / 2 - 4, plate.height / 2 - 4, 0, 0, Math.PI * 2);
        ctx.stroke();

        ctx.fillStyle = '#d9a5f0';
        ctx.beginPath();
        ctx.ellipse(0, -2, 18, 8, 0, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
      }

      function drawPancake(item) {
        ctx.save();
        ctx.translate(item.x, item.y);
        ctx.rotate(item.rot);

        ctx.fillStyle = 'rgba(0,0,0,0.25)';
        ctx.beginPath();
        ctx.ellipse(2, 4, item.r, item.r * 0.75, 0, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = item.color;
        ctx.beginPath();
        ctx.ellipse(0, 0, item.r, item.r * 0.75, 0, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = 'rgba(255,255,255,0.18)';
        ctx.beginPath();
        ctx.ellipse(-5, -5, item.r * 0.4, item.r * 0.25, -0.3, 0, Math.PI * 2);
        ctx.fill();

        ctx.strokeStyle = '#8a5a30';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.ellipse(0, 0, item.r - 1, item.r * 0.75 - 1, 0, 0, Math.PI * 2);
        ctx.stroke();

        ctx.fillStyle = 'rgba(201, 147, 79, 0.7)';
        ctx.beginPath();
        ctx.ellipse(6, 3, 6, 4, 0.5, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
      }

      function drawJam(item) {
        ctx.save();
        ctx.translate(item.x, item.y);
        ctx.rotate(item.rot);

        ctx.fillStyle = 'rgba(0,0,0,0.25)';
        ctx.beginPath();
        ctx.ellipse(2, 4, item.r, item.r, 0, 0, Math.PI * 2);
        ctx.fill();

        const grad = ctx.createRadialGradient(-5, -5, 2, 0, 0, item.r);
        grad.addColorStop(0, '#d9a5f0');
        grad.addColorStop(0.5, item.color);
        grad.addColorStop(1, '#4a1d6b');
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(0, 0, item.r, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = 'rgba(255,255,255,0.3)';
        ctx.beginPath();
        ctx.arc(-6, -6, 5, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
      }

      function drawBroccoli(item) {
        ctx.save();
        ctx.translate(item.x, item.y);
        ctx.rotate(item.rot);

        ctx.fillStyle = 'rgba(0,0,0,0.3)';
        ctx.beginPath();
        ctx.ellipse(3, 5, item.r * 0.9, item.r * 0.6, 0, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#3d7a33';
        ctx.beginPath();
        ctx.ellipse(0, 2, item.r * 0.5, item.r * 0.7, 0, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#4a8c3f';
        const clusters = [
          [-8, -8], [8, -8], [0, -14], [-12, 2], [12, 2]
        ];
        clusters.forEach(function(c) {
          ctx.beginPath();
          ctx.arc(c[0], c[1], 8, 0, Math.PI * 2);
          ctx.fill();
        });

        ctx.fillStyle = '#5aa84d';
        ctx.beginPath();
        ctx.arc(-4, -10, 5, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(6, -6, 5, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#2d5e25';
        ctx.beginPath();
        ctx.ellipse(0, 10, 7, 10, 0, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
      }

      function drawParticles() {
        particles.forEach(function(p) {
          ctx.globalAlpha = p.life;
          ctx.fillStyle = p.color;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
          ctx.fill();
        });
        ctx.globalAlpha = 1;
      }

      function drawBackground() {
        ctx.fillStyle = '#0b0614';
        ctx.fillRect(0, 0, W, H);

        const grad = ctx.createRadialGradient(W / 2, H * 0.2, 50, W / 2, H * 0.5, H);
        grad.addColorStop(0, 'rgba(62, 26, 88, 0.5)');
        grad.addColorStop(0.7, 'rgba(26, 11, 36, 0.8)');
        grad.addColorStop(1, '#0b0614');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, W, H);

        ctx.strokeStyle = 'rgba(183, 127, 219, 0.08)';
        ctx.lineWidth = 1;
        for (let i = 0; i < W; i += 50) {
          ctx.beginPath();
          ctx.moveTo(i, 0);
          ctx.lineTo(i, H);
          ctx.stroke();
        }
        for (let i = 0; i < H; i += 50) {
          ctx.beginPath();
          ctx.moveTo(0, i);
          ctx.lineTo(W, i);
          ctx.stroke();
        }

        ctx.fillStyle = 'rgba(245, 179, 66, 0.04)';
        for (let i = 0; i < 8; i++) {
          const x = (i * 137) % W;
          const y = (i * 89) % H;
          ctx.beginPath();
          ctx.arc(x, y, 30 + i * 5, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      function draw() {
        drawBackground();

        items.forEach(function(item) {
          if (item.type === 'broccoli') drawBroccoli(item);
          else if (item.type === 'jam') drawJam(item);
          else drawPancake(item);
        });

        drawPlate();
        drawParticles();

        if (gameState === 'playing') {
          ctx.fillStyle = 'rgba(245, 179, 66, 0.5)';
          ctx.font = 'bold 13px "Segoe UI", sans-serif';
          ctx.textAlign = 'center';
          ctx.fillText('MOVE: MOUSE / TOUCH / ARROW KEYS', W / 2, H - 8);
        }
      }

      function loop() {
        if (gameState === 'playing') update();
        draw();
        requestAnimationFrame(loop);
      }

      function handlePointerMove(e) {
        if (gameState !== 'playing') return;
        const rect = canvas.getBoundingClientRect();
        const scaleX = W / rect.width;
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const x = (clientX - rect.left) * scaleX;
        plate.targetX = Math.max(plate.width / 2 + 10, Math.min(W - plate.width / 2 - 10, x));
      }

      canvas.addEventListener('mousemove', handlePointerMove);
      canvas.addEventListener('touchmove', function(e) {
        e.preventDefault();
        handlePointerMove(e);
      }, { passive: false });

      canvas.addEventListener('touchstart', function(e) {
        e.preventDefault();
        handlePointerMove(e);
      }, { passive: false });

      window.addEventListener('keydown', function(e) {
        if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') {
          keys.left = true;
          e.preventDefault();
        }
        if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') {
          keys.right = true;
          e.preventDefault();
        }
      });

      window.addEventListener('keyup', function(e) {
        if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') {
          keys.left = false;
        }
        if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') {
          keys.right = false;
        }
      });

      startBtn.addEventListener('click', startGame);

      resetGame();
      loop();
    })();
  </script>
</body>
</html>
