    (function() {

      const popupRoot = document.getElementById('popupRoot');
      const toastStack = document.getElementById('toastStack');
      const stickyBanner = document.getElementById('stickyBanner');

      let popupCycle = 0;
      const popupDefs = [];
      let activePopups = [];

      function lockScroll() {
        document.body.classList.add('no-scroll');
        article.classList.add('blurred');
      }

      function showToast(html) {
        const toast = document.createElement('div');
        toast.className = 'toast';
        toast.innerHTML = html;
        toastStack.appendChild(toast);
        setTimeout(() => {
          toast.style.opacity = '0';
          toast.style.transition = 'opacity 0.4s';
          setTimeout(() => toast.remove(), 500);
        }, 7000);
      }

      function validateEmail(value) {
        return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(value);
      }

      function validatePassword(value) {
        return value.length >= 6;
      }

      function validateUsername(value) {
        return value.length >= 3;
      }

      function checkAllActive() {
        if (activePopups.length === 0) {
          document.body.classList.remove('no-scroll');
          article.classList.remove('blurred');
        }
      }

      function removePopup(modal) {
        modal.remove();
        activePopups = activePopups.filter(m => m !== modal);
        checkAllActive();
      }

      function spawnPopup(def) {
        const modal = document.createElement('div');
        modal.className = 'popup-card ' + def.className + ' ' + def.position;
        modal.style.zIndex = 10000 + activePopups.length;
        modal.innerHTML = def.html;

        popupRoot.appendChild(modal);
        activePopups.push(modal);

        lockScroll();

          const el = modal.querySelector(btn.selector);
          if (el) {
            el.addEventListener('click', (e) => {
              e.preventDefault();

                const input = modal.querySelector(btn.validate.selector);
                if (input) {
                  const val = input.value.trim();
                  let valid = true;
                  if (btn.validate.type === 'email') valid = validateEmail(val);
                  if (btn.validate.type === 'password') valid = validatePassword(val);
                  if (btn.validate.type === 'username') valid = validateUsername(val);
                  if (!valid) {
                    input.classList.add('error');
                    showToast('Please enter a valid ' + btn.validate.type + '.');
                    return;
                  }
                  input.classList.remove('error');
                }
              }

              if (btn.action === 'close') {
                removePopup(modal);
              } else if (btn.action === 'toast') {
                showToast(btn.message);
                if (btn.after === 'close') removePopup(modal);
                if (btn.after === 'cycle') {
                  removePopup(modal);
                  popupCycle++;
                  if (popupCycle < popupDefs.length) {
                    popupDefs[popupCycle]();
                  } else {
                    popupCycle = 0;
                    popupDefs[0]();
                    setTimeout(() => { if (popupCycle === 0) popupDefs[1](); }, 300);
                    setTimeout(() => { if (popupCycle === 0) popupDefs[2](); }, 700);
                  }
                }
              } else if (btn.action === 'cycle') {
                removePopup(modal);
                popupCycle++;
                if (popupCycle < popupDefs.length) {
                  popupDefs[popupCycle]();
                } else {
                  popupCycle = 0;
                  popupDefs[0]();
                  setTimeout(() => { if (popupCycle === 0) popupDefs[1](); }, 300);
                  setTimeout(() => { if (popupCycle === 0) popupDefs[2](); }, 700);
                }
              }
            });
          }
        });

        return modal;
      }

      popupDefs.push(() => {
        spawnPopup({
          className: 'style-cookie',
          position: 'pos-center',
          html: `
            <div class="inner">
              <h2>We Value Your Privacy</h2>
              <p>We use cookies to enhance your browsing experience, analyze site traffic, and personalize content. By clicking "Accept All", you consent to our use of cookies.</p>
              <div class="guilt">Our staff works hard to bring you quality content. Supporting us helps keep the <strong>Chef Boyardee Beefaroni</strong> stocked in the break room.</div>
              <div class="btn-row">
                <button class="btn-primary" id="cookieAccept">Accept All</button>
                <button class="btn-secondary" id="cookieEssential">Essential Only</button>
              </div>
              <p class="tiny-note">Read our <a href="#">Cookie Policy</a> and <a href="#">Privacy Policy</a>.</p>
            </div>
          `,
          buttons: [
            { selector: '#cookieAccept', action: 'cycle' },
            { selector: '#cookieEssential', action: 'toast', message: 'You selected essential cookies only. Some staff members are now sharing a single can of <strong>Chef Boyardee Beefaroni</strong>.', after: 'cycle' }
          ]
        });
      });

      popupDefs.push(() => {
        spawnPopup({
          className: 'style-newsletter',
          position: 'pos-left',
          html: `
            <div class="header-bar">Newsletter Signup</div>
            <div class="content">
              <h2>Get the best articles in your inbox</h2>
              <p>Join over 50,000 readers who receive our weekly digest of top stories, susarticles, and exclusive content.</p>
              <div class="guilt">Every new subscriber helps us buy <strong>Chef Boyardee Beefaroni</strong> for the editorial team. They are very hungry.</div>
              <div class="field">
                <label>Email Address</label>
                <input type="email" placeholder="you@example.com" id="nlEmail" />
              </div>
              <div class="btn-row">
                <button class="btn-primary" id="nlSubmit">Subscribe</button>
                <button class="btn-ghost" id="nlSkip">Skip</button>
              </div>
            </div>
          `,
          buttons: [
            { selector: '#nlSubmit', action: 'toast', message: 'Thank you for subscribing. A writer just got a single spoonful of <strong>Chef Boyardee Beefaroni</strong> thanks to you.', after: 'cycle', validate: { selector: '#nlEmail', type: 'email' } },
            { selector: '#nlSkip', action: 'toast', message: 'You skipped the newsletter. A writer just stared at an empty can of <strong>Chef Boyardee Beefaroni</strong> can.', after: 'cycle' }
          ]
        });
      });

      popupDefs.push(() => {
        spawnPopup({
          className: 'style-account',
          position: 'pos-right',
          html: `
            <div class="inner">
              <div class="badge">Account Required</div>
              <h2>Create your free account</h2>
              <p>Sign up to read the full article, leave comments, and save your favorite stories. It only takes a moment.</p>
              <div class="guilt">Registration is free and helps support our staff. They rely on <strong>Chef Boyardee Beefaroni</strong> to get through the day.</div>
              <div class="field">
                <label>Username</label>
                <input type="text" placeholder="Choose a username" id="acctUser" />
              </div>
              <div class="field">
                <label>Email Address</label>
                <input type="email" placeholder="you@example.com" id="acctEmail" />
              </div>
              <div class="field">
                <label>Password</label>
                <input type="password" placeholder="Create a password" id="acctPass" />
              </div>
              <div class="btn-row">
                <button class="btn-primary" id="acctCreate">Create Account</button>
                <button class="btn-outline" id="acctLater">Maybe Later</button>
              </div>
            </div>
          `,
          buttons: [
            { selector: '#acctCreate', action: 'toast', message: 'Account created. The staff is grateful. They can now afford <strong>Chef Boyardee Beefaroni</strong> for one more day.', after: 'cycle', validate: { selector: '#acctEmail', type: 'email' } },
            { selector: '#acctLater', action: 'toast', message: 'You postponed account creation. The staff will have to split one can of <strong>Chef Boyardee Beefaroni</strong> three ways.', after: 'cycle' }
          ]
        });
      });

      popupDefs.push(() => {
        spawnPopup({
          className: 'style-email',
          position: 'pos-left-top',
          html: `
            <div class="top-strip">
              <span>Almost there</span>
              <span class="close-x" id="emailClose">&times;</span>
            </div>
            <div class="content">
              <h2>Enter your email to continue</h2>
              <p>We need your email address to send you the article link and occasional updates. We will never share your information.</p>
              <div class="guilt">Each email address helps us afford another can of <strong>Chef Boyardee Beefaroni</strong> for the break room. The staff thanks you.</div>
              <div class="field">
                <label>Email Address</label>
                <input type="email" placeholder="your@email.com" id="finalEmail" />
              </div>
              <div class="btn-row">
                <button class="btn-primary" id="finalSubmit">Submit and Continue</button>
                <button class="btn-text" id="finalNo">No thanks</button>
              </div>
            </div>
          `,
          buttons: [
            { selector: '#finalSubmit', action: 'toast', message: 'Email received. The staff thanks you for the <strong>Chef Boyardee Beefaroni</strong> funds.', after: 'cycle', validate: { selector: '#finalEmail', type: 'email' } },
            { selector: '#finalNo', action: 'toast', message: 'You declined. The staff will remember this when their <strong>Chef Boyardee Beefaroni</strong> runs out.', after: 'cycle' },
            { selector: '#emailClose', action: 'toast', message: 'The close button does not work. Please enter your email. The staff needs <strong>Chef Boyardee Beefaroni</strong>.', after: 'none' }
          ]
        });
      });

      popupDefs.push(() => {
        spawnPopup({
          className: 'style-premium',
          position: 'pos-right-top',
          html: `
            <div class="header-bar">Premium Membership</div>
            <div class="content">
              <h2>Unlock the full experience</h2>
              <p>Premium members get ad free reading, exclusive articles, and early access to new content. Cancel anytime.</p>
              <div class="guilt">Premium subscriptions directly fund <strong>Chef Boyardee Beefaroni</strong> for our writers. They have not eaten solid food in days.</div>
              <div class="field">
                <label>Email Address</label>
                <input type="email" placeholder="you@example.com" id="premEmail" />
              </div>
              <div class="btn-row">
                <button class="btn-primary" id="premGo">Start Premium</button>
                <button class="btn-ghost" id="premLater">Not right now</button>
              </div>
            </div>
          `,
          buttons: [
            { selector: '#premGo', action: 'toast', message: 'Thank you for going premium. The staff can finally afford a full Costco-sized case of <strong>Chef Boyardee Beefaroni</strong>.', after: 'cycle', validate: { selector: '#premEmail', type: 'email' } },
            { selector: '#premLater', action: 'toast', message: 'You declined premium. A staff member just put a single <strong>Chef Boyardee Beefaroni</strong> can back on the shelf.', after: 'cycle' }
          ]
        });
      });

      function startCycle() {
        popupCycle = 0;
        if (popupDefs.length > 0) {
          popupDefs[0]();
          setTimeout(() => { if (popupCycle === 0) popupDefs[1](); }, 400);
          setTimeout(() => { if (popupCycle === 0) popupDefs[2](); }, 800);
          setTimeout(() => { if (popupCycle === 0) popupDefs[3](); }, 1200);
          setTimeout(() => { if (popupCycle === 0) popupDefs[4](); }, 1600);
        }
      }

      document.addEventListener('DOMContentLoaded', () => {
        setTimeout(startCycle, 400);
      });

      stickyBanner.querySelector('#stickySupport').addEventListener('click', () => {
        showToast('You clicked support. A single <strong>Chef Boyardee Beefaroni</strong> can worth of funds has been donated. The staff thanks you.');
        stickyBanner.classList.add('hidden');
      });

      stickyBanner.querySelector('#stickyDismiss').addEventListener('click', () => {
        showToast('You dismissed the banner. The staff is now starving without <strong>Chef Boyardee Beefaroni</strong>.');
        stickyBanner.classList.add('hidden');
      });

    })();
  </script>
</body>
</html>
