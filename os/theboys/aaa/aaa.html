<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SusFeed Shop · Neil's Emporium</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Courier New', Courier, monospace;
            background-color: black;
            color: white;
        }
        #info {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.7);
            padding: 12px 24px;
            border-left: 6px solid #b8860b;
            border-radius: 0 8px 8px 0;
            pointer-events: none;
            z-index: 10;
            text-shadow: 2px 2px 4px #000;
            letter-spacing: 1px;
            box-shadow: 0 0 20px rgba(184, 134, 11, 0.3);
        }
        #info h1 {
            margin: 0;
            font-size: 1.5rem;
            color: #ffd966;
            font-weight: 400;
        }
        #info p {
            margin: 4px 0 0;
            font-size: 0.8rem;
            color: #ccc;
        }
        #hud {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px 16px;
            border: 1px solid #b8860b;
            border-radius: 8px;
            z-index: 10;
            font-size: 0.9rem;
            color: #ffd966;
            letter-spacing: 1px;
        }
        #hud .suscoin {
            color: #66ff66;
        }
        #free-badge {
            position: absolute;
            top: 70px;
            right: 20px;
            background: rgba(0, 200, 0, 0.85);
            padding: 8px 16px;
            border: 2px solid #66ff66;
            border-radius: 8px;
            z-index: 10;
            font-size: 0.9rem;
            color: #fff;
            letter-spacing: 2px;
            text-shadow: 0 0 8px #000;
            opacity: 0;
            transition: opacity 0.3s;
            animation: pulse 1s infinite;
        }
        #free-badge.visible {
            opacity: 1;
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        #item-detail {
            position: absolute;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(10, 10, 10, 0.9);
            border: 2px solid #b8860b;
            border-radius: 16px;
            padding: 16px 32px;
            text-align: center;
            backdrop-filter: blur(8px);
            box-shadow: 0 0 40px rgba(184, 134, 11, 0.5);
            min-width: 320px;
            max-width: 600px;
            pointer-events: none;
            z-index: 20;
            transition: opacity 0.3s ease;
            opacity: 0;
            letter-spacing: 1px;
        }
        #item-detail.visible {
            opacity: 1;
        }
        #item-detail h2 {
            margin: 0 0 8px;
            color: #ffd966;
            font-size: 1.6rem;
            font-weight: 500;
            text-transform: uppercase;
            text-shadow: 0 0 10px #b8860b;
        }
        #item-detail .price {
            color: #66ff66;
            font-size: 1rem;
            margin: 4px 0 8px;
        }
        #item-detail .price.free {
            color: #00ff00;
            text-shadow: 0 0 10px #00ff00;
            animation: pulse 1s infinite;
        }
        #item-detail p {
            margin: 0;
            font-size: 0.95rem;
            color: #ddd;
            font-style: italic;
            max-width: 500px;
        }
        #action-bar {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 10px;
            z-index: 25;
            pointer-events: none;
            transition: opacity 0.3s ease;
            opacity: 0;
        }
        #action-bar.visible {
            opacity: 1;
            pointer-events: auto;
        }
        #action-bar button {
            background: rgba(20, 20, 20, 0.9);
            color: #ffd966;
            border: 2px solid #b8860b;
            padding: 10px 20px;
            font-family: inherit;
            font-size: 0.9rem;
            cursor: pointer;
            border-radius: 8px;
            letter-spacing: 1px;
            text-transform: uppercase;
            transition: all 0.2s;
            box-shadow: 0 0 10px rgba(184, 134, 11, 0.4);
        }
        #action-bar button:hover:not(:disabled) {
            background: #b8860b;
            color: #000;
            box-shadow: 0 0 20px rgba(184, 134, 11, 0.9);
        }
        #action-bar button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }
        .instruction {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background: rgba(0,0,0,0.6);
            padding: 8px 16px;
            border-radius: 30px;
            font-size: 0.8rem;
            color: #aaa;
            border: 1px solid #444;
            z-index: 10;
        }
        #controls-hint {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(0,0,0,0.6);
            padding: 8px 16px;
            border-radius: 30px;
            font-size: 0.75rem;
            color: #aaa;
            border: 1px solid #444;
            z-index: 10;
        }
        #audio-warning {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(180, 100, 20, 0.9);
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 0.9rem;
            color: #fff;
            border: 1px solid #b8860b;
            z-index: 30;
            pointer-events: none;
            transition: opacity 0.5s ease;
        }
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 8px;
            height: 8px;
            border: 2px solid rgba(255, 217, 102, 0.7);
            border-radius: 50%;
            pointer-events: none;
            z-index: 15;
            box-shadow: 0 0 6px rgba(255, 217, 102, 0.5);
            transition: opacity 0.2s;
        }
        #crosshair.hidden {
            opacity: 0;
        }
        #crosshair.hostile {
            border-color: #ff3333;
            box-shadow: 0 0 12px #ff3333;
        }
        #prompt {
            position: absolute;
            top: 55%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #ffd966;
            font-size: 1rem;
            text-shadow: 0 0 8px #000, 0 0 4px #b8860b;
            pointer-events: none;
            z-index: 15;
            opacity: 0;
            transition: opacity 0.2s;
            letter-spacing: 2px;
        }
        #prompt.visible {
            opacity: 1;
        }
        #toast {
            position: absolute;
            top: 30%;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.9);
            border: 2px solid #b8860b;
            color: #ffd966;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 1rem;
            letter-spacing: 1px;
            z-index: 100;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
            text-align: center;
            max-width: 400px;
        }
        #toast.visible {
            opacity: 1;
        }
        #dialogue {
            position: absolute;
            bottom: 120px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(10, 10, 10, 0.95);
            border: 2px solid #b8860b;
            border-radius: 12px;
            padding: 16px 24px;
            max-width: 500px;
            min-width: 300px;
            z-index: 50;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
            box-shadow: 0 0 40px rgba(184, 134, 11, 0.6);
        }
        #dialogue.visible {
            opacity: 1;
        }
        #dialogue .speaker {
            color: #ffd966;
            font-size: 0.9rem;
            font-weight: bold;
            letter-spacing: 2px;
            margin-bottom: 6px;
            text-transform: uppercase;
        }
        #dialogue .line {
            color: #fff;
            font-size: 1rem;
            line-height: 1.4;
        }
        #start-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            cursor: pointer;
            transition: opacity 0.5s ease;
        }
        #start-overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }
        #start-overlay h1 {
            color: #ffd966;
            font-size: 3rem;
            margin: 0 0 20px;
            text-shadow: 0 0 20px #b8860b;
            letter-spacing: 4px;
        }
        #start-overlay p {
            color: #ccc;
            font-size: 1.1rem;
            margin: 8px 0;
            letter-spacing: 2px;
        }
        #start-overlay .big {
            color: #b8860b;
            font-size: 1.3rem;
            margin-top: 30px;
            animation: pulse 1.5s infinite;
        }
        #health-bar {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 4px;
            z-index: 10;
        }
        .heart {
            width: 20px;
            height: 20px;
            background: #ff3333;
            clip-path: polygon(50% 100%, 0 35%, 15% 10%, 50% 30%, 85% 10%, 100% 35%);
            filter: drop-shadow(0 0 4px #ff0000);
        }
        .heart.empty {
            background: #444;
            filter: none;
        }
        #hand-label {
            position: absolute;
            right: 30px;
            bottom: 240px;
            background: rgba(0,0,0,0.8);
            border: 1px solid #b8860b;
            color: #ffd966;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.75rem;
            letter-spacing: 1px;
            z-index: 12;
            opacity: 0;
            transition: opacity 0.3s;
        }
        #hand-label.visible {
            opacity: 1;
        }
        #hand-label .key-hint {
            color: #66ff66;
        }
        #inventory-bar {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 8px;
            z-index: 12;
            pointer-events: none;
        }
        .inv-slot {
            width: 50px;
            height: 50px;
            background: rgba(0, 0, 0, 0.6);
            border: 2px solid #444;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.4rem;
            text-align: center;
            pointer-events: auto;
            cursor: pointer;
            transition: all 0.2s;
        }
        .inv-slot.filled {
            border-color: #b8860b;
            background: rgba(184, 134, 11, 0.15);
            box-shadow: 0 0 10px rgba(184, 134, 11, 0.4);
        }
        .inv-slot.active {
            border-color: #66ff66;
            background: rgba(102, 255, 102, 0.2);
            box-shadow: 0 0 15px rgba(102, 255, 102, 0.6);
            transform: scale(1.1);
        }
        #ammo-counter {
            position: absolute;
            bottom: 90px;
            right: 30px;
            background: rgba(0,0,0,0.75);
            border: 2px solid #b8860b;
            border-radius: 8px;
            color: #ffd966;
            padding: 8px 16px;
            font-size: 1.1rem;
            letter-spacing: 2px;
            z-index: 12;
            opacity: 0;
            transition: opacity 0.3s;
        }
        #ammo-counter.visible {
            opacity: 1;
        }
    </style>
</head>
<body>
    <div id="hud">
        <span>🪙 <span class="suscoin" id="coin-count">100</span> suscoins</span>
    </div>
    <div id="free-badge">💸 EVERYTHING FREE · NEIL HELD UP</div>
    <div id="health-bar"></div>
    <div id="item-detail">
        <h2 id="item-name">—</h2>
        <div class="price" id="item-price">—</div>
        <p id="item-desc">Select an item</p>
    </div>
    <div id="action-bar">
        <button id="btn-buy">Buy</button>
        <button id="btn-take">Take</button>
        <button id="btn-close">Close</button>
    </div>
    <div id="dialogue">
        <div class="speaker">Neil</div>
        <div class="line" id="dialogue-line">...</div>
    </div>
    <div id="audio-warning">🔊 Click anywhere to enable audio</div>
    <div id="crosshair"></div>
    <div id="prompt">[E] INSPECT</div>
    <div id="toast"></div>
    <div id="hand-label">Holding: <span id="hand-name"></span> · <span class="key-hint">[F] Use · [G] Drop</span></div>
    <div id="ammo-counter">AMMO: <span id="ammo-count">6</span> / 6</div>
    <div id="inventory-bar"></div>
    <div id="start-overlay">
        <h1>NEIL'S SHOP</h1>
        <p>Click to enter</p>
        <p class="big">WASD to walk · Mouse to look · Shift to run</p>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';

        let audioCtx = null;
        let masterGain = null;
        let bgmPlaying = false;
        let audioEnabled = false;

        function initAudio() {
            if (audioEnabled) return;
            audioEnabled = true;
            const warningEl = document.getElementById('audio-warning');
            if (warningEl) warningEl.style.opacity = '0';
            try {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                masterGain = audioCtx.createGain();
                masterGain.gain.value = 0.35;
                masterGain.connect(audioCtx.destination);
                startBGM();
            } catch (e) {}
        }

        window.addEventListener('click', initAudio);
        window.addEventListener('touchstart', initAudio);
        window.addEventListener('keydown', initAudio);

        function startBGM() {
            if (bgmPlaying || !audioCtx) return;
            bgmPlaying = true;
            const bgmGain = audioCtx.createGain();
            bgmGain.gain.value = 0.1;
            bgmGain.connect(masterGain);
            const notes = [261.63, 329.63, 392.00, 523.25, 392.00, 329.63, 293.66, 349.23];
            const noteDuration = 0.45;
            let noteIndex = 0;
            function playNextNote() {
                if (!bgmPlaying || !audioCtx) return;
                const osc = audioCtx.createOscillator();
                const noteGain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.value = notes[noteIndex % notes.length];
                noteGain.gain.setValueAtTime(0.001, audioCtx.currentTime);
                noteGain.gain.exponentialRampToValueAtTime(0.4, audioCtx.currentTime + 0.05);
                noteGain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + noteDuration * 0.9);
                osc.connect(noteGain);
                noteGain.connect(bgmGain);
                osc.start();
                osc.stop(audioCtx.currentTime + noteDuration);
                noteIndex++;
                setTimeout(playNextNote, noteDuration * 1000);
            }
            playNextNote();
        }

        function playTone(freq, type, dur, vol) {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type || 'square';
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            gain.gain.setValueAtTime(vol || 0.12, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
            osc.connect(gain);
            gain.connect(masterGain);
            osc.start();
            osc.stop(audioCtx.currentTime + dur);
        }

        function playSweep(f1, f2, type, dur, vol) {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type || 'square';
            osc.frequency.setValueAtTime(f1, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(f2, audioCtx.currentTime + dur);
            gain.gain.setValueAtTime(vol || 0.12, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
            osc.connect(gain);
            gain.connect(masterGain);
            osc.start();
            osc.stop(audioCtx.currentTime + dur);
        }

        function playSelectSound() { playSweep(880, 1320, 'square', 0.15, 0.12); }
        function playDeselectSound() { playSweep(440, 220, 'sine', 0.15, 0.1); }
        function playHoverSound() { playTone(660, 'sine', 0.06, 0.035); }
        function playBuySound() { playTone(523.25, 'square', 0.08, 0.12); setTimeout(() => playTone(659.25, 'square', 0.08, 0.12), 80); setTimeout(() => playTone(783.99, 'square', 0.15, 0.12), 160); }
        function playDeniedSound() { playTone(200, 'sawtooth', 0.15, 0.1); setTimeout(() => playTone(150, 'sawtooth', 0.15, 0.1), 100); }
        function playDialogueSound() { playTone(440 + Math.random() * 100, 'square', 0.04, 0.05); }
        function playEmptyClick() { playTone(1200, 'square', 0.02, 0.08); }
        function playReloadSound() {
            if (!audioCtx) return;
            playTone(500, 'square', 0.05, 0.1);
            setTimeout(() => playTone(700, 'square', 0.08, 0.1), 150);
            setTimeout(() => playTone(400, 'square', 0.05, 0.1), 300);
        }
        function playFreeSound() {
            if (!audioCtx) return;
            playTone(660, 'square', 0.08, 0.1);
            setTimeout(() => playTone(880, 'square', 0.08, 0.1), 100);
            setTimeout(() => playTone(1320, 'square', 0.15, 0.1), 200);
        }

        function playGunSound() {
            if (!audioCtx) return;
            const bufferSize = audioCtx.sampleRate * 0.15;
            const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) {
                data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / bufferSize, 2);
            }
            const noiseSource = audioCtx.createBufferSource();
            noiseSource.buffer = buffer;
            const noiseGain = audioCtx.createGain();
            noiseGain.gain.setValueAtTime(0.5, audioCtx.currentTime);
            noiseGain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.15);
            const noiseFilter = audioCtx.createBiquadFilter();
            noiseFilter.type = 'lowpass';
            noiseFilter.frequency.value = 1500;
            noiseSource.connect(noiseFilter);
            noiseFilter.connect(noiseGain);
            noiseGain.connect(masterGain);
            noiseSource.start();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(80, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(30, audioCtx.currentTime + 0.15);
            gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.2);
            osc.connect(gain);
            gain.connect(masterGain);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.2);
        }

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87ceeb);
        scene.fog = new THREE.Fog(0x87ceeb, 15, 40);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.05, 1000);
        camera.position.set(0, 1.6, 4);
        camera.lookAt(0, 1.6, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.2;
        document.body.appendChild(renderer.domElement);

        const ambient = new THREE.AmbientLight(0xffffff, 0.7);
        scene.add(ambient);

        const hemisphere = new THREE.HemisphereLight(0xffffff, 0xcccccc, 0.6);
        scene.add(hemisphere);

        const keyLight = new THREE.DirectionalLight(0xfff5e0, 1.0);
        keyLight.position.set(8, 12, 6);
        keyLight.castShadow = true;
        keyLight.receiveShadow = true;
        keyLight.shadow.mapSize.width = 2048;
        keyLight.shadow.mapSize.height = 2048;
        const d = 15;
        keyLight.shadow.camera.left = -d;
        keyLight.shadow.camera.right = d;
        keyLight.shadow.camera.top = d;
        keyLight.shadow.camera.bottom = -d;
        keyLight.shadow.camera.near = 1;
        keyLight.shadow.camera.far = 30;
        keyLight.shadow.bias = -0.0005;
        scene.add(keyLight);

        const fillLight = new THREE.PointLight(0xfff0dd, 0.5, 20);
        fillLight.position.set(-6, 4, 6);
        scene.add(fillLight);

        const ceilingLight1 = new THREE.PointLight(0xfff8e7, 0.7, 12);
        ceilingLight1.position.set(3, 6, 2);
        scene.add(ceilingLight1);

        const ceilingLight2 = new THREE.PointLight(0xfff8e7, 0.7, 12);
        ceilingLight2.position.set(-3, 6, 2);
        scene.add(ceilingLight2);

        const counterLight = new THREE.PointLight(0xfff0dd, 0.6, 8);
        counterLight.position.set(0, 4, -1);
        scene.add(counterLight);

        const floorMat = new THREE.MeshStandardMaterial({ color: 0xc9a76a, roughness: 0.85 });
        const floor = new THREE.Mesh(new THREE.BoxGeometry(14, 0.2, 14), floorMat);
        floor.position.set(0, -0.1, 0);
        floor.receiveShadow = true;
        scene.add(floor);

        const plankMat = new THREE.MeshStandardMaterial({ color: 0xa88855, roughness: 0.9 });
        for (let i = -6; i <= 6; i+=0.9) {
            const plank = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.02, 14), plankMat);
            plank.position.set(i, 0.005, 0);
            plank.receiveShadow = true;
            scene.add(plank);
        }

        const wallMat = new THREE.MeshStandardMaterial({ color: 0xe8d9b8, roughness: 0.95 });
        const wallTrimMat = new THREE.MeshStandardMaterial({ color: 0x8b6b3a, roughness: 0.85 });
        const wallThickness = 0.5;
        const roomSize = 14;
        const roomHeight = 6;

        const backWall = new THREE.Mesh(new THREE.BoxGeometry(roomSize, roomHeight, wallThickness), wallMat);
        backWall.position.set(0, roomHeight/2, -roomSize/2);
        backWall.receiveShadow = true;
        backWall.castShadow = true;
        scene.add(backWall);

        const frontWall = new THREE.Mesh(new THREE.BoxGeometry(roomSize, roomHeight, wallThickness), wallMat);
        frontWall.position.set(0, roomHeight/2, roomSize/2);
        frontWall.receiveShadow = true;
        frontWall.castShadow = true;
        scene.add(frontWall);

        const leftWall = new THREE.Mesh(new THREE.BoxGeometry(wallThickness, roomHeight, roomSize), wallMat);
        leftWall.position.set(-roomSize/2, roomHeight/2, 0);
        leftWall.receiveShadow = true;
        leftWall.castShadow = true;
        scene.add(leftWall);

        const rightWall = new THREE.Mesh(new THREE.BoxGeometry(wallThickness, roomHeight, roomSize), wallMat);
        rightWall.position.set(roomSize/2, roomHeight/2, 0);
        rightWall.receiveShadow = true;
        rightWall.castShadow = true;

        function createFallbackNeilTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 512;
            canvas.height = 512;
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, 512, 512);

            ctx.fillStyle = '#4a6b3a';
            ctx.fillRect(140, 340, 232, 172);
            ctx.strokeStyle = '#2a4b1a';
            ctx.lineWidth = 8;
            ctx.strokeRect(140, 340, 232, 172);

            ctx.beginPath();
            ctx.arc(256, 230, 140, 0, Math.PI * 2);
            ctx.fillStyle = '#f5d0b0';
            ctx.fill();
            ctx.strokeStyle = '#a0522d';
            ctx.lineWidth = 14;
            ctx.stroke();

            ctx.beginPath();
            ctx.arc(256, 180, 130, Math.PI, 0);
            ctx.fillStyle = '#5a3a2a';
            ctx.fill();

            ctx.fillStyle = '#fff';
            ctx.beginPath();
            ctx.arc(200, 220, 22, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(312, 220, 22, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#2c3e50';
            ctx.beginPath();
            ctx.arc(200, 220, 11, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(312, 220, 11, 0, Math.PI * 2);
            ctx.fill();

            ctx.beginPath();
            ctx.arc(256, 290, 50, 0.1, Math.PI - 0.1);
            ctx.strokeStyle = '#8b4513';
            ctx.lineWidth = 10;
            ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(256, 230);
            ctx.lineTo(256, 270);
            ctx.lineWidth = 8;
            ctx.strokeStyle = '#b87c5a';
            ctx.stroke();

            return new THREE.CanvasTexture(canvas);
        }

        function startAnimation(type, duration, extra) {
            currentAnimation = {
                type,
                startTime: performance.now() / 1000,
                duration,
                extra: extra || {}
            };
        }

        function updateAnimation(now) {
            handOffset.set(0, 0, 0);
            handRotOffset.set(0, 0, 0);

            if (!currentAnimation) {
                const t = now;
                handOffset.x = Math.sin(t * 1.5) * 0.008;
                handOffset.y = Math.sin(t * 2.0) * 0.012;
                return;
            }

            const elapsed = now - currentAnimation.startTime;
            const progress = Math.min(1, elapsed / currentAnimation.duration);
            const anim = currentAnimation;

            if (anim.type === 'drink') {
                let p1 = Math.min(1, progress / 0.4);
                let p2 = Math.min(1, Math.max(0, (progress - 0.4) / 0.35));
                let p3 = Math.min(1, Math.max(0, (progress - 0.75) / 0.25));
                let raiseAmount = p1 - p3;
                let tiltAmount = Math.sin(p2 * Math.PI);
                handOffset.x = -0.35 * raiseAmount;
                handOffset.y = 0.55 * raiseAmount;
                handOffset.z = 0.15 * raiseAmount;
                handRotOffset.x = -1.2 * raiseAmount - 0.6 * tiltAmount;
                handRotOffset.z = 0.4 * tiltAmount;
            } else if (anim.type === 'inject') {
                let p1 = Math.min(1, progress / 0.35);
                let p2 = Math.min(1, Math.max(0, (progress - 0.35) / 0.3));
                let p3 = Math.min(1, Math.max(0, (progress - 0.65) / 0.35));
                let toArm = p1 - p3;
                let push = Math.sin(p2 * Math.PI);
                handOffset.x = -0.5 * toArm - 0.1 * push;
                handOffset.y = 0.2 * toArm;
                handOffset.z = 0.1 * toArm;
                handRotOffset.y = 0.8 * toArm;
                handRotOffset.z = 0.6 * toArm;
                handRotOffset.x = -0.4 * toArm;
            } else if (anim.type === 'shoot') {
                handOffset.z = 0.25 * Math.exp(-progress * 4);
                handOffset.y = 0.05 * Math.exp(-progress * 4);
                handRotOffset.x = -0.5 * Math.exp(-progress * 4);
            } else if (anim.type === 'place') {
                let p1 = Math.min(1, progress / 0.6);
                let p2 = Math.min(1, Math.max(0, (progress - 0.6) / 0.4));
                let forward = p1 - p2;
                handOffset.x = -0.2 * forward;
                handOffset.y = -0.5 * forward;
                handOffset.z = -0.5 * forward;
                handRotOffset.x = 0.6 * forward;
            } else if (anim.type === 'reload') {
                handOffset.y = -0.4 * Math.sin(progress * Math.PI);
                handRotOffset.x = -0.8 * Math.sin(progress * Math.PI);
                handRotOffset.z = 0.5 * Math.sin(progress * Math.PI);
            }

            if (progress >= 1) {
                const cb = currentAnimation.onComplete;
                currentAnimation = null;
                if (cb) cb();
            }
        }

        function placeChairWithHeld() {
            if (!heldItemData || heldItemData.useType !== 'sit' || currentAnimation) return;
            const raycaster2 = new THREE.Raycaster();
            raycaster2.setFromCamera(centerScreen, camera);
            const groundIntersects = raycaster2.intersectObject(floor);

            if (groundIntersects.length > 0) {

                pt.x = Math.max(bounds.minX, Math.min(bounds.maxX, pt.x));
                pt.z = Math.max(bounds.minZ, Math.min(bounds.maxZ, pt.z));

        function fireGun() {
            if (!heldItemData || heldItemData.useType !== 'shoot') return;
            if (isReloading) { showToast('Reloading...'); return; }
            if (currentAnimation && currentAnimation.type === 'shoot') return;

            if (ammo <= 0) {

            ammo--;

            startAnimation('shoot', 0.4);

            raycaster.setFromCamera(centerScreen, camera);
            const shootables = [...itemMeshes, ...(neilMesh ? [neilMesh] : [])];
            const hits = raycaster.intersectObjects(shootables, true);

            if (hits.length > 0) {
                const hit = hits[0];
                const hitRoot = findRootItem(hit.object);

                if (hit.object.userData.isNeil || (hitRoot && hitRoot.userData.isNeil)) {
                    if (!neilDead) {
                        setTimeout(() => {
                            neilDead = true;
                            neilGroup.rotation.z = -Math.PI / 2;

                            updateFreeBadge();
                            markAllFree();
                        }, 150);
                    }
                } else {
                    createBulletHole(hit.point, hit.face ? hit.face.normal : null, hit.object);

                    if (hitRoot && hitRoot.userData.name) {
                        const itemName = hitRoot.userData.name;
                        showToast('Hit: ' + itemName);
                        if (itemName === 'Glass of Milk' || itemName === 'Bottle of Gin') {

                        }

                }
            }
        }

        function createBulletHole(point, normal, parentMesh) {
            const holeGeo = new THREE.CircleGeometry(0.06, 8);
            const holeMat = new THREE.MeshBasicMaterial({ color: 0x111111, side: THREE.DoubleSide, transparent: true, opacity: 0.9 });
            const hole = new THREE.Mesh(holeGeo, holeMat);

            if (normal) {
                const worldNormal = normal.clone().transformDirection(parentMesh.matrixWorld).normalize();
                hole.position.copy(point).add(worldNormal.clone().multiplyScalar(0.01));
                hole.lookAt(point.clone().add(worldNormal));
            } else {
                hole.position.copy(point);
                hole.lookAt(camera.position);
            }

            scene.add(hole);
            bulletHoles.push({ mesh: hole, time: performance.now() / 1000 });

            if (bulletHoles.length > 50) {
                const old = bulletHoles.shift();
                scene.remove(old.mesh);
            }
        }

        function checkGunPointing() {

            if (!neilMesh) {
                gunPointedAtNeil = false;
                return;

            raycaster.setFromCamera(centerScreen, camera);
            const neilHits = raycaster.intersectObject(neilMesh);
            const prevGunPoint = gunPointedAtNeil;
            gunPointedAtNeil = neilHits.length > 0 && neilHits[0].distance < 10;

            if (gunPointedAtNeil !== prevGunPoint) {
                updateFreeBadge();

            if (gunPointedAtNeil && !prevGunPoint) {

        }

            }

            if (pointerLocked && !sittingOnChair) {
                const forward = new THREE.Vector3(-Math.sin(yaw), 0, -Math.cos(yaw));
                const right = new THREE.Vector3(Math.cos(yaw), 0, -Math.sin(yaw));
                const velocity = new THREE.Vector3();

                if (keys['KeyW'] || keys['ArrowUp']) velocity.add(forward);
                if (keys['KeyS'] || keys['ArrowDown']) velocity.sub(forward);
                if (keys['KeyD'] || keys['ArrowRight']) velocity.add(right);
                if (keys['KeyA'] || keys['ArrowLeft']) velocity.sub(right);

                if (velocity.lengthSq() > 0) {
                    velocity.normalize();
                    let speed = moveSpeed;
                    if (keys['ShiftLeft'] || keys['ShiftRight']) speed *= runMultiplier;
                    camera.position.addScaledVector(velocity, speed * delta);
                }

                camera.position.x = Math.max(bounds.minX, Math.min(bounds.maxX, camera.position.x));
                camera.position.z = Math.max(bounds.minZ, Math.min(bounds.maxZ, camera.position.z));
                camera.position.y = eyeHeight;
            }

            if (sittingOnChair && placedChairData) {
                const chairPos = placedChairData.mesh.position;
                const targetPos = new THREE.Vector3(chairPos.x, 1.15, chairPos.z);
                camera.position.lerp(targetPos, 0.2);
            }

            const lookDir = new THREE.Vector3(
                -Math.sin(yaw) * Math.cos(pitch),
                Math.sin(pitch),
                -Math.cos(yaw) * Math.cos(pitch)
            );
            camera.lookAt(camera.position.clone().add(lookDir));

            if (neilMesh && !neilDead) {
                neilGroup.lookAt(camera.position.x, neilGroup.position.y, camera.position.z);
            }

            updateAnimation(now);

            let rigPos = handBasePos.clone().add(handOffset);
            let rigRotX = handBaseRot.x + handRotOffset.x;
            let rigRotY = handBaseRot.y + handRotOffset.y;
            let rigRotZ = handBaseRot.z + handRotOffset.z;

            if (heldItemData && heldItemData.useType === 'shoot' && (!currentAnimation || currentAnimation.type !== 'shoot')) {
                const gunAimPos = new THREE.Vector3(0.0, -0.15, -0.45);
                rigPos.lerp(gunAimPos, 0.25);
                rigRotX = rigRotX * 0.7;
                rigRotY = rigRotY * 0.7;
                rigRotZ = rigRotZ * 0.7;
            }

            handRig.position.copy(rigPos);
            handRig.rotation.set(rigRotX, rigRotY, rigRotZ);

            if (heldItemData && !currentAnimation) {
                const moving = keys['KeyW'] || keys['KeyA'] || keys['KeyS'] || keys['KeyD'];
                if (moving) {
                    handRig.position.y += Math.sin(now * 10) * 0.01;
                    handRig.position.x += Math.cos(now * 10) * 0.008;
                }
            }

            raycaster.setFromCamera(centerScreen, camera);
            const intersects = raycaster.intersectObjects(itemMeshes, true);
            let currentHover = null;
            if (intersects.length > 0 && intersects[0].distance < 4.5) {
                const root = findRootItem(intersects[0].object);
                if (root && root.userData.name && root.visible) currentHover = root;
            }

            let hoverNeil = false;
            if (!currentHover && neilMesh && !neilDead) {
                const neilIntersects = raycaster.intersectObject(neilMesh);
                if (neilIntersects.length > 0 && neilIntersects[0].distance < 6) hoverNeil = true;
            }

            let nearChairToSit = false;
            if (placedChairData && !sittingOnChair) {
                if (camera.position.distanceTo(placedChairData.mesh.position) < 1.8) nearChairToSit = true;
            }

            checkGunPointing();

            if (currentHover !== hoveredItem) {
                hoveredItem = currentHover;
                if (hoveredItem) {
                    playHoverSound();
                    promptEl.textContent = '[E] INSPECT';
                    promptEl.classList.add('visible');
                    setCursorVisible(true);
                } else if (hoverNeil) {
                    promptEl.textContent = '[E] TALK TO NEIL';
                    promptEl.classList.add('visible');
                    setCursorVisible(true);
                } else if (nearChairToSit && !sittingOnChair) {
                    promptEl.textContent = '[F] SIT · [G] PICK UP';
                    promptEl.classList.add('visible');
                    setCursorVisible(true);
                } else if (sittingOnChair) {
                    promptEl.textContent = '[F] STAND UP';
                    promptEl.classList.add('visible');
                    setCursorVisible(true);
                } else {
                    promptEl.classList.remove('visible');
                    setCursorVisible(false);
                }
            } else if (hoverNeil && !hoveredItem) {
                promptEl.textContent = '[E] TALK TO NEIL';
                promptEl.classList.add('visible');
                setCursorVisible(true);
            } else if (nearChairToSit && !hoveredItem && !hoverNeil && !sittingOnChair) {
                promptEl.textContent = '[F] SIT · [G] PICK UP';
                promptEl.classList.add('visible');
                setCursorVisible(true);
            } else if (sittingOnChair && !hoveredItem && !hoverNeil) {
                promptEl.textContent = '[F] STAND UP';
                promptEl.classList.add('visible');
                setCursorVisible(true);
            } else if (!hoveredItem && !hoverNeil && !nearChairToSit && !sittingOnChair) {
                promptEl.classList.remove('visible');
                setCursorVisible(false);
            }

            if (heldItemData && heldItemData.useType === 'shoot' && gunPointedAtNeil) {
                crosshairEl.classList.add('hostile');
            } else {
                crosshairEl.classList.remove('hostile');
            }

            if (hoverNeil && keys['KeyE']) {
                keys['KeyE'] = false;
                neilSpeak('greeting');
            }

            items.forEach((item, index) => {
                if (item !== selectedItem && item.visible && item !== placedChairData?.mesh) {
                    const floatY = Math.sin(elapsedTime * 1.5 + index) * 0.05;
                    item.position.x = item.userData.originalPos.x;
                    item.position.z = item.userData.originalPos.z;
                    item.position.y = item.userData.originalPos.y + floatY;
                    item.rotation.y += 0.003;
                }
            });

            glowRings.forEach((entry) => {
                if (entry.ring) {
                    if (!entry.item.visible || entry.item === placedChairData?.mesh) {
                        entry.ring.visible = false;
                        return;
                    }
                    entry.ring.visible = true;
                    const floatY = Math.sin(elapsedTime * 1.5) * 0.05;
                    entry.ring.position.x = entry.offset.x;
                    entry.ring.position.z = entry.offset.z;
                    entry.ring.position.y = entry.offset.y - 0.25 + floatY;
                }
            });

            itemLights.forEach((entry) => {
                if (entry.light) {
                    if (!entry.item.visible || entry.item === placedChairData?.mesh) {
                        entry.light.visible = false;
                        return;
                    }
                    entry.light.visible = true;
                    const floatY = Math.sin(elapsedTime * 1.5) * 0.05;
                    entry.light.position.x = entry.offset.x;
                    entry.light.position.z = entry.offset.z;
                    entry.light.position.y = entry.offset.y + 0.6 + floatY;
                }
            });

            particles.rotation.y += 0.0002;

            renderer.render(scene, camera);
            requestAnimationFrame(animate);
        }

        const chairItem = items.find(i => i.userData.name === 'Cuck Chair');
        if (chairItem) chairItem.visible = true;

        animate();
    </script>
</body>
</html>
