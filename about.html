<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="shortcut icon" href="img/amogus.webp" type="image/x-icon" />
  <link rel="stylesheet" href="index.css" />
  <title>About</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      overflow-x: hidden;
      background: #ffffff;
      color: #080808;
    }

    .about-section {
      position: relative;
      min-height: 70vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      overflow: hidden;
    }

    .header1 {
      position: relative;
      z-index: 5;
      padding: 40px 0;
    }

    .section-title {
      font-size: clamp(3rem, 8vw, 8rem);
      line-height: 0.9;
      margin: 0;
      text-transform: uppercase;
      letter-spacing: -0.06em;
      transform: rotate(-2deg) skew(-5deg);
      background: linear-gradient(90deg, #ff3cac, #fffd00, #00e5ff, #b400ff, #ff3cac);
      background-size: 400% 100%;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      filter:
        drop-shadow(5px 5px 0 #ff3cac)
        drop-shadow(-3px -3px 0 #00e5ff)
        drop-shadow(8px 8px 0 rgba(0,0,0,0.15));
      animation: gradient-shift 3s linear infinite;
    }

    @keyframes gradient-shift {
      0% { background-position: 0% 50%; }
      100% { background-position: 400% 50%; }
    }

    .about-section::before,
    .about-section::after {
      content: "";
      position: absolute;
      pointer-events: none;
      z-index: 0;
    }

    .about-section::before {
      width: 55vw;
      height: 55vw;
      max-width: 900px;
      max-height: 900px;
      right: -20vw;
      top: 0%;
      border: 8px dashed rgba(255, 0, 255, 0.25);
      border-radius: 50%;
      transform: rotate(20deg);
      box-shadow:
        0 0 0 40px rgba(0, 255, 255, 0.1),
        0 0 0 80px rgba(255, 255, 0, 0.08),
        0 0 0 120px rgba(255, 0, 200, 0.06);
      animation: spin-slow 18s linear infinite;
    }

    @keyframes spin-slow {
      0% { transform: rotate(20deg); }
      100% { transform: rotate(380deg); }
    }

    .about-section::after {
      inset: 0;
      background-image:
        linear-gradient(rgba(0,0,0,.06) 2px, transparent 2px),
        linear-gradient(90deg, rgba(0,0,0,.06) 2px, transparent 2px);
      background-size: 60px 60px;
      mask-image: linear-gradient(to bottom, transparent, black 15%, black 85%, transparent);
      animation: grid-pulse 6s ease-in-out infinite;
    }

    @keyframes grid-pulse {
      0%, 100% { opacity: 0.6; }
      50% { opacity: 1; }
    }

    .scrolling-content {
      position: relative;
      z-index: 3;
      width: 100vw;
      margin-left: calc(50% - 50vw);
      overflow: hidden;
      padding: 35px 0;
      transform: rotate(-3deg) scale(1.05);
      background: #fff;
      color: #080808;
      border-top: 8px solid #080808;
      border-bottom: 8px solid #080808;
      box-shadow:
        0 12px 0 #ff3cac,
        0 -8px 0 #00e5ff,
        0 20px 0 #fffd00,
        0 -16px 0 #b400ff;
    }

    .scroll-track {
      display: flex;
      width: max-content;
      animation: chaos-scroll 9s linear infinite;
      will-change: transform;
    }

    .rainbow-text {
      display: flex;
      align-items: center;
      flex: 0 0 max-content;
      width: max-content;
      white-space: nowrap;
    }

    .rainbow-text span {
      display: inline-block;
      font-size: clamp(3rem, 7vw, 7rem);
      font-weight: 1000;
      line-height: 0.8;
      letter-spacing: -0.06em;
      text-transform: uppercase;
      padding: 0 25px;
      transform: skew(-8deg) rotate(2deg);
      text-shadow: 3px 3px 0 rgba(0,0,0,0.2);
      animation: rainbow-cycle 2s linear infinite;
    }

    @keyframes rainbow-cycle {
      0% { color: #ff3cac; }
      20% { color: #fffd00; }
      40% { color: #00e5ff; }
      60% { color: #b400ff; }
      80% { color: #ff8c00; }
      100% { color: #ff3cac; }
    }

    .rainbow-text span:nth-of-type(1) {
      animation-delay: 0s;
    }

    .rainbow-text span:nth-of-type(2) {
      animation-delay: 0.4s;
      transform: skew(8deg) rotate(-3deg) scale(1.1);
    }

    .rainbow-text span:nth-of-type(3) {
      animation-delay: 0.8s;
      transform: skew(-12deg) rotate(5deg) scale(0.95);
    }

    .rainbow-text span:nth-of-type(4) {
      animation-delay: 1.2s;
      transform: skew(12deg) rotate(-5deg) scale(1.15);
    }

    .scrolling-gif {
      width: clamp(50px, 7vw, 100px);
      height: clamp(50px, 7vw, 100px);
      object-fit: contain;
      margin: 0 15px;
      transform: rotate(8deg);
      flex-shrink: 0;
      filter: drop-shadow(0 0 10px #ff3cac) drop-shadow(0 0 20px #00e5ff);
      animation: gif-wobble 1.2s ease-in-out infinite alternate;
    }

    @keyframes gif-wobble {
      0% { transform: rotate(8deg) scale(1); }
      100% { transform: rotate(-12deg) scale(1.2); }
    }

    .scrolling-gif:nth-of-type(even) {
      transform: rotate(-12deg) scale(1.15);
      animation-delay: -0.6s;
    }

    @keyframes chaos-scroll {
      from {
        transform: translateX(0);
      }

      to {
        transform: translateX(-50%);
      }
    }

    .chaos-row {
      position: relative;
      z-index: 2;
      width: 100vw;
      margin-left: calc(50% - 50vw);
      margin-top: 70px;
      overflow: hidden;
      transform: rotate(2deg) scale(1.08);
      background: linear-gradient(90deg, #b30000, #ff0066, #b30000, #ff0066);
      background-size: 300% 100%;
      color: white;
      border-top: 6px solid #080808;
      border-bottom: 6px solid #080808;
      animation: bg-slide 4s linear infinite;
    }

    @keyframes bg-slide {
      0% { background-position: 0% 50%; }
      100% { background-position: 300% 50%; }
    }

    .chaos-track {
      display: flex;
      width: max-content;
      animation: chaos-scroll-reverse 12s linear infinite;
      will-change: transform;
    }

    .chaos-track > div {
      flex: 0 0 max-content;
      width: max-content;
    }

    .chaos-track span {
      display: block;
      padding: 15px 30px;
      font-size: clamp(1.8rem, 3.5vw, 3.5rem);
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      white-space: nowrap;
      text-shadow:
        2px 2px 0 #000,
        4px 4px 0 rgba(0,0,0,0.3);
      background: linear-gradient(180deg, #fff, #ffe600, #ff3cac, #00e5ff, #fff);
      background-size: 100% 300%;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      animation: text-shine 2.5s linear infinite;
    }

    @keyframes text-shine {
      0% { background-position: 0% 0%; }
      100% { background-position: 0% 300%; }
    }

    @keyframes chaos-scroll-reverse {
      from {
        transform: translateX(-50%);
      }

      to {
        transform: translateX(0);
      }
    }

    .bg-shape {
      position: absolute;
      z-index: 1;
      pointer-events: none;
    }

    .bg-star {
      font-size: clamp(2rem, 5vw, 6rem);
      animation: float 4s ease-in-out infinite;
      filter: drop-shadow(0 0 15px #ff3cac) drop-shadow(0 0 30px #00e5ff);
    }

    .star-1 {
      top: 15%;
      left: 8%;
      transform: rotate(15deg);
      color: #ff3cac;
      animation-delay: -0.5s;
    }

    .star-2 {
      right: 12%;
      bottom: 15%;
      transform: rotate(-20deg);
      animation-delay: -2s;
      color: #fffd00;
      font-size: clamp(3rem, 6vw, 7rem);
    }

    .star-3 {
      left: 35%;
      bottom: 5%;
      font-size: clamp(2rem, 4vw, 4rem);
      animation-delay: -1s;
      color: #00e5ff;
    }

    .bg-circle {
      width: 35px;
      height: 35px;
      border: 8px solid currentColor;
      border-radius: 50%;
      animation: pulse-glow 2s ease-in-out infinite;
    }

    @keyframes pulse-glow {
      0%, 100% { transform: scale(1); opacity: 0.7; }
      50% { transform: scale(1.3); opacity: 1; }
    }

    .circle-1 {
      top: 25%;
      left: 25%;
      color: #ff00cc;
      animation-delay: -0.5s;
    }

    .circle-2 {
      right: 30%;
      bottom: 20%;
      width: 55px;
      height: 55px;
      color: #00ffcc;
      animation-delay: -1s;
    }

    @keyframes float {
      0%, 100% {
        translate: 0 0;
      }

      50% {
        translate: 0 -25px;
      }
    }

    @media (max-width: 700px) {
      .about-section {
        min-height: 80vh;
      }

      .header1 {
        padding: 30px 15px;
      }

      .scrolling-content {
        padding: 25px 0;
        transform: rotate(-4deg) scale(1.12);
        box-shadow:
          0 10px 0 #ff3cac,
          0 -6px 0 #00e5ff,
          0 16px 0 #fffd00,
          0 -12px 0 #b400ff;
      }

      .chaos-row {
        margin-top: 50px;
        transform: rotate(3deg) scale(1.15);
      }

      .bg-star {
        opacity: 0.6;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .scroll-track,
      .chaos-track,
      .bg-star,
      .bg-circle,
      .scrolling-gif,
      .section-title,
      .chaos-row,
      .about-section::before,
      .about-section::after,
      .rainbow-text span,
      .chaos-track span {
        animation: none !important;
      }
    }
  </style>
</head>

<body>

  <div class="wrapper">

    <div class="site-header"></div>

    <main>

      <section class="about-section container">

        <div class="bg-shape bg-star star-1">✦</div>
        <div class="bg-shape bg-star star-2">✹</div>
        <div class="bg-shape bg-star star-3">★</div>

        <div class="bg-shape bg-circle circle-1"></div>
        <div class="bg-shape bg-circle circle-2"></div>

        <div class="header1">
          <h2 class="section-title">
            <u>What are we about?</u>
          </h2>
        </div>

        <div class="scrolling-content">

          <div class="scroll-track">

            <div class="rainbow-text">
              <img src="img/amogus.gif" class="scrolling-gif" />
              <span>CHAOS</span>

              <img src="img/amogus.gif" class="scrolling-gif" />

              <img src="img/amogus.gif" class="scrolling-gif" />
              <span>CHAOS</span>

              <img src="img/amogus.gif" class="scrolling-gif" />
              <span>CHAOS</span>
            </div>

            <div class="rainbow-text" aria-hidden="true">
              <img src="img/amogus.gif" class="scrolling-gif" />
              <span>CHAOS</span>

              <img src="img/amogus.gif" class="scrolling-gif" />
              <span>CHAOS</span>

              <img src="img/amogus.gif" class="scrolling-gif" />
              <span>CHAOS</span>

              <img src="img/amogus.gif" class="scrolling-gif" />
              <span>CHAOS</span>
            </div>

          </div>
        </div>

        <div class="chaos-row">

          <div class="chaos-track">

            <div>
              <span>★ SUS ★ AMONG ★ SMEFF ★ MAYO ★ FARD ★</span>
            </div>

            <div aria-hidden="true">
              <span>★ SUS ★ AMONG ★ SMEFF ★ MAYO ★ FARD ★</span>
            </div>

          </div>

        </div>

      </section>

    </main>

    <div class="site-footer"></div>

  </div>

  <script src="header.js"></script>

</body>
</html>
