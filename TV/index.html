<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>SusFeed Video</title>
  <link rel="shortcut icon" href="../img/amogus.webp" type="image/x-icon" />
  <link rel="icon" href="../img/amogus.webp" type="image/webp" id="dynamic-favicon" />
  <link rel="stylesheet" href="index.css" />
</head>
<body>

<div class="wrapper">
  <header class="site-header">
    <div class="header-top">
      <div class="header-left">
        <button id="menu-toggle" class="icon-btn" aria-label="Menu">
          <span></span><span></span><span></span>
        </button>
        <a href="./" id="logo-link" class="logo-link">
          <img src="img/logo.png" alt="SusTube" class="logo-img" />
        </a>
      </div>

      <div class="header-center">
        <div class="search-container">
          <input
            id="video-search"
            type="text"
            placeholder="Search"
            class="search-input"
            autocomplete="off"
          />
          <button id="search-btn" class="search-btn" aria-label="Search">
            <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
          </button>
          <div id="autocomplete" class="autocomplete hidden"></div>
        </div>
      </div>

      <div class="header-right"></div>
    </div>
  </header>

  <div class="page-layout">
    <div id="sidebar-overlay" class="sidebar-overlay"></div>
    <aside id="sidebar" class="sidebar collapsed">
    <nav class="sidebar-nav">
      <a href="#/" class="sidebar-item active" data-page="home">
        <svg viewBox="0 0 24 24" width="24" height="24">
          <path fill="#ba1a1a" d="M12 3L2 12h3v9h5v-6h4v6h5v-9h3L12 3z"/>
          <ellipse cx="9.5" cy="10.5" rx="1.3" ry="1.8" fill="#0f0f0f"/>
          <ellipse cx="14.5" cy="10.5" rx="1.3" ry="1.8" fill="#0f0f0f"/>
        </svg>
        <span>Home</span>
      </a>
      <a href="#/shorts" class="sidebar-item" data-page="shorts">
        <svg viewBox="0 0 24 24" width="24" height="24">
          <rect x="6.5" y="2.5" width="11" height="19" rx="2.5" fill="none" stroke="#ba1a1a" stroke-width="2"/>
          <path fill="#ba1a1a" d="M10.5 8.5v7l6-3.5z"/>
        </svg>
        <span>Shorts</span>
      </a>
      <a href="live.html" class="sidebar-item" data-page="live">
        <svg viewBox="0 0 24 24" width="24" height="24">
          <circle cx="12" cy="12" r="2.5" fill="#ba1a1a"/>
          <path d="M7 7a7 7 0 0 0 0 10M17 7a7 7 0 0 1 0 10" stroke="#ba1a1a" stroke-width="2" stroke-linecap="round" fill="none"/>
          <path d="M4 4a11 11 0 0 0 0 16M20 4a11 11 0 0 1 0 16" stroke="#ba1a1a" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.5"/>
        </svg>
        <span>Live TV</span>
      </a>
      <a href="#/page/subscriptions" class="sidebar-item" data-page="subscriptions">
        <svg viewBox="0 0 24 24" width="24" height="24">
          <circle cx="12" cy="12" r="9.5" fill="none" stroke="#ba1a1a" stroke-width="1.5"/>
          <ellipse cx="9" cy="10.5" rx="1.6" ry="2.2" fill="#ba1a1a"/>
          <ellipse cx="15" cy="10.5" rx="1.6" ry="2.2" fill="#ba1a1a"/>
          <path d="M7.5 15.5c1 1.3 2.7 2 4.5 2s3.5-.7 4.5-2" stroke="#ba1a1a" stroke-width="1.6" stroke-linecap="round" fill="none"/>
        </svg>
        <span>Subscriptions</span>
      </a>
      <div class="sidebar-divider"></div>
      <a href="#/page/history" class="sidebar-item" data-page="history">
        <svg viewBox="0 0 24 24" width="24" height="24">
          <path d="M12 4.5a7.5 7.5 0 1 0 7.5 7.5" fill="none" stroke="#ba1a1a" stroke-width="2" stroke-linecap="round"/>
          <path d="M19.5 4.5v5h-5" fill="none" stroke="#ba1a1a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M12 8.5v4l2.8 1.7" stroke="#ba1a1a" stroke-width="2" stroke-linecap="round" fill="none"/>
        </svg>
        <span>History</span>
      </a>
      <a href="#/page/liked" class="sidebar-item" data-page="liked">
        <svg viewBox="0 0 24 24" width="24" height="24">
          <path fill="#ba1a1a" d="M12 21s-8-5-8-11a5 5 0 0 1 8-4 5 5 0 0 1 8 4c0 6-8 11-8 11z"/>
          <ellipse cx="9.3" cy="10" rx="1.3" ry="1.8" fill="#0f0f0f"/>
          <ellipse cx="14.7" cy="10" rx="1.3" ry="1.8" fill="#0f0f0f"/>
        </svg>
        <span>Liked videos</span>
      </a>
      <a href="#/page/disliked" class="sidebar-item" data-page="disliked">
        <svg viewBox="0 0 24 24" width="24" height="24">
          <path fill="#ba1a1a" d="M12 3s8 5 8 11a5 5 0 0 1-8 4 5 5 0 0 1-8-4c0-6 8-11 8-11z"/>
          <ellipse cx="9.3" cy="14" rx="1.3" ry="1.8" fill="#0f0f0f"/>
          <ellipse cx="14.7" cy="14" rx="1.3" ry="1.8" fill="#0f0f0f"/>
        </svg>
        <span>Disliked videos</span>
      </a>
    </nav>
</aside>

    <main class="content">
      <section id="shorts-shelf" class="shorts-section">
        <div class="shorts-header">
          <svg viewBox="0 0 24 24" width="24" height="24" class="shorts-logo">
            <rect x="7" y="2" width="10" height="20" rx="2.5" fill="#ba1a1a"/>
            <path fill="#0f0f0f" d="M10.5 8.5v7l6-3.5z"/>
          </svg>
          <span class="shorts-title">Shorts</span>
        </div>
        <div id="shorts-row" class="shorts-row"></div>
      </section>

      <section id="video-section">
        <div id="video-grid" class="video-grid"></div>
        <div id="scroll-sentinel" class="scroll-sentinel"></div>
      </section>

      <section id="watch-section" class="watch-section hidden"></section>

      <section id="channel-section" class="channel-section hidden"></section>

      <section id="subscriptions-section" class="subscriptions-section hidden">
        <div class="subs-header">
          <h2 class="subs-title">Subscriptions</h2>
        </div>
        <div id="subs-channels" class="subs-channels"></div>
        <div id="subs-feed" class="video-grid"></div>
        <div id="subs-shorts" class="subs-shorts hidden">
          <div class="shorts-header">
            <svg viewBox="0 0 24 24" width="24" height="24">
              <rect x="7" y="2" width="10" height="20" rx="2.5" fill="#ba1a1a"/>
              <path fill="#0f0f0f" d="M10.5 8.5v7l6-3.5z"/>
            </svg>
            <span class="shorts-title">Shorts</span>
          </div>
          <div id="subs-shorts-row" class="shorts-row"></div>
        </div>
      </section>

      <section id="history-section" class="history-section hidden">
        <div class="history-header">
          <h2 class="history-title">Watch history</h2>
          <button id="clear-history-btn" class="clear-history-btn">Clear all watch history</button>
        </div>
        <div id="history-list" class="history-list"></div>
      </section>
    </main>
  </div>

  <footer class="site-footer">©2026 SusFeed Video</footer>
</div>

<div id="shorts-modal" class="shorts-modal hidden">
  <button id="shorts-close-btn" class="close-btn">✕</button>
  <button id="shorts-up" class="shorts-nav shorts-up" aria-label="Previous">▲</button>
  <button id="shorts-down" class="shorts-nav shorts-down" aria-label="Next">▼</button>
  <div id="shorts-container" class="shorts-container"></div>
</div>

<div id="mini-player" class="mini-player hidden">
  <button class="mini-player-close" id="mini-player-close" aria-label="Close">✕</button>
  <button class="mini-player-expand" id="mini-player-expand" aria-label="Expand">⤢</button>
  <video id="mini-player-video" playsinline controls></video>
</div>

<div id="toast-container" class="toast-container"></div>

<script src="index.js"></script>
</body>
</html>
