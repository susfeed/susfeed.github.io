<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SusFeed TV</title>
  <link rel="shortcut icon" href="../img/amogus.webp" type="image/x-icon" />
  <link rel="stylesheet" href="index.css" />
</head>
<body>

<div class="wrapper">
  <header class="site-header">
    <div class="header-top logo-bar">
      <a href="../index.html">
        <img src="img/logo.png" alt="SusTube" class="logo-img" />
      </a>
    </div>

    <nav class="main-nav">
      <ul class="nav-links">
        <li><a href="../index.html">Home</a></li>
        <li><a href="index.html">Watch</a></li>
        <li><a href="live.html">Live TV</a></li>
      </ul>
    </nav>
  </header>

  <main class="container live-container-page">
    <div class="live-wrapper">
      <video id="live-player" autoplay playsinline></video>

      <div class="live-overlay">
        <div class="live-bug">
          LIVE <span class="channel-num">CH 69</span>
          <div id="channel-popup" class="channel-popup hidden">
            <div class="popup-number"></div>
            <div class="popup-name"></div>
          </div>
        </div>
        <div class="live-title" id="live-title">Now Playing</div>
      </div>

      <button id="mobile-play" class="mobile-play hidden">▶ Tap to Play</button>
      <img src="img/logo.png" class="live-watermark" alt="" />

      <div class="live-controls">
        <div class="channel-controls">
          <button id="ch-down" aria-label="Previous channel">◀</button>
          <button id="ch-up" aria-label="Next channel">▶</button>
        </div>
        <button id="fs-btn" class="fs-btn" aria-label="Fullscreen">⛶</button>
      </div>
    </div>
  </main>

  <footer class="site-footer">©2026 SusFeed Video</footer>
</div>

<script src="live.js"></script>
</body>
</html>
